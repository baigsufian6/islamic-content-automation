name: Cloud Arabic Layout Test

on:
  workflow_dispatch:

jobs:
  arabic-layout-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FFmpeg and Arabic font support
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          fc-match "Noto Naskh Arabic"

      - name: Create test subtitle file
        run: |
          mkdir -p output

          cat > output/test.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Reference,Noto Sans,46,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,3,1,8,80,80,140,1
          Style: Arabic,Noto Naskh Arabic,82,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,80,80,0,1
          Style: English,Noto Sans,48,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,100,100,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:04.00,Reference,,0,0,140,,SURAH 999 • TEST SURAH • AYAH 1
          Dialogue: 0,0:00:00.00,0:00:04.00,Arabic,,0,0,0,,اختبار
          Dialogue: 0,0:00:00.00,0:00:04.00,English,,0,0,0,,TEST TEXT 999:1

          Dialogue: 0,0:00:04.00,0:00:08.00,Reference,,0,0,140,,SURAH 999 • TEST SURAH • AYAH 2
          Dialogue: 0,0:00:04.00,0:00:08.00,Arabic,,0,0,0,,اختبار
          Dialogue: 0,0:00:04.00,0:00:08.00,English,,0,0,0,,TEST TEXT 999:2

          Dialogue: 0,0:00:08.00,0:00:12.00,Reference,,0,0,140,,SURAH 999 • TEST SURAH • AYAH 3
          Dialogue: 0,0:00:08.00,0:00:12.00,Arabic,,0,0,0,,اختبار
          Dialogue: 0,0:00:08.00,0:00:12.00,English,,0,0,0,,TEST TEXT 999:3

          Dialogue: 0,0:00:12.00,0:00:16.00,Reference,,0,0,140,,SURAH 999 • TEST SURAH • AYAH 4
          Dialogue: 0,0:00:12.00,0:00:16.00,Arabic,,0,0,0,,اختبار
          Dialogue: 0,0:00:12.00,0:00:16.00,English,,0,0,0,,TEST TEXT 999:4
          EOF

      - name: Create cinematic test background
        run: |
          ffmpeg \
            -y \
            -f lavfi \
            -i "gradients=s=1080x1920:r=30" \
            -t 16 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/background.mp4

      - name: Render Arabic and English test
        run: |
          ffmpeg \
            -y \
            -i output/background.mp4 \
            -vf "subtitles=output/test.ass:fontsdir=/usr/share/fonts/truetype/noto" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/arabic-layout-test.mp4

      - name: Verify output
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/arabic-layout-test.mp4

      - name: Upload temporary test
        uses: actions/upload-artifact@v6
        with:
          name: arabic-layout-test
          path: output/arabic-layout-test.mp4
          retention-days: 1
