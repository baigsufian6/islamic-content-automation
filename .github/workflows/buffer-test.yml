name: Buffer API Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-buffer:
    runs-on: ubuntu-latest

    steps:
      - name: Test Buffer API
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          api_key = os.environ.get("BUFFER_API_KEY")

          if not api_key:
              print("ERROR: BUFFER_API_KEY secret is missing.")
              sys.exit(1)

          endpoint = "https://api.buffer.com"

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}",
          }

          def buffer_request(query):
              body = json.dumps({
                  "query": query
              }).encode("utf-8")

              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers=headers,
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      raw = response.read().decode("utf-8")

              except urllib.error.HTTPError as exc:
                  print(
                      f"ERROR: Buffer API HTTP {exc.code}"
                  )
                  print(
                      exc.read().decode("utf-8", errors="replace")
                  )
                  sys.exit(1)

              except urllib.error.URLError as exc:
                  print(
                      f"ERROR: Could not reach Buffer API: {exc}"
                  )
                  sys.exit(1)

              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print("ERROR: Buffer returned invalid JSON.")
                  print(raw)
                  sys.exit(1)

              if data.get("errors"):
                  print("ERROR: Buffer API returned GraphQL errors:")
                  print(
                      json.dumps(
                          data["errors"],
                          indent=2,
                      )
                  )
                  sys.exit(1)

              return data

          # ------------------------------------------------------------
          # 1. Get Buffer organizations
          # ------------------------------------------------------------

          print("")
          print("========================================")
          print("STEP 1: GET BUFFER ORGANIZATIONS")
          print("========================================")

          organization_query = """
          query GetOrganizations {
            account {
              organizations {
                id
                name
              }
            }
          }
          """

          data = buffer_request(organization_query)

          organizations = (
              data
              .get("data", {})
              .get("account", {})
              .get("organizations", [])
          )

          if not organizations:
              print("")
              print("ERROR: No Buffer organizations were found.")
              sys.exit(1)

          print("")

          for organization in organizations:
              print(
                  f"Organization: {organization.get('name')}"
              )
              print(
                  f"Organization ID: {organization.get('id')}"
              )
              print("")

          # ------------------------------------------------------------
          # 2. Get channels for the first organization
          # ------------------------------------------------------------

          organization_id = organizations[0].get("id")

          if not organization_id:
              print(
                  "ERROR: Buffer organization has no ID."
              )
              sys.exit(1)

          print("")
          print("========================================")
          print("STEP 2: GET BUFFER CHANNELS")
          print("========================================")

          # The organization ID came directly from Buffer,
          # so it is safe to insert into this read-only query.
          channel_query = f"""
          query GetChannels {{
            channels(input: {{
              organizationId: "{organization_id}"
            }}) {{
              id
              name
              displayName
              service
              isDisconnected
              isLocked
              isQueuePaused
              timezone
            }}
          }}
          """

          data = buffer_request(channel_query)

          channels = (
              data
              .get("data", {})
              .get("channels", [])
          )

          if not channels:
              print("")
              print(
                  "ERROR: No Buffer channels were found."
              )
              sys.exit(1)

          print("")

          for channel in channels:
              print("----------------------------------------")
              print(
                  f"Name: "
                  f"{channel.get('displayName') or channel.get('name')}"
              )
              print(
                  f"Service: {channel.get('service')}"
              )
              print(
                  f"Channel ID: {channel.get('id')}"
              )
              print(
                  f"Disconnected: "
                  f"{channel.get('isDisconnected')}"
              )
              print(
                  f"Locked: "
                  f"{channel.get('isLocked')}"
              )
              print(
                  f"Queue paused: "
                  f"{channel.get('isQueuePaused')}"
              )
              print(
                  f"Timezone: "
                  f"{channel.get('timezone')}"
              )

          print("----------------------------------------")
          print("")
          print("========================================")
          print("BUFFER API CONNECTION TEST PASSED")
          print("========================================")
          PY
