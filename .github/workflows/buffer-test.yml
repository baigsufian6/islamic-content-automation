name: Buffer Instagram Video Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Send test video to Instagram via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          api_key = os.environ.get("BUFFER_API_KEY")

          if not api_key:
              print("ERROR: BUFFER_API_KEY is missing.")
              sys.exit(1)

          endpoint = "https://api.buffer.com"

          channel_id = "6a7884d3b2d9d57743451076"

          video_url = (
              "https://github.com/baigsufian6/"
              "islamic-content-automation/releases/download/"
              "section-20260809-130603/"
              "Surah-Al-Baqarah-Chapter-2-Ayahs-21-to-22-Cycle-1.mp4"
          )

          query = """
          mutation CreateInstagramTestPost {
            createPost(
              input: {
                text: "Quran production pipeline test — please ignore."
                channelId: "6a7884d3b2d9d57743451076"
                schedulingType: automatic
                mode: shareNow
                assets: [
                  {
                    video: {
                      url: "https://github.com/baigsufian6/islamic-content-automation/releases/download/section-20260809-130603/Surah-Al-Baqarah-Chapter-2-Ayahs-21-to-22-Cycle-1.mp4"
                    }
                  }
                ]
              }
            ) {
              ... on PostActionSuccess {
                post {
                  id
                  status
                  text
                }
              }
              ... on MutationError {
                message
              }
            }
          }
          """

          payload = json.dumps({"query": query}).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as exc:
              print(f"Buffer HTTP error: {exc.code}")
              print(
                  exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as exc:
              print(f"Request failed: {exc}")
              sys.exit(1)

          print(json.dumps(result, indent=2))

          if result.get("errors"):
              print("BUFFER GRAPHQL ERROR")
              sys.exit(1)

          post_result = (
              result
              .get("data", {})
              .get("createPost", {})
          )

          if "message" in post_result:
              print(
                  "BUFFER REJECTED THE POST:"
              )
              print(post_result["message"])
              sys.exit(1)

          post = post_result.get("post")

          if not post:
              print(
                  "ERROR: Buffer did not return a post."
              )
              sys.exit(1)

          print("")
          print("========================================")
          print("INSTAGRAM TEST POST CREATED")
          print("========================================")
          print(f"Post ID: {post.get('id')}")
          print(f"Status: {post.get('status')}")
          print("========================================")
          PY
