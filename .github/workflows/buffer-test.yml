name: Buffer Authentication Test

on:
  workflow_dispatch:

jobs:
  test-buffer:
    runs-on: ubuntu-latest

    steps:
      - name: Test Buffer authentication
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import requests

          api_key = os.environ.get("BUFFER_API_KEY", "").strip()

          if not api_key:
              print("ERROR: BUFFER_API_KEY is empty.")
              sys.exit(1)

          print("BUFFER_API_KEY is present.")
          print(f"Key length: {len(api_key)} characters")

          query = """
          query {
            account {
              id
              email
              organizations {
                id
                name
              }
            }
          }
          """

          response = requests.post(
              "https://api.buffer.com",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={"query": query},
              timeout=30,
          )

          print(f"Buffer HTTP status: {response.status_code}")
          print("Buffer response:")

          try:
              data = response.json()
              print(data)
          except Exception:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print("BUFFER HTTP AUTHENTICATION FAILED")
              sys.exit(1)

          if "errors" in data:
              print("BUFFER GRAPHQL ERROR")
              sys.exit(1)

          print("BUFFER AUTHENTICATION TEST PASSED.")
          PY
