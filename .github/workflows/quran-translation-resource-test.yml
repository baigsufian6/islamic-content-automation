name: Quran Translation Resource Test

on:
  workflow_dispatch:

jobs:
  translation-resource-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Identify available English translations
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_URL = "https://apis.quran.foundation"

          client_id = os.environ["QF_CLIENT_ID"]
          client_secret = os.environ["QF_CLIENT_SECRET"]

          # -------------------------------------------------
          # 1. Authenticate
          # -------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  client_id,
                  client_secret,
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          print("Authentication: SUCCESS")

          # -------------------------------------------------
          # 2. Get available translation resources
          # -------------------------------------------------

          response = requests.get(
              f"{API_URL}/content/api/v4/resources/translations",
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": client_id,
              },
              timeout=30,
          )

          response.raise_for_status()

          data = response.json()
          translations = data.get("translations")

          if not isinstance(translations, list):
              raise SystemExit(
                  "Invalid translation catalog response."
              )

          print(
              "Translation catalog request: SUCCESS"
          )

          print(
              "Total resources returned:",
              len(translations)
          )

          # -------------------------------------------------
          # 3. Show ONLY English resources
          #
          # No translation text is downloaded/displayed.
          # -------------------------------------------------

          english = []

          for item in translations:

              language = str(
                  item.get("language_name", "")
              ).strip().lower()

              if language == "english":
                  english.append(item)

          print()
          print(
              "ENGLISH TRANSLATIONS AVAILABLE:"
          )

          print(
              "Count:",
              len(english)
          )

          if not english:
              raise SystemExit(
                  "No English translation resources "
                  "were returned by the production API."
              )

          print()

          for item in english:
              print(
                  "ID:",
                  item.get("id")
              )

              print(
                  "Name:",
                  item.get("name")
              )

              print(
                  "Author:",
                  item.get("author_name")
              )

              print(
                  "Language:",
                  item.get("language_name")
              )

              print(
                  "---"
              )

          print()
          print(
              "ENGLISH TRANSLATION CATALOG TEST: PASSED"
          )
          PY
