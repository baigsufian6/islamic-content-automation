name: Quran Translation Resource Test

on:
  workflow_dispatch:

jobs:
  translation-resource-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Verify English translation resource
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_URL = "https://apis.quran.foundation"

          # -------------------------------------------------
          # 1. Authenticate
          # -------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  os.environ["QF_CLIENT_ID"],
                  os.environ["QF_CLIENT_SECRET"],
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          headers = {
              "x-auth-token": access_token,
              "x-client-id": os.environ["QF_CLIENT_ID"],
          }

          print("Authentication: SUCCESS")

          # -------------------------------------------------
          # 2. Retrieve translation resources
          # -------------------------------------------------

          response = requests.get(
              f"{API_URL}/content/api/v4/resources/translations",
              headers=headers,
              params={"language": "en"},
              timeout=30,
          )

          response.raise_for_status()

          data = response.json()

          translations = data.get("translations")

          if not isinstance(translations, list):
              raise SystemExit(
                  "Translation resource response is invalid."
              )

          print(
              "Translation resource request: SUCCESS"
          )

          # -------------------------------------------------
          # 3. Find resource 131
          # -------------------------------------------------

          resource = next(
              (
                  item
                  for item in translations
                  if item.get("id") == 131
              ),
              None,
          )

          if resource is None:
              raise SystemExit(
                  "Expected translation resource 131 "
                  "was not returned."
              )

          print()
          print("Translation resource found:")
          print("ID:", resource.get("id"))
          print("Name:", resource.get("name"))
          print(
              "Author:",
              resource.get("author_name")
          )
          print(
              "Language:",
              resource.get("language_name")
          )
          print("Slug:", resource.get("slug"))

          # -------------------------------------------------
          # 4. Integrity checks
          # -------------------------------------------------

          if resource.get("id") != 131:
              raise SystemExit(
                  "Translation ID integrity check failed."
              )

          if resource.get("language_name") != "english":
              raise SystemExit(
                  "Translation language is not English."
              )

          if not resource.get("name"):
              raise SystemExit(
                  "Translation name is missing."
              )

          if not resource.get("author_name"):
              raise SystemExit(
                  "Translation author is missing."
              )

          print()
          print(
              "TRANSLATION RESOURCE TEST: PASSED"
          )
          PY
