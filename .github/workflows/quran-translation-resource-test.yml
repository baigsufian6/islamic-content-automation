name: Quran Translation Resource Test

on:
  workflow_dispatch:

jobs:
  translation-resource-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Verify English translation resource
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_URL = "https://apis.quran.foundation"

          TARGET_RESOURCE_ID = 131
          TARGET_NAME = "Dr. Mustafa Khattab, the Clear Quran"
          TARGET_AUTHOR = "Dr. Mustafa Khattab"
          TARGET_LANGUAGE = "english"

          # -------------------------------------------------
          # 1. Authenticate
          # -------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  os.environ["QF_CLIENT_ID"],
                  os.environ["QF_CLIENT_SECRET"],
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          headers = {
              "x-auth-token": access_token,
              "x-client-id": os.environ["QF_CLIENT_ID"],
          }

          print("Authentication: SUCCESS")

          # -------------------------------------------------
          # 2. Retrieve translation resource catalog
          # -------------------------------------------------

          page = 1
          per_page = 50
          resource = None

          while True:
              response = requests.get(
                  f"{API_URL}/content/api/v4/resources/translations",
                  headers=headers,
                  params={
                      "language": "en",
                      "page": page,
                      "per_page": per_page,
                  },
                  timeout=30,
              )

              response.raise_for_status()

              data = response.json()

              translations = data.get("translations")

              if not isinstance(translations, list):
                  raise SystemExit(
                      "Translation catalog response is invalid."
                  )

              print(
                  f"Translation catalog page {page}: "
                  f"{len(translations)} resources"
              )

              for item in translations:
                  if item.get("id") == TARGET_RESOURCE_ID:
                      resource = item
                      break

              if resource is not None:
                  break

              pagination = data.get("pagination")

              if not isinstance(pagination, dict):
                  break

              next_page = pagination.get("next_page")

              if next_page is None:
                  break

              page = next_page

          print("Translation resource request: SUCCESS")

          # -------------------------------------------------
          # 3. Verify the exact approved translation
          # -------------------------------------------------

          if resource is None:
              raise SystemExit(
                  "Required translation resource 131 "
                  "was not found in the complete catalog."
              )

          print()
          print("Translation resource found:")
          print("ID:", resource.get("id"))
          print("Name:", resource.get("name"))
          print("Author:", resource.get("author_name"))
          print("Language:", resource.get("language_name"))
          print("Slug:", resource.get("slug"))

          # -------------------------------------------------
          # 4. Strict identity checks
          # -------------------------------------------------

          if resource.get("id") != TARGET_RESOURCE_ID:
              raise SystemExit(
                  "Translation ID integrity check failed."
              )

          if resource.get("name") != TARGET_NAME:
              raise SystemExit(
                  "Translation name integrity check failed."
              )

          if resource.get("author_name") != TARGET_AUTHOR:
              raise SystemExit(
                  "Translation author integrity check failed."
              )

          if resource.get("language_name") != TARGET_LANGUAGE:
              raise SystemExit(
                  "Translation language integrity check failed."
              )

          if not resource.get("slug"):
              raise SystemExit(
                  "Translation slug is missing."
              )

          print()
          print("Translation identity verified.")
          print(
              "Resource 131 matches the expected "
              "Clear Quran translation."
          )

          print()
          print("TRANSLATION RESOURCE TEST: PASSED")
          PY
