name: Quran Translation Resource Test

on:
  workflow_dispatch:

jobs:
  translation-resource-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Verify Clear Quran translation resource 131
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_BASE = "https://apis.quran.foundation/content/api/v4"

          TRANSLATION_ID = 131
          TEST_VERSE = "1:1"

          EXPECTED_NAME = (
              "Dr. Mustafa Khattab, the Clear Quran"
          )

          EXPECTED_AUTHOR = "Dr. Mustafa Khattab"
          EXPECTED_LANGUAGE = "english"

          # --------------------------------------------------
          # 1. Check secrets
          # --------------------------------------------------

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")

          if not client_id:
              raise SystemExit(
                  "QF_CLIENT_ID secret is missing."
              )

          if not client_secret:
              raise SystemExit(
                  "QF_CLIENT_SECRET secret is missing."
              )

          print("QF credentials detected.")

          # --------------------------------------------------
          # 2. Authenticate
          # --------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  client_id,
                  client_secret,
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          if token_response.status_code != 200:
              print(
                  "Authentication HTTP status:",
                  token_response.status_code,
              )

              print(
                  "Authentication response:",
                  token_response.text[:500],
              )

              raise SystemExit(
                  "Quran.Foundation authentication failed."
              )

          token_data = token_response.json()

          access_token = token_data.get("access_token")

          if not access_token:
              raise SystemExit(
                  "No access token returned."
              )

          print("Authentication: SUCCESS")

          # --------------------------------------------------
          # 3. Request ONE specific translation
          #
          # Official endpoint:
          # GET /translations/{translation_id}
          #
          # We request only verse 1:1.
          # --------------------------------------------------

          response = requests.get(
              f"{API_BASE}/translations/{TRANSLATION_ID}",
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": client_id,
              },
              params={
                  "verse_key": TEST_VERSE,
              },
              timeout=30,
          )

          if response.status_code != 200:
              print(
                  "Translation request HTTP status:",
                  response.status_code,
              )

              print(
                  "Translation API response:",
                  response.text[:1000],
              )

              raise SystemExit(
                  "Translation request failed."
              )

          data = response.json()

          print("Translation API request: SUCCESS")

          # --------------------------------------------------
          # 4. Validate response structure
          # --------------------------------------------------

          translations = data.get("translations")

          if not isinstance(translations, list):
              raise SystemExit(
                  "Translation API returned an invalid "
                  "'translations' array."
              )

          if len(translations) == 0:
              raise SystemExit(
                  "Translation API returned zero translation rows."
              )

          # --------------------------------------------------
          # 5. Find exact resource 131
          # --------------------------------------------------

          translation = None

          for item in translations:
              try:
                  resource_id = int(
                      item.get("resource_id")
                  )
              except (TypeError, ValueError):
                  continue

              if resource_id == TRANSLATION_ID:
                  translation = item
                  break

          if translation is None:
              raise SystemExit(
                  "Translation resource 131 was not returned."
              )

          # --------------------------------------------------
          # 6. Read metadata
          # --------------------------------------------------

          resource_id = translation.get(
              "resource_id"
          )

          resource_name = translation.get(
              "resource_name"
          )

          language_name = translation.get(
              "language_name"
          )

          verse_key = translation.get(
              "verse_key"
          )

          text = translation.get("text")

          meta = data.get("meta", {})

          translation_name = meta.get(
              "translation_name"
          )

          author_name = meta.get(
              "author_name"
          )

          print()
          print("Translation resource found:")
          print("Resource ID:", resource_id)
          print("Resource name:", resource_name)
          print("Language:", language_name)
          print("Verse:", verse_key)
          print("Translation name:", translation_name)
          print("Author:", author_name)

          # --------------------------------------------------
          # 7. Strict integrity checks
          # --------------------------------------------------

          if int(resource_id) != TRANSLATION_ID:
              raise SystemExit(
                  "CRITICAL: Translation resource ID mismatch."
              )

          if resource_name != EXPECTED_NAME:
              raise SystemExit(
                  "CRITICAL: Translation resource name mismatch."
              )

          if translation_name != EXPECTED_NAME:
              raise SystemExit(
                  "CRITICAL: Translation metadata name mismatch."
              )

          if author_name != EXPECTED_AUTHOR:
              raise SystemExit(
                  "CRITICAL: Translation author mismatch."
              )

          if language_name != EXPECTED_LANGUAGE:
              raise SystemExit(
                  "CRITICAL: Translation language mismatch."
              )

          if verse_key != TEST_VERSE:
              raise SystemExit(
                  "CRITICAL: Verse key mismatch."
              )

          if not isinstance(text, str):
              raise SystemExit(
                  "CRITICAL: Translation text is not a string."
              )

          if not text.strip():
              raise SystemExit(
                  "CRITICAL: Translation text is empty."
              )

          # --------------------------------------------------
          # 8. Success
          # --------------------------------------------------

          print()
          print(
              "Translation identity verified successfully."
          )

          print(
              "Resource 131 = "
              "Dr. Mustafa Khattab, the Clear Quran"
          )

          print(
              "Test verse verified:",
              TEST_VERSE
          )

          print()
          print(
              "TRANSLATION RESOURCE TEST: PASSED"
          )
          PY
