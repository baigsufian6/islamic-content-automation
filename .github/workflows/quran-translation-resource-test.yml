name: Quran Translation Resource Test

on:
  workflow_dispatch:

jobs:
  translation-resource-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Inspect translation catalog safely
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_URL = "https://apis.quran.foundation"

          TARGET_ID = 131

          client_id = os.environ["QF_CLIENT_ID"]
          client_secret = os.environ["QF_CLIENT_SECRET"]

          # -------------------------------------------------
          # 1. Authenticate
          # -------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  client_id,
                  client_secret,
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          print("Authentication: SUCCESS")

          headers = {
              "x-auth-token": access_token,
              "x-client-id": client_id,
          }

          # -------------------------------------------------
          # 2. Request translation catalog
          # -------------------------------------------------

          response = requests.get(
              f"{API_URL}/content/api/v4/resources/translations",
              headers=headers,
              timeout=30,
          )

          response.raise_for_status()

          data = response.json()

          translations = data.get("translations")

          if not isinstance(translations, list):
              raise SystemExit(
                  "Translation catalog did not return "
                  "a translations array."
              )

          print(
              "Translation catalog request: SUCCESS"
          )

          print(
              "Resources returned:",
              len(translations)
          )

          # -------------------------------------------------
          # 3. Inspect IDs safely
          # -------------------------------------------------

          found = None

          for item in translations:

              raw_id = item.get("id")

              raw_resource_id = item.get(
                  "resource_id"
              )

              # Compare as strings so that
              # 131 and "131" are treated identically.
              if (
                  str(raw_id) == str(TARGET_ID)
                  or
                  str(raw_resource_id) == str(TARGET_ID)
              ):
                  found = item
                  break

          # -------------------------------------------------
          # 4. Report only metadata
          # -------------------------------------------------

          if found is None:
              print()
              print(
                  "Resource 131 was NOT found "
                  "in the returned catalog."
              )

              print()
              print(
                  "First 20 catalog IDs:"
              )

              for item in translations[:20]:
                  print(
                      "id=",
                      repr(item.get("id")),
                      "resource_id=",
                      repr(item.get("resource_id")),
                  )

              raise SystemExit(
                  "Translation resource 131 "
                  "is not present in this catalog response."
              )

          print()
          print(
              "Resource 131 FOUND."
          )

          print(
              "id:",
              repr(found.get("id"))
          )

          print(
              "resource_id:",
              repr(found.get("resource_id"))
          )

          print(
              "resource_name:",
              repr(found.get("resource_name"))
          )

          print(
              "language_name:",
              repr(found.get("language_name"))
          )

          print()
          print(
              "TRANSLATION CATALOG TEST: PASSED"
          )
          PY
