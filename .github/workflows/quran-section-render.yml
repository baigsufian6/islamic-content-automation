name: Quran Section Render

on:
  workflow_dispatch:

jobs:
  section-render:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          python3 -m pip install --quiet requests

          echo "Arabic font:"
          fc-match "Noto Naskh Arabic"

      # ----------------------------------------------------------
      # 1. Fetch the real Quran passage
      # ----------------------------------------------------------
      - name: Fetch Quran passage
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import requests

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()

          if not client_id or not client_secret:
              print("ERROR: Quran credentials are missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          token = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not token.ok:
              print(
                  f"ERROR: Authentication failed: "
                  f"HTTP {token.status_code}"
              )
              sys.exit(1)

          access_token = token.json().get("access_token")

          if not access_token:
              print("ERROR: No access token returned.")
              sys.exit(1)

          verse_keys = [
              "1:1",
              "1:2",
              "1:3",
              "1:4",
              "1:5",
          ]

          verses = []

          for verse_key in verse_keys:

              response = requests.get(
                  f"{api_base}/content/api/v4/verses/by_key/{verse_key}",
                  params={
                      "translations": "20",
                      "fields": "text_uthmani",
                  },
                  headers={
                      "x-auth-token": access_token,
                      "x-client-id": client_id,
                  },
                  timeout=30,
              )

              if not response.ok:
                  print(
                      f"ERROR: Failed to fetch {verse_key}: "
                      f"HTTP {response.status_code}"
                  )
                  sys.exit(1)

              verse = response.json().get("verse")

              if not isinstance(verse, dict):
                  print(
                      f"ERROR: Missing verse object: {verse_key}"
                  )
                  sys.exit(1)

              arabic = verse.get("text_uthmani")

              if not isinstance(arabic, str) or not arabic.strip():
                  print(
                      f"ERROR: Arabic text missing: {verse_key}"
                  )
                  sys.exit(1)

              translation = None

              for item in verse.get("translations", []):
                  if str(item.get("resource_id")) == "20":
                      translation = item
                      break

              if translation is None:
                  print(
                      f"ERROR: Resource 20 missing: {verse_key}"
                  )
                  sys.exit(1)

              english = translation.get("text")

              if not isinstance(english, str):
                  print(
                      f"ERROR: Translation missing: {verse_key}"
                  )
                  sys.exit(1)

              # Remove footnote elements completely,
              # including their numeric contents.
              english = re.sub(
                  r"<sup\b[^>]*>.*?</sup>",
                  "",
                  english,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              english = re.sub(
                  r"<[^>]+>",
                  "",
                  english,
              )

              english = html.unescape(english)

              english = re.sub(
                  r"\s+",
                  " ",
                  english,
              ).strip()

              if not english:
                  print(
                      f"ERROR: Empty cleaned translation: "
                      f"{verse_key}"
                  )
                  sys.exit(1)

              verses.append(
                  {
                      "verse_key": verse_key,
                      "arabic_text": arabic.strip(),
                      "translation_text": english,
                  }
              )

          os.makedirs("output", exist_ok=True)

          data = {
              "translation_resource_id": 20,
              "translation_name": "Saheeh International",
              "section": {
                  "start": "1:1",
                  "end": "1:5",
                  "visual_strategy": "single_cinematic_section",
              },
              "verses": verses,
          }

          with open(
              "output/section.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("QURAN SECTION: READY")
          print("Verses: 1:1 through 1:5")
          print("Translation resource: 20")
          PY

      # ----------------------------------------------------------
      # 2. One visual concept for the entire passage
      # ----------------------------------------------------------
      - name: Create section visual direction
        run: |
          python3 - <<'PY'
          import json

          with open(
              "output/section.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          # The first production architecture deliberately uses
          # ONE coherent visual for the whole passage.
          #
          # We do not literally depict Allah, prophets, sacred
          # figures, historical religious scenes, or other sacred
          # subjects.

          data["section"]["visual_theme"] = (
              "peaceful_reflective_nature"
          )

          data["section"]["visual_query"] = (
              "peaceful cinematic nature dawn "
              "soft golden light landscape"
          )

          with open(
              "output/section.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("SECTION VISUAL THEME: READY")
          print(
              "Query:",
              data["section"]["visual_query"]
          )
          PY

      # ----------------------------------------------------------
      # 3. Download ONE real Pexels video
      # ----------------------------------------------------------
      - name: Download section background
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          api_key = os.environ.get("PEXELS_API_KEY")

          if not api_key:
              print("ERROR: PEXELS_API_KEY is missing.")
              sys.exit(1)

          with open(
              "output/section.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          query = data["section"]["visual_query"]

          response = requests.get(
              "https://api.pexels.com/videos/search",
              headers={
                  "Authorization": api_key
              },
              params={
                  "query": query,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 10,
              },
              timeout=30,
          )

          print(
              f"Pexels request: HTTP "
              f"{response.status_code}"
          )

          if not response.ok:
              print("ERROR: Pexels request failed.")
              sys.exit(1)

          videos = response.json().get(
              "videos",
              []
          )

          if not videos:
              print("ERROR: No suitable Pexels video.")
              sys.exit(1)

          selected = None
          selected_file = None

          for video in videos:

              files = video.get(
                  "video_files",
                  []
              )

              vertical = [
                  f for f in files
                  if (
                      f.get("width")
                      and f.get("height")
                      and f["height"] >= f["width"]
                      and f.get("link")
                  )
              ]

              if vertical:
                  # Prefer a reasonably sized file.
                  vertical.sort(
                      key=lambda f: abs(
                          (f.get("width", 0) or 0)
                          - 720
                      )
                  )

                  selected = video
                  selected_file = vertical[0]
                  break

          if selected is None:
              print(
                  "ERROR: No portrait video file found."
              )
              sys.exit(1)

          video_url = selected_file["link"]

          download = requests.get(
              video_url,
              stream=True,
              timeout=90,
          )

          if not download.ok:
              print(
                  "ERROR: Background download failed."
              )
              sys.exit(1)

          with open(
              "output/section-background.mp4",
              "wb",
          ) as f:
              for chunk in download.iter_content(
                  chunk_size=1024 * 1024
              ):
                  if chunk:
                      f.write(chunk)

          if (
              not os.path.isfile(
                  "output/section-background.mp4"
              )
              or os.path.getsize(
                  "output/section-background.mp4"
              ) < 10000
          ):
              print(
                  "ERROR: Background video is invalid."
              )
              sys.exit(1)

          data["section"]["pexels_video_id"] = (
              selected.get("id")
          )

          data["section"]["pexels_url"] = (
              selected.get("url")
          )

          with open(
              "output/section.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("ONE SECTION VIDEO: DOWNLOADED")
          print(
              f"Pexels video ID: "
              f"{selected.get('id')}"
          )
          PY

      # ----------------------------------------------------------
      # 4. Calculate comfortable timing
      # ----------------------------------------------------------
      - name: Calculate verse timing
        run: |
          python3 - <<'PY'
          import json

          with open(
              "output/section.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          current = 0.0

          for verse in data["verses"]:

              words = len(
                  verse["translation_text"].split()
              )

              # Reading-focused timing.
              duration = 3.5 + (
                  words * 0.30
              )

              duration = max(
                  4.0,
                  min(
                      duration,
                      9.0,
                  ),
              )

              verse["start"] = round(
                  current,
                  2,
              )

              verse["duration"] = round(
                  duration,
                  2,
              )

              verse["end"] = round(
                  current + duration,
                  2,
              )

              current = verse["end"]

          data["section"]["duration"] = round(
              current,
              2,
          )

          with open(
              "output/section.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("TIMING PLAN")

          for verse in data["verses"]:
              print(
                  f"{verse['verse_key']}: "
                  f"{verse['start']}s -> "
                  f"{verse['end']}s"
              )

          print(
              f"Total: "
              f"{data['section']['duration']}s"
          )
          PY

      # ----------------------------------------------------------
      # 5. Build professional subtitles
      # ----------------------------------------------------------
      - name: Create professional subtitles
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(
              "output/section.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          def ass_time(seconds):

              h = int(seconds // 3600)
              m = int(
                  (seconds % 3600) // 60
              )
              s = seconds % 60

              return (
                  f"{h}:"
                  f"{m:02d}:"
                  f"{s:05.2f}"
              )

          def wrap_words(text, limit):

              words = text.split()

              lines = []
              current = ""

              for word in words:

                  candidate = (
                      word
                      if not current
                      else current + " " + word
                  )

                  if len(candidate) <= limit:
                      current = candidate
                  else:
                      if current:
                          lines.append(
                              current
                          )
                      current = word

              if current:
                  lines.append(
                      current
                  )

              return r"\N".join(
                  lines
              )

          def escape_ass(text):

              return (
                  text
                  .replace(
                      "\\",
                      "\\\\"
                  )
                  .replace(
                      "{",
                      "\\{"
                  )
                  .replace(
                      "}",
                      "\\}"
                  )
              )

          with open(
              "output/quran.ass",
              "w",
              encoding="utf-8",
          ) as f:

              f.write(
                  """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Reference,Noto Sans,36,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,1,0,0,0,100,100,0,0,1,2,1,8,70,70,115,1
          Style: Arabic,Noto Naskh Arabic,82,&H00FFFFFF,&H00FFFFFF,&H10101010,&H90000000,0,0,0,0,100,100,0,0,1,3,1,5,70,70,0,1
          Style: English,Noto Sans,46,&H00FFFFFF,&H00FFFFFF,&H10101010,&H90000000,0,0,0,0,100,100,0,0,1,3,1,5,90,90,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
              )

              for verse in data["verses"]:

                  start = ass_time(
                      verse["start"]
                  )

                  end = ass_time(
                      verse["end"]
                  )

                  arabic = escape_ass(
                      verse["arabic_text"]
                  )

                  english_text = (
                      verse[
                          "translation_text"
                      ]
                  )

                  length = len(
                      english_text
                  )

                  if length <= 90:
                      font_size = 48
                      wrap_limit = 54
                  elif length <= 140:
                      font_size = 44
                      wrap_limit = 48
                  elif length <= 190:
                      font_size = 40
                      wrap_limit = 43
                  else:
                      font_size = 36
                      wrap_limit = 38

                  english = escape_ass(
                      wrap_words(
                          english_text,
                          wrap_limit,
                      )
                  )

                  f.write(
                      f"Dialogue: 0,"
                      f"{start},"
                      f"{end},"
                      f"Reference,,"
                      f"0,0,115,,"
                      f"VERSE "
                      f"{verse['verse_key']}\n"
                  )

                  f.write(
                      f"Dialogue: 0,"
                      f"{start},"
                      f"{end},"
                      f"Arabic,,"
                      f"0,0,0,,"
                      f"{arabic}\n"
                  )

                  f.write(
                      f"Dialogue: 0,"
                      f"{start},"
                      f"{end},"
                      f"English,,"
                      f"0,0,0,,"
                      f"{{\\fs{font_size}}}"
                      f"{english}\n"
                  )

          print(
              "PROFESSIONAL SUBTITLES: CREATED"
          )
          PY

      # ----------------------------------------------------------
      # 6. Prepare continuous background
      # ----------------------------------------------------------
      - name: Prepare cinematic background
        run: |
          ffmpeg \
            -y \
            -stream_loop -1 \
            -i output/section-background.mp4 \
            -t "$(python3 -c 'import json; print(json.load(open("output/section.json"))["section"]["duration"])')" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/background-prepared.mp4

      # ----------------------------------------------------------
      # 7. Render the entire section
      # ----------------------------------------------------------
      - name: Render cinematic Quran section
        run: |
          ffmpeg \
            -y \
            -i output/background-prepared.mp4 \
            -vf "subtitles=output/quran.ass:fontsdir=/usr/share/fonts/truetype/noto" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/quran-section.mp4

      # ----------------------------------------------------------
      # 8. Validate
      # ----------------------------------------------------------
      - name: Validate final video
        run: |
          test -s output/quran-section.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/quran-section.mp4

          echo ""
          echo "SECTION RENDER: PASSED"
          echo "One cinematic background"
          echo "Five ordered ayahs"
          echo "Adaptive text timing"
          echo "Adaptive English typography"
          echo "Arabic Naskh typography"

      # ----------------------------------------------------------
      # 9. Upload
      # ----------------------------------------------------------
      - name: Upload section render
        uses: actions/upload-artifact@v4
        with:
          name: quran-section-render
          path: |
            output/quran-section.mp4
            output/section.json
            output/quran.ass
          retention-days: 3
