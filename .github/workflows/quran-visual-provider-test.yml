name: Quran Visual Provider Test

on:
  workflow_dispatch:

jobs:
  visual-provider-test:
    runs-on: ubuntu-latest

    environment: Visual API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet requests

      - name: Create visual brief
        run: |
          cat > visual-brief.json <<'EOF'
          {
            "verse_key": "1:1",
            "translation_resource_id": 20,
            "theme": "mercy_and_compassion",
            "mood": "peaceful",
            "visual_direction": "peaceful natural landscape at dawn, soft warm light, subtle atmosphere, cinematic and contemplative"
          }
          EOF

      - name: Search Pexels for vertical video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          api_key = os.environ.get("PEXELS_API_KEY")

          if not api_key:
              print("ERROR: PEXELS_API_KEY is missing.")
              sys.exit(1)

          with open("visual-brief.json", "r", encoding="utf-8") as f:
              brief = json.load(f)

          query = "peaceful nature landscape dawn"

          response = requests.get(
              "https://api.pexels.com/v1/videos/search",
              headers={
                  "Authorization": api_key
              },
              params={
                  "query": query,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 5
              },
              timeout=30
          )

          print(f"Pexels API request: HTTP {response.status_code}")

          if not response.ok:
              print("ERROR: Pexels API request failed.")
              print(response.text[:500])
              sys.exit(1)

          data = response.json()
          videos = data.get("videos", [])

          if not videos:
              print("ERROR: No Pexels videos returned.")
              sys.exit(1)

          selected = None

          for video in videos:
              for video_file in video.get("video_files", []):
                  width = video_file.get("width")
                  height = video_file.get("height")
                  link = video_file.get("link")

                  if (
                      isinstance(width, int)
                      and isinstance(height, int)
                      and height > width
                      and link
                  ):
                      selected = {
                          "id": video.get("id"),
                          "pexels_url": video.get("url"),
                          "photographer": video.get("user", {}).get("name"),
                          "duration": video.get("duration"),
                          "width": width,
                          "height": height,
                          "video_url": link
                      }
                      break

              if selected:
                  break

          if selected is None:
              print("ERROR: No portrait video file found.")
              sys.exit(1)

          with open(
              "visual-asset.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("PEXELS VISUAL PROVIDER: CONNECTED")
          print(f"Verse: {brief['verse_key']}")
          print(f"Theme: {brief['theme']}")
          print(f"Video ID: {selected['id']}")
          print(f"Photographer: {selected['photographer']}")
          print(f"Duration: {selected['duration']} seconds")
          print(
              f"Dimensions: "
              f"{selected['width']}x{selected['height']}"
          )
          print("Portrait video: YES")
          PY

      - name: Download selected Pexels video
        run: |
          python3 - <<'PY'
          import json
          import sys
          import requests

          with open(
              "visual-asset.json",
              "r",
              encoding="utf-8"
          ) as f:
              asset = json.load(f)

          video_url = asset.get("video_url")

          if not video_url:
              print("ERROR: No video URL found.")
              sys.exit(1)

          print("Downloading selected Pexels video...")

          response = requests.get(
              video_url,
              stream=True,
              timeout=60
          )

          print(
              f"Video download request: "
              f"HTTP {response.status_code}"
          )

          if not response.ok:
              print("ERROR: Video download failed.")
              sys.exit(1)

          content_type = response.headers.get(
              "content-type",
              ""
          ).lower()

          print(f"Content-Type: {content_type}")

          if "video" not in content_type:
              print(
                  "ERROR: Downloaded resource is not "
                  "identified as video."
              )
              sys.exit(1)

          total_bytes = 0

          with open(
              "pexels-background.mp4",
              "wb"
          ) as output:
              for chunk in response.iter_content(
                  chunk_size=1024 * 1024
              ):
                  if chunk:
                      output.write(chunk)
                      total_bytes += len(chunk)

          if total_bytes == 0:
              print("ERROR: Downloaded video is empty.")
              sys.exit(1)

          print(
              f"Downloaded video size: "
              f"{total_bytes / (1024 * 1024):.2f} MB"
          )

          print("VIDEO DOWNLOAD: PASSED")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify downloaded video
        run: |
          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            pexels-background.mp4

          echo ""
          echo "STEP 31B: PASSED"

      - name: Upload visual asset
        uses: actions/upload-artifact@v4
        with:
          name: quran-visual-asset
          path: |
            visual-asset.json
            pexels-background.mp4
          retention-days: 1
