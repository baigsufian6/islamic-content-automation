name: Quran Foundation API Test

on:
  workflow_dispatch:

jobs:
  quran-api-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Authenticate and request chapters
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          env = os.environ["QF_ENV"]

          auth_urls = {
              "production": "https://oauth2.quran.foundation",
              "prelive": "https://prelive-oauth2.quran.foundation",
          }

          api_urls = {
              "production": "https://apis.quran.foundation",
              "prelive": "https://apis-prelive.quran.foundation",
          }

          if env not in auth_urls:
              raise SystemExit("Invalid QF_ENV")

          print(f"QF environment: {env}")

          token_response = requests.post(
              f"{auth_urls[env]}/oauth2/token",
              auth=HTTPBasicAuth(
                  os.environ["QF_CLIENT_ID"],
                  os.environ["QF_CLIENT_SECRET"],
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          token_data = token_response.json()

          access_token = token_data["access_token"]

          print("Authentication: SUCCESS")
          print(
              "Token received: YES "
              "(token value intentionally not printed)"
          )

          response = requests.get(
              f"{api_urls[env]}/content/api/v4/chapters",
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": os.environ["QF_CLIENT_ID"],
              },
              timeout=30,
          )

          response.raise_for_status()

          data = response.json()

          chapters = data.get("chapters")

          if not isinstance(chapters, list):
              raise SystemExit(
                  "API response did not contain a chapters array."
              )

          print("Content API: SUCCESS")
          print(f"Chapters returned: {len(chapters)}")

          if chapters:
              first = chapters[0]

              print(
                  "First chapter:",
                  first.get("name_simple", "unknown")
              )

          print()
          print("QURAN FOUNDATION API TEST: PASSED")
          PY
