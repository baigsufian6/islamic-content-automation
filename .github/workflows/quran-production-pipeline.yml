name: Quran Production Pipeline

on:
  workflow_dispatch:

jobs:
  production-pipeline:
    runs-on: ubuntu-latest

    environment: Quran API

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          python3 -m pip install --quiet requests

          echo "Installed FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Arabic font:"
          fc-match "Noto Naskh Arabic"

      # ------------------------------------------------------------
      # 3. Fetch real Quran verses + Saheeh International
      # ------------------------------------------------------------
      - name: Fetch Quran verses
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import requests

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()

          if not client_id or not client_secret:
              print("ERROR: Quran Foundation credentials are missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          # --------------------------------------------------------
          # Authenticate
          # --------------------------------------------------------
          token_response = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not token_response.ok:
              print(
                  f"ERROR: Authentication failed: "
                  f"HTTP {token_response.status_code}"
              )
              sys.exit(1)

          token_data = token_response.json()
          access_token = token_data.get("access_token")

          if not access_token:
              print("ERROR: No access token returned.")
              sys.exit(1)

          print("Authentication: SUCCESS")

          # --------------------------------------------------------
          # Fetch verses 1:1 through 1:5.
          #
          # Translation resource 20 =
          # Saheeh International.
          # --------------------------------------------------------
          verse_keys = [
              "1:1",
              "1:2",
              "1:3",
              "1:4",
              "1:5",
          ]

          verses = []

          for verse_key in verse_keys:

              response = requests.get(
                  f"{api_base}/content/api/v4/verses/by_key/{verse_key}",
                  params={
                      "translations": "20",
                      "fields": "text_uthmani",
                  },
                  headers={
                      "x-auth-token": access_token,
                      "x-client-id": client_id,
                  },
                  timeout=30,
              )

              print(
                  f"Quran API {verse_key}: "
                  f"HTTP {response.status_code}"
              )

              if not response.ok:
                  print(
                      f"ERROR: Quran API request failed for {verse_key}"
                  )
                  sys.exit(1)

              payload = response.json()
              verse = payload.get("verse")

              if not isinstance(verse, dict):
                  print(
                      f"ERROR: No verse object returned for {verse_key}"
                  )
                  sys.exit(1)

              returned_key = verse.get("verse_key")

              if returned_key != verse_key:
                  print(
                      f"ERROR: Expected {verse_key}, "
                      f"got {returned_key}"
                  )
                  sys.exit(1)

              arabic_text = verse.get("text_uthmani")

              if not isinstance(arabic_text, str) or not arabic_text.strip():
                  print(
                      f"ERROR: No Arabic text for {verse_key}"
                  )
                  sys.exit(1)

              translations = verse.get("translations", [])

              selected_translation = None

              for translation in translations:
                  if str(
                      translation.get("resource_id")
                  ) == "20":
                      selected_translation = translation
                      break

              if selected_translation is None:
                  print(
                      f"ERROR: Translation resource 20 missing "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              raw_translation = selected_translation.get("text")

              if (
                  not isinstance(raw_translation, str)
                  or not raw_translation.strip()
              ):
                  print(
                      f"ERROR: Translation 20 has no usable text "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              # ----------------------------------------------------
              # Remove HTML footnote markup.
              #
              # Example:
              # <sup foot_note=227140>1</sup>
              #
              # becomes nothing, preventing ".2" etc. from appearing
              # in the rendered translation.
              # ----------------------------------------------------
              clean_translation = re.sub(
                  r"<sup\b[^>]*>.*?</sup>",
                  "",
                  raw_translation,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              clean_translation = re.sub(
                  r"<[^>]+>",
                  "",
                  clean_translation,
              )

              clean_translation = html.unescape(
                  clean_translation
              )

              clean_translation = re.sub(
                  r"\s+",
                  " ",
                  clean_translation,
              ).strip()

              if not clean_translation:
                  print(
                      f"ERROR: Cleaned translation is empty "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              verses.append(
                  {
                      "verse_key": verse_key,
                      "arabic_text": arabic_text.strip(),
                      "translation_resource_id": 20,
                      "translation_text": clean_translation,
                  }
              )

              print(
                  f"PASS {verse_key} | "
                  f"resource=20 | "
                  f"translation=received"
              )

          os.makedirs("output", exist_ok=True)

          production_data = {
              "translation_resource_id": 20,
              "translation_name": "Saheeh International",
              "verses": verses,
          }

          with open(
              "output/production-pipeline.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  production_data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("QURAN DATA: PASSED")
          print(f"Verses fetched: {len(verses)}")
          print("Translation resource: 20")
          print("Client secret: NOT PRINTED")
          PY

      # ------------------------------------------------------------
      # 4. Create visual query for every verse
      # ------------------------------------------------------------
      - name: Create visual plan
        run: |
          python3 - <<'PY'
          import json
          import re

          input_file = "output/production-pipeline.json"

          with open(
              input_file,
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          def choose_query(text):

              text = text.lower()

              rules = [
                  (
                      [
                          "mercy",
                          "merciful",
                          "compassion",
                          "forgive",
                          "forgiveness",
                      ],
                      "peaceful nature dawn soft golden light",
                  ),
                  (
                      [
                          "guidance",
                          "guide",
                          "guided",
                          "path",
                          "straight",
                      ],
                      "peaceful path through nature sunrise",
                  ),
                  (
                      [
                          "light",
                          "lights",
                          "illumination",
                      ],
                      "golden sunlight through nature cinematic",
                  ),
                  (
                      [
                          "garden",
                          "gardens",
                          "paradise",
                      ],
                      "beautiful peaceful garden nature cinematic",
                  ),
                  (
                      [
                          "earth",
                          "creation",
                          "world",
                      ],
                      "cinematic natural landscape earth",
                  ),
                  (
                      [
                          "rain",
                          "water",
                          "river",
                          "sea",
                          "ocean",
                      ],
                      "peaceful water nature cinematic",
                  ),
                  (
                      [
                          "night",
                          "darkness",
                          "dark",
                      ],
                      "peaceful night sky stars cinematic",
                  ),
                  (
                      [
                          "day",
                          "sun",
                          "sunlight",
                      ],
                      "cinematic sunrise landscape",
                  ),
                  (
                      [
                          "mountain",
                          "mountains",
                      ],
                      "cinematic mountains landscape",
                  ),
                  (
                      [
                          "peace",
                          "peaceful",
                          "calm",
                      ],
                      "peaceful cinematic landscape golden hour",
                  ),
                  (
                      [
                          "fear",
                          "warning",
                          "punishment",
                      ],
                      "dramatic clouds landscape cinematic",
                  ),
              ]

              for keywords, query in rules:
                  if any(
                      word in text
                      for word in keywords
                  ):
                      return query

              return (
                  "peaceful cinematic natural landscape "
                  "soft atmospheric light"
              )

          for verse in data["verses"]:

              query = choose_query(
                  verse["translation_text"]
              )

              verse["visual_query"] = query

              print(
                  f"{verse['verse_key']} -> {query}"
              )

          with open(
              input_file,
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("VISUAL PLAN: CREATED")
          PY

      # ------------------------------------------------------------
      # 5. Download a real Pexels video for EACH verse
      # ------------------------------------------------------------
      - name: Download matching Pexels videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import requests
          from pathlib import Path

          api_key = os.environ.get("PEXELS_API_KEY")

          if not api_key:
              print("ERROR: PEXELS_API_KEY is missing.")
              print(
                  "Add PEXELS_API_KEY to the repository/environment "
                  "secrets before running production."
              )
              sys.exit(1)

          headers = {
              "Authorization": api_key
          }

          with open(
              "output/production-pipeline.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          Path("output/clips").mkdir(
              parents=True,
              exist_ok=True,
          )

          for index, verse in enumerate(
              data["verses"],
              start=1,
          ):

              verse_key = verse["verse_key"]
              query = verse["visual_query"]

              print("")
              print(
                  f"Searching Pexels for {verse_key}: "
                  f"{query}"
              )

              response = requests.get(
                  "https://api.pexels.com/videos/search",
                  headers=headers,
                  params={
                      "query": query,
                      "orientation": "portrait",
                      "size": "medium",
                      "per_page": 15,
                  },
                  timeout=30,
              )

              if not response.ok:
                  print(
                      f"ERROR: Pexels API failed for "
                      f"{verse_key}: HTTP "
                      f"{response.status_code}"
                  )
                  sys.exit(1)

              videos = response.json().get(
                  "videos",
                  [],
              )

              if not videos:
                  print(
                      f"ERROR: No Pexels videos found "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              # Prefer actual vertical videos.
              vertical = []

              for video in videos:

                  width = video.get("width", 0) or 0
                  height = video.get("height", 0) or 0

                  if width and height:
                      ratio = height / width

                      if ratio >= 1.40:
                          vertical.append(video)

              candidates = vertical or videos

              selected = candidates[0]

              files = selected.get(
                  "video_files",
                  [],
              )

              if not files:
                  print(
                      f"ERROR: Selected Pexels video has "
                      f"no video files: {verse_key}"
                  )
                  sys.exit(1)

              vertical_files = []

              for video_file in files:

                  width = video_file.get(
                      "width",
                      0,
                  ) or 0

                  height = video_file.get(
                      "height",
                      0,
                  ) or 0

                  if height >= width:
                      vertical_files.append(video_file)

              usable_files = (
                  vertical_files
                  if vertical_files
                  else files
              )

              # Prefer approximately 720x1280.
              usable_files.sort(
                  key=lambda f: abs(
                      (f.get("width", 0) or 0)
                      - 720
                  )
                  + abs(
                      (f.get("height", 0) or 0)
                      - 1280
                  )
              )

              selected_file = usable_files[0]

              video_url = selected_file.get("link")

              if not video_url:
                  print(
                      f"ERROR: No downloadable URL "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              output_path = (
                  f"output/clips/"
                  f"verse-{index:03d}.mp4"
              )

              print(
                  f"Selected Pexels video: "
                  f"{selected.get('id')}"
              )

              print(
                  f"Downloading video for {verse_key}"
              )

              with requests.get(
                  video_url,
                  stream=True,
                  timeout=90,
              ) as download:

                  if not download.ok:
                      print(
                          f"ERROR: Video download failed "
                          f"for {verse_key}"
                      )
                      sys.exit(1)

                  with open(
                      output_path,
                      "wb",
                  ) as output:

                      for chunk in download.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              output.write(chunk)

              if not os.path.isfile(output_path):
                  print(
                      f"ERROR: Video file was not created "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              if os.path.getsize(
                  output_path
              ) < 10000:

                  print(
                      f"ERROR: Downloaded video is too small "
                      f"for {verse_key}"
                  )
                  sys.exit(1)

              verse["pexels_video_id"] = selected.get(
                  "id"
              )

              verse["pexels_url"] = selected.get(
                  "url"
              )

              print(
                  f"Visual received: {verse_key}"
              )

          with open(
              "output/production-pipeline.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("PEXELS VISUAL DOWNLOAD: PASSED")
          print(
              f"Videos downloaded: "
              f"{len(data['verses'])}"
          )
          PY

      # ------------------------------------------------------------
      # 6. Prepare every video to 1080x1920
      # ------------------------------------------------------------
      - name: Prepare verse videos
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(
              "output/production-pipeline.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          os.makedirs(
              "output/prepared",
              exist_ok=True,
          )

          # Temporary production-test timing.
          #
          # Each verse gets enough time to comfortably read.
          # This will later be replaced by automatic timing
          # based on translation length.
          def verse_duration(text):

              words = len(text.split())

              seconds = max(
                  4.0,
                  min(
                      9.0,
                      2.5 + words * 0.38
                  )
              )

              return round(
                  seconds,
                  2
              )

          for index, verse in enumerate(
              data["verses"],
              start=1,
          ):

              duration = verse_duration(
                  verse["translation_text"]
              )

              verse["duration"] = duration

              source = (
                  f"output/clips/"
                  f"verse-{index:03d}.mp4"
              )

              output = (
                  f"output/prepared/"
                  f"verse-{index:03d}.mp4"
              )

              command = [
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  source,
                  "-t",
                  str(duration),
                  "-vf",
                  (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio=increase,"
                      "crop=1080:1920"
                  ),
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-pix_fmt",
                  "yuv420p",
                  output,
              ]

              subprocess.run(
                  command,
                  check=True,
              )

              print(
                  f"Prepared {verse['verse_key']} "
                  f"| duration={duration}s"
              )

          with open(
              "output/production-pipeline.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("VERSE VIDEO PREPARATION: PASSED")
          PY

      # ------------------------------------------------------------
      # 7. Create adaptive subtitles for each verse
      # ------------------------------------------------------------
      - name: Create adaptive subtitles
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(
              "output/production-pipeline.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          os.makedirs(
              "output/subtitles",
              exist_ok=True,
          )

          def ass_escape(text):
              text = text.replace(
                  "\\",
                  "\\\\"
              )
              text = text.replace(
                  "{",
                  "\\{"
              )
              text = text.replace(
                  "}",
                  "\\}"
              )
              return text

          def wrap_text(text, max_chars):

              words = text.split()

              lines = []
              current = ""

              for word in words:

                  candidate = (
                      word
                      if not current
                      else current + " " + word
                  )

                  if len(candidate) <= max_chars:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)

                      current = word

              if current:
                  lines.append(current)

              return "\\N".join(lines)

          for index, verse in enumerate(
              data["verses"],
              start=1,
          ):

              duration = verse["duration"]

              # Slightly smaller English text when the
              # translation is longer.
              english_length = len(
                  verse["translation_text"]
              )

              if english_length > 115:
                  english_size = 42
                  max_chars = 48
              elif english_length > 85:
                  english_size = 46
                  max_chars = 54
              elif english_length > 60:
                  english_size = 50
                  max_chars = 60
              else:
                  english_size = 54
                  max_chars = 66

              english = wrap_text(
                  verse["translation_text"],
                  max_chars,
              )

              arabic = ass_escape(
                  verse["arabic_text"]
              )

              english = ass_escape(
                  english
              )

              ass_path = (
                  f"output/subtitles/"
                  f"verse-{index:03d}.ass"
              )

              end_seconds = duration

              end_h = int(
                  end_seconds // 3600
              )

              end_m = int(
                  (end_seconds % 3600) // 60
              )

              end_s = (
                  end_seconds
                  % 60
              )

              end_time = (
                  f"{end_h}:"
                  f"{end_m:02d}:"
                  f"{end_s:05.2f}"
              )

              with open(
                  ass_path,
                  "w",
                  encoding="utf-8",
              ) as f:

                  f.write(
                      "[Script Info]\n"
                  )
                  f.write(
                      "ScriptType: v4.00+\n"
                  )
                  f.write(
                      "PlayResX: 1080\n"
                  )
                  f.write(
                      "PlayResY: 1920\n"
                  )
                  f.write(
                      "WrapStyle: 2\n"
                  )
                  f.write(
                      "ScaledBorderAndShadow: yes\n"
                  )
                  f.write("\n")

                  f.write(
                      "[V4+ Styles]\n"
                  )
                  f.write(
                      "Format: Name, Fontname, "
                      "Fontsize, PrimaryColour, "
                      "SecondaryColour, "
                      "OutlineColour, BackColour, "
                      "Bold, Italic, Underline, "
                      "StrikeOut, ScaleX, ScaleY, "
                      "Spacing, Angle, BorderStyle, "
                      "Outline, Shadow, Alignment, "
                      "MarginL, MarginR, MarginV, Encoding\n"
                  )

                  f.write(
                      "Style: Arabic,"
                      "Noto Naskh Arabic,"
                      "68,"
                      "&H00FFFFFF,"
                      "&H00FFFFFF,"
                      "&H00101010,"
                      "&H90000000,"
                      "0,0,0,0,100,100,0,0,1,"
                      "3,1,5,80,80,0,1\n"
                  )

                  f.write(
                      f"Style: English,"
                      f"Noto Sans,"
                      f"{english_size},"
                      "&H00FFFFFF,"
                      "&H00FFFFFF,"
                      "&H00101010,"
                      "&H90000000,"
                      "0,0,0,0,100,100,0,0,1,"
                      "3,1,5,80,80,0,1\n"
                  )

                  f.write(
                      "Style: Reference,"
                      "Noto Sans,"
                      "38,"
                      "&H00FFFFFF,"
                      "&H00FFFFFF,"
                      "&H00101010,"
                      "&H90000000,"
                      "1,0,0,0,100,100,0,0,1,"
                      "2,1,8,60,60,100,1\n"
                  )

                  f.write("\n")

                  f.write(
                      "[Events]\n"
                  )

                  f.write(
                      "Format: Layer, Start, End, "
                      "Style, Name, MarginL, "
                      "MarginR, MarginV, Effect, Text\n"
                  )

                  f.write(
                      f"Dialogue: 0,0:00:00.00,"
                      f"{end_time},Reference,,"
                      f"0,0,100,,"
                      f"VERSE {verse['verse_key']}\n"
                  )

                  f.write(
                      f"Dialogue: 0,0:00:00.00,"
                      f"{end_time},Arabic,,"
                      f"0,0,0,,"
                      f"{arabic}\n"
                  )

                  f.write(
                      f"Dialogue: 0,0:00:00.00,"
                      f"{end_time},English,,"
                      f"0,0,0,,"
                      f"{english}\n"
                  )

              print(
                  f"Subtitle created: "
                  f"{verse['verse_key']} "
                  f"| English chars={english_length} "
                  f"| font={english_size}"
              )

          print("")
          print("ADAPTIVE SUBTITLES: PASSED")
          PY

      # ------------------------------------------------------------
      # 8. Render each verse with its own visual + subtitles
      # ------------------------------------------------------------
      - name: Render individual verses
        run: |
          mkdir -p output/rendered

          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(
              "output/production-pipeline.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          for index, verse in enumerate(
              data["verses"],
              start=1,
          ):

              video = (
                  f"output/prepared/"
                  f"verse-{index:03d}.mp4"
              )

              subtitle = (
                  f"output/subtitles/"
                  f"verse-{index:03d}.ass"
              )

              output = (
                  f"output/rendered/"
                  f"verse-{index:03d}.mp4"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      video,
                      "-vf",
                      (
                          f"subtitles={subtitle}:"
                          "fontsdir="
                          "/usr/share/fonts/truetype/noto"
                      ),
                      "-an",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      output,
                  ],
                  check=True,
              )

              print(
                  f"Rendered {verse['verse_key']}"
              )

          print("")
          print("INDIVIDUAL VERSE RENDER: PASSED")
          PY

      # ------------------------------------------------------------
      # 9. Join verses in Quran order
      # ------------------------------------------------------------
      - name: Assemble final Quran video
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(
              "output/production-pipeline.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          concat_file = "output/concat.txt"

          with open(
              concat_file,
              "w",
              encoding="utf-8",
          ) as f:

              for index, verse in enumerate(
                  data["verses"],
                  start=1,
              ):

                  filename = os.path.abspath(
                      f"output/rendered/"
                      f"verse-{index:03d}.mp4"
                  )

                  f.write(
                      f"file '{filename}'\n"
                  )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  concat_file,
                  "-c",
                  "copy",
                  "-movflags",
                  "+faststart",
                  "output/quran-production.mp4",
              ],
              check=True,
          )

          print("")
          print("FINAL VIDEO: CREATED")
          print(
              "Verse order: "
              + ", ".join(
                  v["verse_key"]
                  for v in data["verses"]
              )
          )
          PY

      # ------------------------------------------------------------
      # 10. Verify final video
      # ------------------------------------------------------------
      - name: Verify final production video
        run: |
          test -s output/quran-production.mp4

          echo "FINAL VIDEO METADATA"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/quran-production.mp4

          echo ""
          echo "STEP 35: REAL PRODUCTION PIPELINE PASSED"

      # ------------------------------------------------------------
      # 11. Upload production artifact
      # ------------------------------------------------------------
      - name: Upload production video
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-test
          path: |
            output/quran-production.mp4
            output/production-pipeline.json
          retention-days: 3
