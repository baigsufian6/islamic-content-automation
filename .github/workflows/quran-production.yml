name: Quran Production Pipeline

# ================================================================
# QURAN PRODUCTION PIPELINE
#
# Flow:
#
# GitHub Actions
#       ↓
# Quran Worker
#       ↓
# Render + QA
#       ↓
# GitHub Release backup
#       ↓
# Cloudflare R2
#       ↓
# Buffer
#       ↓
# Instagram / Facebook / YouTube DRAFTS
#
# Make.com is NOT used.
#
# Manual testing:
#   workflow_dispatch
#
# External triggering later:
#   repository_dispatch
# ================================================================

on:
  workflow_dispatch: {}

  repository_dispatch:
    types:
      - produce-quran-section

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:

  production:

    runs-on: ubuntu-latest

    environment: Quran API

    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install rendering and storage dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          python3 -m pip install --quiet \
            requests \
            pillow \
            boto3


      # ============================================================
      # 3. BUILD / RENDER / QA
      # ============================================================

      - name: Build and render next Quran section
        id: build

        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"

          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}

        run: |
          python3 production/quran_worker_wow.py


      # ============================================================
      # 4. READ RUN RESULT
      # ============================================================

      - name: Read run result
        id: meta

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          result_path = Path("run-result.json")

          if not result_path.exists():
              raise SystemExit(
                  "ERROR: run-result.json was not created."
              )

          with result_path.open(
              "r",
              encoding="utf-8",
          ) as fh:
              meta = json.load(fh)

          if meta.get("success") is False:
              raise SystemExit(
                  "ERROR: Quran worker reported failure:\n"
                  + json.dumps(
                      meta,
                      indent=2,
                      ensure_ascii=False,
                  )
              )

          output = meta.get("output")

          if not output:
              raise SystemExit(
                  "ERROR: run-result.json has no 'output' path."
              )

          video_path = Path(output)

          if not video_path.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {video_path}"
              )

          video_name = video_path.name

          tag_name = (
              "section-"
              + datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d-%H%M%S"
              )
          )

          surah = (
              meta.get("surah")
              or meta.get("surah_name")
              or ""
          )

          section = meta.get("section") or {}

          first_ayah = section.get("first_ayah")
          last_ayah = section.get("last_ayah")

          cycle = meta.get("cycle") or 1

          theme = meta.get("theme") or ""

          if not surah:
              match = re.search(
                  r"Surah-(.+?)-Chapter-\d+",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  surah = (
                      match.group(1)
                      .replace("-", " ")
                  )

          ayah_text = ""

          if (
              first_ayah is not None
              and last_ayah is not None
          ):
              if first_ayah == last_ayah:
                  ayah_text = (
                      f"Ayah {first_ayah}"
                  )
              else:
                  ayah_text = (
                      f"Ayahs {first_ayah}–{last_ayah}"
                  )
          else:
              match = re.search(
                  r"-(?:Ayah|Ayahs)-(\d+)(?:-to-(\d+))?",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  first = match.group(1)
                  last = match.group(2)

                  if last:
                      ayah_text = (
                          f"Ayahs {first}–{last}"
                      )
                  else:
                      ayah_text = (
                          f"Ayah {first}"
                      )

          reference = (
              surah.strip()
              if surah.strip()
              else "Quran"
          )

          if ayah_text:
              reference += f" — {ayah_text}"

          caption_lines = [
              f"📖 {reference}",
              "",
          ]

          if theme.strip():
              caption_lines.extend([
                  theme.strip(),
                  "",
              ])

          caption_lines.extend([
              "Listen, reflect, and let the words "
              "of the Quran reach your heart.",
              "",
              f"Quran Cycle {cycle}",
              "",
              "#Quran #Islam #QuranReminder "
              "#IslamicReminder #QuranVerses "
              "#IslamicContent",
          ])

          caption = "\n".join(caption_lines)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_path={output}\n"
              )

              fh.write(
                  f"video_name={video_name}\n"
              )

              fh.write(
                  f"tag_name={tag_name}\n"
              )

              fh.write(
                  "surah="
                  + surah.replace(
                      "\n",
                      " "
                  ).replace(
                      "\r",
                      " "
                  )
                  + "\n"
              )

              fh.write(
                  "ayah_text="
                  + ayah_text
                  + "\n"
              )

              fh.write(
                  f"cycle={cycle}\n"
              )

              fh.write(
                  "caption<<QURAN_CAPTION\n"
              )

              fh.write(
                  caption
                  + "\n"
              )

              fh.write(
                  "QURAN_CAPTION\n"
              )

          print("")
          print("========================================")
          print("SOCIAL CAPTION")
          print("========================================")
          print(caption)

          PY


      # ============================================================
      # 5. UPLOAD PRODUCTION ARTIFACT
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4

        with:
          name: quran-production-${{ steps.meta.outputs.tag_name }}

          path: publish/

          retention-days: 14


      # ============================================================
      # 6. GITHUB RELEASE
      # ============================================================

      - name: Publish finished video to GitHub Release
        id: release

        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}

          name: ${{ steps.meta.outputs.video_name }}

          body: |
            Automated Quran production section.

            Release contains:
            - finished MP4
            - Quran metadata JSON
            - synchronized SRT subtitles

            Social-media media is hosted on Cloudflare R2.

          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
            publish/*.srt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 7. CLOUDFLARE R2
      #
      # Maximum storage:
      #   9 GB
      #
      # When adding a new video would exceed 9 GB,
      # oldest MP4 files are deleted first.
      #
      # JSON/SRT files are preserved.
      # ============================================================

      - name: Upload video to Cloudflare R2
        id: r2

        env:
          R2_ENDPOINT: https://f628f290c08401d255823b7cfe41054c.r2.cloudflarestorage.com

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_BUCKET: quran-production-media

          R2_PUBLIC_BASE_URL: https://pub-4ac1cf8ee6a44509bb69a39b67ba92b0.r2.dev

          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}

          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import boto3
          import requests

          ENDPOINT = (
              os.environ["R2_ENDPOINT"]
              .strip()
              .rstrip("/")
          )

          ACCESS_KEY = (
              os.environ["R2_ACCESS_KEY_ID"]
              .strip()
          )

          SECRET_KEY = (
              os.environ["R2_SECRET_ACCESS_KEY"]
              .strip()
          )

          BUCKET = (
              os.environ["R2_BUCKET"]
              .strip()
          )

          PUBLIC_BASE = (
              os.environ["R2_PUBLIC_BASE_URL"]
              .strip()
              .rstrip("/")
          )

          VIDEO_PATH = Path(
              os.environ["VIDEO_PATH"]
          )

          VIDEO_NAME = os.environ[
              "VIDEO_NAME"
          ]

          if not ACCESS_KEY:
              raise SystemExit(
                  "ERROR: R2_ACCESS_KEY_ID is empty."
              )

          if not SECRET_KEY:
              raise SystemExit(
                  "ERROR: R2_SECRET_ACCESS_KEY is empty."
              )

          if not VIDEO_PATH.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {VIDEO_PATH}"
              )

          print("========================================")
          print("R2 CONFIGURATION")
          print("========================================")
          print(f"R2 endpoint: {ENDPOINT}")
          print(f"R2 bucket: {BUCKET}")
          print(f"Video: {VIDEO_NAME}")

          s3 = boto3.client(
              "s3",
              endpoint_url=ENDPOINT,
              aws_access_key_id=ACCESS_KEY,
              aws_secret_access_key=SECRET_KEY,
              region_name="auto",
          )

          print("Testing R2 connection...")

          s3.head_bucket(
              Bucket=BUCKET
          )

          print("R2 bucket connection successful.")

          MAX_STORAGE = (
              9 * 1024 * 1024 * 1024
          )

          new_size = VIDEO_PATH.stat().st_size

          objects = []

          paginator = s3.get_paginator(
              "list_objects_v2"
          )

          for page in paginator.paginate(
              Bucket=BUCKET
          ):
              objects.extend(
                  page.get(
                      "Contents",
                      []
                  )
              )

          current_size = sum(
              obj["Size"]
              for obj in objects
          )

          projected_size = (
              current_size
              + new_size
          )

          print("")
          print("========================================")
          print("R2 STORAGE CHECK")
          print("========================================")

          print(
              f"Current storage: "
              f"{current_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"New video: "
              f"{new_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Projected storage: "
              f"{projected_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Maximum: "
              f"{MAX_STORAGE / 1024 / 1024:.2f} MB"
          )

          if projected_size > MAX_STORAGE:

              print(
                  "9 GB limit would be exceeded."
              )

              print(
                  "Deleting oldest MP4 files..."
              )

              mp4_objects = [
                  obj
                  for obj in objects
                  if obj["Key"]
                  .lower()
                  .endswith(".mp4")
              ]

              mp4_objects.sort(
                  key=lambda obj:
                  obj["LastModified"]
              )

              for obj in mp4_objects:

                  if projected_size <= MAX_STORAGE:
                      break

                  key = obj["Key"]
                  size = obj["Size"]

                  print(
                      f"Deleting: {key}"
                  )

                  s3.delete_object(
                      Bucket=BUCKET,
                      Key=key,
                  )

                  projected_size -= size

              if projected_size > MAX_STORAGE:
                  raise SystemExit(
                      "ERROR: Could not reduce R2 "
                      "storage below 9 GB."
                  )

          print("")
          print("Uploading video to R2...")

          s3.upload_file(
              str(VIDEO_PATH),
              BUCKET,
              VIDEO_NAME,
              ExtraArgs={
                  "ContentType": "video/mp4"
              },
          )

          video_url = (
              f"{PUBLIC_BASE}/"
              f"{quote(VIDEO_NAME, safe='/')}"
          )

          print(
              f"Public URL: {video_url}"
          )

          print(
              "Verifying public URL..."
          )

          verify = requests.head(
              video_url,
              allow_redirects=True,
              timeout=30,
          )

          if verify.status_code >= 400:
              raise SystemExit(
                  "ERROR: Public R2 URL returned "
                  f"HTTP {verify.status_code}"
              )

          print(
              "Public R2 URL verification passed."
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:
              fh.write(
                  f"video_url={video_url}\n"
              )

          PY


      # ============================================================
      # 8. CREATE BUFFER DRAFTS
      #
      # Buffer flow:
      #
      # API authentication
      #       ↓
      # account organizations
      #       ↓
      # channels
      #       ↓
      # Instagram / Facebook / YouTube
      #
      # Everything is saved as a DRAFT.
      #
      # Nothing is automatically published.
      # ============================================================

      - name: Create Buffer drafts

        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          SURAH: ${{ steps.meta.outputs.surah }}

          AYAH_TEXT: ${{ steps.meta.outputs.ayah_text }}

          CYCLE: ${{ steps.meta.outputs.cycle }}

          CAPTION: ${{ steps.meta.outputs.caption }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          import requests


          # ========================================================
          # CONFIG
          # ========================================================

          API = "https://api.buffer.com"

          API_KEY = (
              os.environ.get(
                  "BUFFER_API_KEY",
                  ""
              ).strip()
          )

          VIDEO_URL = (
              os.environ.get(
                  "BUFFER_VIDEO_URL",
                  ""
              ).strip()
          )

          CAPTION = os.environ.get(
              "CAPTION",
              ""
          )


          # ========================================================
          # VALIDATION
          # ========================================================

          if not API_KEY:
              raise SystemExit(
                  "ERROR: BUFFER_API_KEY is empty."
              )

          if not VIDEO_URL:
              raise SystemExit(
                  "ERROR: BUFFER_VIDEO_URL is empty."
              )

          if not VIDEO_URL.startswith(
              "https://"
          ):
              raise SystemExit(
                  "ERROR: Buffer video URL must be HTTPS."
              )


          # ========================================================
          # HEADERS
          # ========================================================

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {API_KEY}",
          }


          # ========================================================
          # 1. GET ACCOUNT + ORGANIZATION
          #
          # We deliberately do NOT hard-code the organization ID.
          #
          # This prevents the previous ...e6 / ...e4 mismatch.
          # ========================================================

          account_query = """
          query GetAccount {
            account {
              id
              organizations {
                id
                name
              }
            }
          }
          """

          print("")
          print("========================================")
          print("BUFFER AUTHENTICATION")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": account_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer authentication failed."
              )

          account_data = response.json()

          if account_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer account query failed:\n"
                  + json.dumps(
                      account_data["errors"],
                      indent=2,
                  )
              )

          account = (
              account_data
              .get("data", {})
              .get("account")
          )

          if not account:

              raise SystemExit(
                  "ERROR: Buffer returned no account."
              )

          organizations = (
              account.get(
                  "organizations"
              )
              or []
          )

          if not organizations:

              raise SystemExit(
                  "ERROR: No Buffer organizations "
                  "are available for this API key."
              )

          print(
              f"Found {len(organizations)} "
              "Buffer organization(s)."
          )

          for organization in organizations:

              print(
                  f"- {organization.get('name')} "
                  f"({organization.get('id')})"
              )


          # ========================================================
          # SELECT ORGANIZATION
          #
          # The authentication test confirmed this organization:
          #
          # 6a4a94cd8807be89129990e4
          #
          # Prefer it when present.
          #
          # If it isn't present, and there is exactly one
          # organization, use that one.
          # ========================================================

          EXPECTED_ORGANIZATION_ID = (
              "6a4a94cd8807be89129990e4"
          )

          organization = next(
              (
                  org
                  for org in organizations
                  if org.get("id")
                  == EXPECTED_ORGANIZATION_ID
              ),
              None,
          )

          if organization is None:

              if len(organizations) == 1:

                  organization = (
                      organizations[0]
                  )

                  print(
                      "Expected organization ID was "
                      "not returned; using the only "
                      "available organization."
                  )

              else:

                  raise SystemExit(
                      "ERROR: Expected Buffer organization "
                      f"{EXPECTED_ORGANIZATION_ID} was not found, "
                      "and multiple organizations are available."
                  )


          organization_id = organization[
              "id"
          ]

          print("")
          print(
              f"Using Buffer organization: "
              f"{organization.get('name')}"
          )

          print(
              f"Organization ID: "
              f"{organization_id}"
          )


          # ========================================================
          # 2. GET CHANNELS
          #
          # This is Buffer's documented channel query.
          # ========================================================

          channel_query = f"""
          query GetChannels {{
            channels(
              input: {{
                organizationId: "{organization_id}"
              }}
            ) {{
              id
              name
              displayName
              service
              isQueuePaused
              isDisconnected
              isLocked
            }}
          }}
          """

          print("")
          print("========================================")
          print("BUFFER CHANNEL DISCOVERY")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": channel_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer channel request failed."
              )

          channel_data = response.json()

          if channel_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer channel query failed:\n"
                  + json.dumps(
                      channel_data["errors"],
                      indent=2,
                  )
              )

          channels = (
              channel_data
              .get("data", {})
              .get("channels", [])
          )

          if not channels:

              raise SystemExit(
                  "ERROR: Buffer returned zero channels."
              )

          print(
              f"Found {len(channels)} Buffer channel(s)."
          )


          # ========================================================
          # FIND TARGET CHANNELS
          # ========================================================

          instagram = None
          facebook = None
          youtube = None

          for channel in channels:

              service = (
                  channel.get(
                      "service"
                  )
                  or ""
              ).lower()

              display_name = (
                  channel.get(
                      "displayName"
                  )
                  or channel.get(
                      "name"
                  )
                  or channel.get(
                      "id"
                  )
              )

              print(
                  f"- {display_name} "
                  f"[{service}] "
                  f"id={channel.get('id')}"
              )

              if channel.get(
                  "isDisconnected"
              ):
                  print(
                      "  WARNING: channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):
                  print(
                      "  WARNING: channel is locked."
                  )

              if service == "instagram":
                  instagram = channel

              elif service == "facebook":
                  facebook = channel

              elif service == "youtube":
                  youtube = channel


          # ========================================================
          # CREATE DRAFT
          # ========================================================

          def create_draft(
              channel,
              label,
          ):

              if not channel:

                  print(
                      f"{label} channel not found; "
                      "skipping."
                  )

                  return

              if channel.get(
                  "isDisconnected"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is locked."
                  )

              channel_id = channel[
                  "id"
              ]


              # ----------------------------------------------------
              # Platform-specific metadata
              # ----------------------------------------------------

              if label == "Instagram":

                  metadata_graphql = """
                  metadata: {
                    instagram: {
                      type: reel
                      shouldShareToFeed: true
                    }
                  }
                  """

              elif label == "Facebook":

                  metadata_graphql = """
                  metadata: {
                    facebook: {
                      type: reel
                    }
                  }
                  """

              elif label == "YouTube":

                  youtube_title = (
                      os.environ.get(
                          "SURAH"
                      )
                      or "Quran Reminder"
                  )

                  metadata_graphql = f"""
                  metadata: {{
                    youtube: {{
                      type: short
                      categoryId: "27"
                      title: {json.dumps(
                          youtube_title
                      )}
                      privacy: private
                      madeForKids: false
                      notifySubscribers: false
                      embeddable: true
                    }}
                  }}
                  """

              else:

                  raise SystemExit(
                      f"Unsupported Buffer service: {label}"
                  )


              # ----------------------------------------------------
              # CreatePost
              #
              # Video URL is public R2 URL.
              # Buffer requires public media URLs.
              # ----------------------------------------------------

              mutation = f"""
              mutation CreateDraft {{
                createPost(
                  input: {{
                    text: {json.dumps(CAPTION)}

                    channelId: {json.dumps(
                        channel_id
                    )}

                    schedulingType: automatic

                    mode: addToQueue

                    saveToDraft: true

                    assets: [
                      {{
                        video: {{
                          url: {json.dumps(
                              VIDEO_URL
                          )}
                        }}
                      }}
                    ]

                    {metadata_graphql}
                  }}
                ) {{
                  ... on PostActionSuccess {{
                    post {{
                      id
                      text
                      status
                      channelId
                      type
                    }}
                  }}

                  ... on MutationError {{
                    message
                  }}
                }}
              }}
              """


              print("")
              print(
                  "----------------------------------------"
              )

              print(
                  f"Creating {label} draft..."
              )

              print(
                  f"Buffer channel ID: {channel_id}"
              )

              result = requests.post(
                  API,
                  headers=headers,
                  json={
                      "query": mutation
                  },
                  timeout=60,
              )

              print(
                  f"Buffer HTTP status: "
                  f"{result.status_code}"
              )

              if result.status_code != 200:

                  print(
                      result.text
                  )

                  raise SystemExit(
                      f"ERROR: Buffer HTTP request "
                      f"failed for {label}."
                  )

              payload = result.json()


              # ----------------------------------------------------
              # GraphQL errors
              # ----------------------------------------------------

              if payload.get(
                  "errors"
              ):

                  raise SystemExit(
                      f"ERROR: Buffer GraphQL error "
                      f"for {label}:\n"
                      + json.dumps(
                          payload["errors"],
                          indent=2,
                      )
                  )


              create_result = (
                  payload
                  .get("data", {})
                  .get("createPost")
              )


              if not create_result:

                  raise SystemExit(
                      f"ERROR: Buffer returned no "
                      f"createPost result for {label}."
                  )


              # ----------------------------------------------------
              # MutationError
              # ----------------------------------------------------

              if create_result.get(
                  "message"
              ):

                  raise SystemExit(
                      f"ERROR: Buffer rejected "
                      f"{label}:\n"
                      f"{create_result['message']}"
                  )


              post = (
                  create_result.get(
                      "post"
                  )
              )


              if not post:

                  raise SystemExit(
                      f"ERROR: Buffer did not create "
                      f"{label} draft."
                  )


              print("")
              print(
                  f"{label} DRAFT CREATED"
              )

              print(
                  f"Post ID: "
