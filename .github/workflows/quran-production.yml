name: Quran Production Pipeline

# ================================================================
# QURAN PRODUCTION PIPELINE
#
# Flow:
#
# GitHub Actions (daily 08:00 UTC, automatic)
#       ↓
# Quran Worker
#       ↓
# Render + QA
#       ↓
# SAFETY NET: raw outputs saved as a workflow artifact (always runs)
#       ↓
# GitHub Release backup (+ auto-cleanup of old releases)
#       ↓
# Cloudflare R2
#       ↓
# R2 accessibility verification (incl. Meta crawler simulation)
#       ↓
# Buffer
#       ↓
# Instagram / Facebook / YouTube — AUTO-PUBLISHED
# (queued via Buffer, published automatically at each channel's
#  next scheduled slot; Facebook AND YouTube each get skipped
#  safely — not force-published — if the video is longer than
#  that platform's short-form duration limit; Facebook also gets
#  a retry on transient errors; one channel failing no longer
#  stops the other channels from being tried)
#
# Make.com is NOT used.
#
# Automatic daily trigger:
#   schedule (cron)
#
# Manual testing:
#   workflow_dispatch
#
# External triggering later:
#   repository_dispatch
#
# NOTE on schedule timing:
#   GitHub Actions cron runs in UTC and is best-effort, not exact —
#   under platform load it can fire 10-20+ minutes late. It also
#   auto-disables if this repo goes 60 days with zero commit
#   activity, so keep COMMIT_PROGRESS/GIT_PUSH_PROGRESS enabled
#   (they already are, below) so every run itself counts as activity.
#
# ----------------------------------------------------------------
# CHANGELOG
#
#   1. action-gh-release has a TODO to pin to a full commit SHA.
#   2. organizationId escaped with json.dumps() in the Buffer script.
#   3. R2 cleanup has MIN_RETAINED_MP4S and MAX_DELETES_PER_RUN.
#   4. "Run summary" step for a human-visible record of each run.
#   5. Pip installs are version-pinned.
#   6. GitHub Releases auto-cleaned with floor + per-run cap.
#   7. YouTube safe-skip for videos over the Shorts limit.
#
#   NEW IN THIS VERSION:
#   8. SAFETY NET: right after the build step, the raw outputs
#      (run-result.json, publish/, any .mp4) are uploaded as a
#      workflow artifact with `if: always()`. Even if "Read run
#      result", the Release, R2 or Buffer fails, the video is kept
#      for 14 days under the run's Artifacts section.
#   9. Release cleanup is now non-blocking (continue-on-error) and
#      only touches releases whose tag starts with "section-", so a
#      housekeeping failure can't stop publishing and manual
#      releases are never counted or deleted.
#  10. The GitHub Release step is also non-blocking now. The
#      artifact (8) is the real safety net, and a GitHub API
#      hiccup shouldn't stop R2 + Buffer from running.
#  11. Buffer: each channel is attempted independently. If
#      Instagram fails, Facebook and YouTube are still tried. The
#      status outputs are always written, and the step still FAILS
#      at the end if any channel failed, so you see the red X.
#  12. Run summary: caption and other values are passed via env
#      vars instead of being pasted into the shell script (a quote,
#      backtick or $(...) in a caption could break/execute).
# ----------------------------------------------------------------
# ================================================================

on:
  schedule:
    # 08:00 UTC every day.
    - cron: "0 8 * * *"

  workflow_dispatch: {}

  repository_dispatch:
    types:
      - produce-quran-section

permissions:
  contents: write
  actions: write   # needed to delete old workflow runs (last step)

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:

  production:

    runs-on: ubuntu-latest

    environment: Quran API

    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # (see earlier notes: core packages are atomic, each Arabic
      #  font is installed independently, and we fail loudly if none
      #  of the Arabic fonts landed.)
      # ============================================================

      - name: Install rendering and storage dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-extra

          for pkg in fonts-hosny-amiri fonts-sil-scheherazade fonts-noto-naskh-arabic; do
            sudo apt-get install -y "$pkg" \
              || echo "WARNING: apt package '$pkg' unavailable on this mirror, skipping."
          done

          sudo fc-cache -f

          if ! fc-list | grep -qiE "amiri|scheherazade|noto naskh arabic"; then
            echo "ERROR: No Arabic-script font installed (Amiri / Scheherazade / Noto Naskh Arabic all missing)."
            exit 1
          fi

          python3 -m pip install --quiet \
            requests==2.32.3 \
            pillow==10.4.0 \
            boto3==1.35.36 \
            arabic-reshaper==3.0.0 \
            python-bidi==0.4.2 \
            opencv-python-headless==4.10.0.84


      # ============================================================
      # 2.5. DIAGNOSTIC: confirm quran_worker_wow.py actually exists
      # ============================================================

      - name: Confirm quran_worker.py exists
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Full repo tree (excluding .git):"
          find . -not -path "*/.git/*" -not -path "./.git" | sort

          echo ""
          echo "Every .py file in the repo:"
          find . -iname "*.py" -not -path "*/.git/*"

          echo ""
          echo "Searching specifically for quran_worker_wow.py:"
          find . -iname "quran_worker_wow.py" -not -path "*/.git/*"

          echo ""
          if [ ! -f "production/quran_worker_wow.py" ]; then
            echo "ERROR: production/quran_worker_wow.py does not exist at the expected path."
            exit 1
          fi

          echo "production/quran_worker_wow.py found as expected."


      # ============================================================
      # 3. BUILD / RENDER / QA
      # ============================================================

      - name: Build and render next Quran section
        id: build

        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"

          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}

        run: |
          python3 production/quran_worker_wow.py


      # ============================================================
      # 3.5. SAFETY NET — SAVE RAW OUTPUTS NO MATTER WHAT
      #
      # Runs even if the build step above failed partway (if: always()).
      # If anything later in the flow breaks (Read run result, Release,
      # R2, Buffer), the rendered video + metadata are still
      # downloadable from this run's "Artifacts" section for 14 days.
      #
      # ADJUST `path` if your worker writes the MP4 somewhere else.
      # `if-no-files-found: warn` means a missing path never fails
      # the job; it only logs a warning.
      #
      # TODO: pin to a full commit SHA like the release action, e.g.
      #   uses: actions/upload-artifact@<full-40-char-sha> # v4.x.x
      # ============================================================

      - name: Save raw outputs as workflow artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: quran-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-result.json
            publish/
            output/
            **/*.mp4
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 4. READ RUN RESULT
      # ============================================================

      - name: Read run result
        id: meta

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import random
          from pathlib import Path
          from datetime import datetime, timezone

          result_path = Path("run-result.json")

          if not result_path.exists():
              raise SystemExit(
                  "ERROR: run-result.json was not created."
              )

          with result_path.open(
              "r",
              encoding="utf-8",
          ) as fh:
              meta = json.load(fh)

          if meta.get("success") is False:
              raise SystemExit(
                  "ERROR: Quran worker reported failure:\n"
                  + json.dumps(
                      meta,
                      indent=2,
                      ensure_ascii=False,
                  )
              )

          output = meta.get("output")

          if not output:
              raise SystemExit(
                  "ERROR: run-result.json has no 'output' path."
              )

          video_path = Path(output)

          if not video_path.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {video_path}"
              )

          video_name = video_path.name

          tag_name = (
              "section-"
              + datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d-%H%M%S"
              )
          )

          surah = (
              meta.get("surah")
              or meta.get("surah_name")
              or ""
          )

          section = meta.get("section") or {}

          first_ayah = section.get("first_ayah")
          last_ayah = section.get("last_ayah")

          cycle = meta.get("cycle") or 1

          theme = meta.get("theme") or ""

          # Read actual rendered duration so platform-specific limits are
          # enforced before any Buffer post is created.
          duration_seconds = None
          for candidate in (
              meta.get("duration_seconds"),
              meta.get("duration"),
              section.get("duration_seconds"),
          ):
              try:
                  if candidate is not None:
                      duration_seconds = float(candidate)
                      break
              except (TypeError, ValueError):
                  pass

          if duration_seconds is None:
              import subprocess
              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(video_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              duration_seconds = float(probe.stdout.strip())

          if duration_seconds <= 0:
              raise SystemExit(
                  f"ERROR: Invalid video duration: {duration_seconds}"
              )

          # Facebook Reels hard limit is 90s; 88s is used as a safety
          # margin so a video right on the edge never gets rejected.
          facebook_compatible = duration_seconds <= 88.0

          # YouTube Shorts requires vertical video to be 60 seconds or
          # less to be treated/labeled as a Short. 58s is used as a
          # safety margin, mirroring the Facebook pattern above.
          youtube_compatible = duration_seconds <= 58.0

          if not surah:
              match = re.search(
                  r"Surah-(.+?)-Chapter-\d+",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  surah = (
                      match.group(1)
                      .replace("-", " ")
                  )

          ayah_text = ""

          if (
              first_ayah is not None
              and last_ayah is not None
          ):
              if first_ayah == last_ayah:
                  ayah_text = (
                      f"Ayah {first_ayah}"
                  )
              else:
                  ayah_text = (
                      f"Ayahs {first_ayah}–{last_ayah}"
                  )
          else:
              match = re.search(
                  r"-(?:Ayah|Ayahs)-(\d+)(?:-to-(\d+))?",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  first = match.group(1)
                  last = match.group(2)

                  if last:
                      ayah_text = (
                          f"Ayahs {first}–{last}"
                      )
                  else:
                      ayah_text = (
                          f"Ayah {first}"
                      )

          reference = (
              surah.strip()
              if surah.strip()
              else "Quran"
          )

          if ayah_text:
              reference += f" — {ayah_text}"

          # ==============================================================
          # ROTATING INTRO LINE
          #
          # Deterministic per (surah, cycle, ayah range) so re-running the
          # same section never changes the caption.
          # ==============================================================

          rng = random.Random(f"{surah}-{cycle}-{ayah_text}")

          intros = [
              "Listen, reflect, and let the words of the Quran reach your heart.",
              "A moment to pause and reflect on the words of Allah.",
              "Let these verses sit with you today.",
              "Words worth returning to, again and again.",
              "Take a moment to reflect on this reminder.",
              "A gentle reminder from the Quran, for your heart today.",
          ]

          caption_lines = [
              f"📖 {reference}",
              "",
          ]

          if theme.strip():
              caption_lines.extend([
                  theme.strip().capitalize(),
                  "",
              ])

          caption_lines.extend([
              rng.choice(intros),
              "",
              f"Quran Cycle {cycle}",
              "",
              "#Quran #Islam #QuranReminder "
              "#IslamicReminder #QuranVerses "
              "#IslamicContent",
          ])

          caption = "\n".join(caption_lines)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_path={output}\n"
              )

              fh.write(
                  f"video_name={video_name}\n"
              )

              fh.write(
                  f"tag_name={tag_name}\n"
              )

              fh.write(
                  "surah="
                  + surah.replace(
                      "\n",
                      " "
                  ).replace(
                      "\r",
                      " "
                  )
                  + "\n"
              )

              fh.write(
                  "ayah_text="
                  + ayah_text
                  + "\n"
              )

              fh.write(
                  f"cycle={cycle}\n"
              )

              fh.write(
                  f"duration_seconds={duration_seconds:.3f}\n"
              )

              fh.write(
                  f"facebook_compatible={'true' if facebook_compatible else 'false'}\n"
              )

              fh.write(
                  f"youtube_compatible={'true' if youtube_compatible else 'false'}\n"
              )

              fh.write(
                  "caption<<QURAN_CAPTION\n"
              )

              fh.write(
                  caption
                  + "\n"
              )

              fh.write(
                  "QURAN_CAPTION\n"
              )

          print("")
          print("========================================")
          print("SOCIAL CAPTION")
          print("========================================")
          print(caption)

          print("")
          print(f"Duration: {duration_seconds:.2f}s")
          print(f"Facebook compatible (<=88s): {facebook_compatible}")
          print(f"YouTube Shorts compatible (<=58s): {youtube_compatible}")

          PY


      # ============================================================
      # 6. GITHUB RELEASE (backup)
      #
      # continue-on-error: the workflow artifact saved earlier is the
      # primary safety net, so a GitHub API hiccup here must not stop
      # R2 + Buffer from running.
      #
      # TODO: pin to an exact commit SHA instead of a tag:
      #   git ls-remote https://github.com/softprops/action-gh-release v2.6.2
      #   uses: softprops/action-gh-release@<full-40-char-sha> # v2.6.2
      # ============================================================

      - name: Publish finished video to GitHub Release
        id: release
        continue-on-error: true

        uses: softprops/action-gh-release@v2 # TODO: pin to commit SHA — see note above

        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}

          name: ${{ steps.meta.outputs.video_name }}

          body: |
            Automated Quran production section.

            Release contains:
            - finished MP4
            - Quran metadata JSON
            - synchronized SRT subtitles

            Social-media media is hosted on Cloudflare R2.

          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
            publish/*.srt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 6.5. CLEAN UP OLD GITHUB RELEASES
      #
      # Non-blocking (continue-on-error) so housekeeping can never
      # stop publishing. Only releases whose tag starts with
      # "section-" are counted or deleted, so manual releases are safe.
      # Runs AFTER the new release is created.
      # ============================================================

      - name: Clean up old GitHub Releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          python3 - <<'PY'
          import os
          import requests

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]  # "owner/repo"

          # Circuit breakers — same spirit as the R2 cleanup step below.
          MIN_RETAINED_RELEASES = 30   # never go below this many releases
          MAX_DELETES_PER_RUN = 10     # never delete more than this many in one run
          TAG_PREFIX = "section-"      # only manage releases this pipeline created

          API = f"https://api.github.com/repos/{REPO}"
          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
          }

          releases = []
          page = 1
          while True:
              resp = requests.get(
                  f"{API}/releases",
                  headers=headers,
                  params={"per_page": 100, "page": page},
                  timeout=30,
              )
              resp.raise_for_status()
              batch = resp.json()
              if not batch:
                  break
              releases.extend(batch)
              page += 1

          # Only pipeline-created releases; never touch manual ones.
          releases = [
              r for r in releases
              if r.get("tag_name", "").startswith(TAG_PREFIX)
          ]

          # Oldest first.
          releases.sort(key=lambda r: r["created_at"])

          print("========================================")
          print("GITHUB RELEASE CLEANUP")
          print("========================================")
          print(f"Pipeline releases found ({TAG_PREFIX}*): {len(releases)}")
          print(f"Retention floor (MIN_RETAINED_RELEASES): {MIN_RETAINED_RELEASES}")
          print(f"Per-run delete cap (MAX_DELETES_PER_RUN): {MAX_DELETES_PER_RUN}")

          deleted = 0
          for release in releases:
              remaining = len(releases) - deleted
              if remaining <= MIN_RETAINED_RELEASES:
                  print(
                      "STOPPING: retention floor "
                      f"(MIN_RETAINED_RELEASES={MIN_RETAINED_RELEASES}) reached."
                  )
                  break
              if deleted >= MAX_DELETES_PER_RUN:
                  print(
                      "STOPPING: reached MAX_DELETES_PER_RUN "
                      f"({MAX_DELETES_PER_RUN}) for this run. Refusing to "
                      "delete more in one go."
                  )
                  break

              release_id = release["id"]
              tag = release["tag_name"]

              print(f"Deleting release: {tag} (created {release['created_at']})")

              del_resp = requests.delete(
                  f"{API}/releases/{release_id}",
                  headers=headers,
                  timeout=30,
              )
              if del_resp.status_code not in (204, 200):
                  print(
                      f"  WARNING: failed to delete release {tag}: "
                      f"{del_resp.status_code} {del_resp.text}"
                  )
                  continue

              # Also delete the underlying git tag, otherwise it lingers forever.
              tag_resp = requests.delete(
                  f"{API}/git/refs/tags/{tag}",
                  headers=headers,
                  timeout=30,
              )
              if tag_resp.status_code not in (204, 200, 422):
                  print(
                      f"  WARNING: failed to delete tag {tag}: "
                      f"{tag_resp.status_code} {tag_resp.text}"
                  )

              deleted += 1

          print("")
          print(f"Deleted {deleted} old release(s) this run.")
          PY


      # ============================================================
      # 7. CLOUDFLARE R2
      #
      # Maximum storage: 9 GB. When adding a new video would exceed
      # it, oldest MP4 files are deleted first, subject to
      # MIN_RETAINED_MP4S and MAX_DELETES_PER_RUN circuit breakers.
      # JSON/SRT files are preserved.
      # ============================================================

      - name: Upload video to Cloudflare R2
        id: r2

        env:
          R2_ENDPOINT: https://f628f290c08401d255823b7cfe41054c.r2.cloudflarestorage.com

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_BUCKET: quran-production-media

          R2_PUBLIC_BASE_URL: https://pub-4ac1cf8ee6a44509bb69a39b67ba92b0.r2.dev

          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}

          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import boto3
          import requests

          ENDPOINT = (
              os.environ["R2_ENDPOINT"]
              .strip()
              .rstrip("/")
          )

          ACCESS_KEY = (
              os.environ["R2_ACCESS_KEY_ID"]
              .strip()
          )

          SECRET_KEY = (
              os.environ["R2_SECRET_ACCESS_KEY"]
              .strip()
          )

          BUCKET = (
              os.environ["R2_BUCKET"]
              .strip()
          )

          PUBLIC_BASE = (
              os.environ["R2_PUBLIC_BASE_URL"]
              .strip()
              .rstrip("/")
          )

          VIDEO_PATH = Path(
              os.environ["VIDEO_PATH"]
          )

          VIDEO_NAME = os.environ[
              "VIDEO_NAME"
          ]

          # Circuit breakers for the auto-cleanup below.
          MIN_RETAINED_MP4S = 5
          MAX_DELETES_PER_RUN = 10

          if not ACCESS_KEY:
              raise SystemExit(
                  "ERROR: R2_ACCESS_KEY_ID is empty."
              )

          if not SECRET_KEY:
              raise SystemExit(
                  "ERROR: R2_SECRET_ACCESS_KEY is empty."
              )

          if not VIDEO_PATH.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {VIDEO_PATH}"
              )

          print("========================================")
          print("R2 CONFIGURATION")
          print("========================================")
          print(f"R2 endpoint: {ENDPOINT}")
          print(f"R2 bucket: {BUCKET}")
          print(f"Video: {VIDEO_NAME}")

          s3 = boto3.client(
              "s3",
              endpoint_url=ENDPOINT,
              aws_access_key_id=ACCESS_KEY,
              aws_secret_access_key=SECRET_KEY,
              region_name="auto",
          )

          print("Testing R2 connection...")

          s3.head_bucket(
              Bucket=BUCKET
          )

          print("R2 bucket connection successful.")

          MAX_STORAGE = (
              9 * 1024 * 1024 * 1024
          )

          new_size = VIDEO_PATH.stat().st_size

          objects = []

          paginator = s3.get_paginator(
              "list_objects_v2"
          )

          for page in paginator.paginate(
              Bucket=BUCKET
          ):
              objects.extend(
                  page.get(
                      "Contents",
                      []
                  )
              )

          current_size = sum(
              obj["Size"]
              for obj in objects
          )

          projected_size = (
              current_size
              + new_size
          )

          print("")
          print("========================================")
          print("R2 STORAGE CHECK")
          print("========================================")

          print(
              f"Current storage: "
              f"{current_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"New video: "
              f"{new_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Projected storage: "
              f"{projected_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Maximum: "
              f"{MAX_STORAGE / 1024 / 1024:.2f} MB"
          )

          deleted_keys = []

          if projected_size > MAX_STORAGE:

              print(
                  "9 GB limit would be exceeded."
              )

              mp4_objects = [
                  obj
                  for obj in objects
                  if obj["Key"]
                  .lower()
                  .endswith(".mp4")
              ]

              mp4_objects.sort(
                  key=lambda obj:
                  obj["LastModified"]
              )

              print(
                  f"MP4s currently in bucket: {len(mp4_objects)}"
              )
              print(
                  f"Retention floor (MIN_RETAINED_MP4S): {MIN_RETAINED_MP4S}"
              )
              print(
                  f"Per-run delete cap (MAX_DELETES_PER_RUN): {MAX_DELETES_PER_RUN}"
              )
              print(
                  "Deleting oldest MP4 files (subject to the above limits)..."
              )

              for obj in mp4_objects:

                  if projected_size <= MAX_STORAGE:
                      break

                  if len(deleted_keys) >= MAX_DELETES_PER_RUN:
                      print(
                          "STOPPING: reached MAX_DELETES_PER_RUN "
                          f"({MAX_DELETES_PER_RUN}) for this run. "
                          "Refusing to delete more in one go — this "
                          "usually means something upstream is "
                          "producing far more/larger video than "
                          "expected and deserves a look before more "
                          "history is removed."
                      )
                      break

                  remaining_mp4s = len(mp4_objects) - len(deleted_keys)
                  if remaining_mp4s <= MIN_RETAINED_MP4S:
                      print(
                          "STOPPING: retention floor "
                          f"(MIN_RETAINED_MP4S={MIN_RETAINED_MP4S}) "
                          "reached. Refusing to delete the last "
                          f"{MIN_RETAINED_MP4S} MP4s even though "
                          "still over the storage budget."
                      )
                      break

                  key = obj["Key"]
                  size = obj["Size"]

                  print(
                      f"Deleting: {key} "
                      f"({size / 1024 / 1024:.2f} MB, "
                      f"last modified {obj['LastModified']})"
                  )

                  s3.delete_object(
                      Bucket=BUCKET,
                      Key=key,
                  )

                  deleted_keys.append(key)
                  projected_size -= size

              print("")
              if deleted_keys:
                  print(
                      f"Deleted {len(deleted_keys)} MP4(s) this run:"
                  )
                  for key in deleted_keys:
                      print(f"  - {key}")
              else:
                  print("No MP4s were deleted this run.")

              if projected_size > MAX_STORAGE:
                  raise SystemExit(
                      "ERROR: Could not reduce R2 storage below 9 GB "
                      "within the configured safety limits "
                      f"(MIN_RETAINED_MP4S={MIN_RETAINED_MP4S}, "
                      f"MAX_DELETES_PER_RUN={MAX_DELETES_PER_RUN}). "
                      "Raise the storage budget, review why files are "
                      "larger than expected, or manually clear out "
                      "old media before re-running."
                  )

          print("")
          print("Uploading video to R2...")

          s3.upload_file(
              str(VIDEO_PATH),
              BUCKET,
              VIDEO_NAME,
              ExtraArgs={
                  "ContentType": "video/mp4"
              },
          )

          video_url = (
              f"{PUBLIC_BASE}/"
              f"{quote(VIDEO_NAME, safe='/')}"
          )

          print(
              f"Public URL: {video_url}"
          )

          print(
              "Verifying public URL..."
          )

          verify = requests.head(
              video_url,
              allow_redirects=True,
              timeout=30,
          )

          if verify.status_code >= 400:
              raise SystemExit(
                  "ERROR: Public R2 URL returned "
                  f"HTTP {verify.status_code}"
              )

          print(
              "Public R2 URL verification passed."
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:
              fh.write(
                  f"video_url={video_url}\n"
              )

              fh.write(
                  f"r2_deleted_count={len(deleted_keys)}\n"
              )

          PY


      # ============================================================
      # 8. R2 VIDEO ACCESSIBILITY TEST
      #
      #   1. HEAD
      #   2. Byte-range GET (1MB) — must return 206 + Content-Range
      #   3. HEAD as Meta's crawler (warning only)
      # ============================================================

      - name: Verify R2 video for Buffer
        env:
          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

        run: |
          set -e

          if [ -z "$BUFFER_VIDEO_URL" ]; then
            echo "ERROR: BUFFER_VIDEO_URL is empty."
            exit 1
          fi

          echo "========================================"
          echo "R2 BUFFER VIDEO ACCESS TEST"
          echo "========================================"

          echo ""
          echo "Video URL:"
          echo "$BUFFER_VIDEO_URL"

          echo ""
          echo "========================================"
          echo "1. HEAD REQUEST (default client)"
          echo "========================================"

          curl \
            -I \
            -L \
            --fail \
            --max-time 30 \
            "$BUFFER_VIDEO_URL"

          echo ""
          echo "HEAD request passed."

          echo ""
          echo "========================================"
          echo "2. BYTE-RANGE REQUEST"
          echo "========================================"
          echo "(This also stands in for a full-file GET test:"
          echo "a 1MB range is enough to confirm the object is a"
          echo "real, readable MP4 without re-downloading the"
          echo "entire video a second time after it was already"
          echo "uploaded to R2 and GitHub Release.)"

          rm -f /tmp/r2-range-headers.txt
          rm -f /tmp/r2-range-test.bin

          curl \
            -L \
            --fail \
            --range 0-1048575 \
            --dump-header /tmp/r2-range-headers.txt \
            --output /tmp/r2-range-test.bin \
            --max-time 60 \
            "$BUFFER_VIDEO_URL"

          echo ""
          echo "Range response headers:"
          cat /tmp/r2-range-headers.txt

          echo ""
          echo "Downloaded range:"
          ls -lh /tmp/r2-range-test.bin

          if [ ! -s /tmp/r2-range-test.bin ]; then
            echo "ERROR: Range GET returned an empty file."
            exit 1
          fi

          echo ""
          echo "File identification (from the first 1MB, which"
          echo "contains the MP4 header/ftyp box):"
          file /tmp/r2-range-test.bin

          if ! grep -qi "^HTTP/.* 206" /tmp/r2-range-headers.txt; then
            echo ""
            echo "ERROR: Server did not return 206 Partial Content"
            echo "for a byte-range request. It likely ignored the"
            echo "Range header and returned the full file instead."
            echo "This is a common root cause of Facebook's"
            echo "'Video could not be read from its URL' error,"
            echo "since Meta's ingest pipeline expects range support."
            exit 1
          fi

          if ! grep -qi "^Content-Range:" /tmp/r2-range-headers.txt; then
            echo ""
            echo "ERROR: Response is missing a Content-Range header"
            echo "on a ranged request. Byte-range support looks"
            echo "incomplete."
            exit 1
          fi

          echo ""
          echo "Byte-range support confirmed (206 + Content-Range)."

          echo ""
          echo "========================================"
          echo "3. HEAD REQUEST AS META'S CRAWLER"
          echo "========================================"
          echo "Simulating the facebookexternalhit user agent to"
          echo "check whether Cloudflare bot protection treats"
          echo "Meta's fetcher differently from a normal client."

          set +e

          curl \
            -I \
            -L \
            --max-time 30 \
            -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "$BUFFER_VIDEO_URL" \
            > /tmp/r2-meta-ua-headers.txt 2>&1

          META_UA_EXIT=$?

          set -e

          cat /tmp/r2-meta-ua-headers.txt

          if [ $META_UA_EXIT -ne 0 ]; then
            echo ""
            echo "WARNING: The request with Meta's user agent failed"
            echo "at the network level. This does not fail the job,"
            echo "since it is not a fully reliable simulation of"
            echo "Meta's real infrastructure, but it is a strong"
            echo "signal that Cloudflare may be blocking Meta's"
            echo "crawler on this domain. Check Cloudflare's Bot"
            echo "Fight Mode / WAF settings for this zone if"
            echo "Facebook posts keep failing."
          else
            META_STATUS=$(grep "HTTP_STATUS:" /tmp/r2-meta-ua-headers.txt | cut -d: -f2)
            if [ "$META_STATUS" -ge 400 ] 2>/dev/null; then
              echo ""
              echo "WARNING: Request with Meta's user agent returned"
              echo "HTTP $META_STATUS while the normal client request"
              echo "succeeded. This strongly suggests Cloudflare is"
              echo "blocking or challenging Meta's crawler on this"
              echo "domain. Check Bot Fight Mode / WAF / hotlink"
              echo "protection settings."
            else
              echo ""
              echo "Meta user-agent HEAD request looked fine"
              echo "(HTTP $META_STATUS)."
            fi
          fi

          echo ""
          echo "========================================"
          echo "R2 ACCESSIBILITY TEST PASSED"
          echo "========================================"

          echo ""
          echo "The exact URL sent to Buffer supports:"
          echo "- HEAD"
          echo "- GET"
          echo "- byte-range GET (206 + Content-Range)"
          echo ""
          echo "Any remaining Facebook rejection is more likely to"
          echo "be Meta-side (rate limiting, format validation, or"
          echo "bot blocking) rather than an R2 delivery problem."


      # ============================================================
      # 9. CREATE AND AUTO-PUBLISH BUFFER POSTS
      #
      # Each channel is attempted independently: a failure on one
      # channel is recorded, the others are still tried, the status
      # outputs are always written, and the step fails at the very
      # end if any channel failed (so the run still shows red).
      #
      # Posts use saveToDraft: false, so Buffer schedules them and
      # auto-publishes at each channel's next queue slot.
      #
      # SAFETY NOTE: every interpolated GraphQL value goes through
      # json.dumps(). Keep it that way for any new field.
      # ============================================================

      - name: Create and auto-publish Buffer posts
        id: buffer

        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          SURAH: ${{ steps.meta.outputs.surah }}

          AYAH_TEXT: ${{ steps.meta.outputs.ayah_text }}

          CYCLE: ${{ steps.meta.outputs.cycle }}

          CAPTION: ${{ steps.meta.outputs.caption }}
          VIDEO_DURATION_SECONDS: ${{ steps.meta.outputs.duration_seconds }}
          FACEBOOK_COMPATIBLE: ${{ steps.meta.outputs.facebook_compatible }}
          YOUTUBE_COMPATIBLE: ${{ steps.meta.outputs.youtube_compatible }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import time

          import requests


          # ========================================================
          # CONFIG
          # ========================================================

          API = "https://api.buffer.com"

          API_KEY = (
              os.environ.get(
                  "BUFFER_API_KEY",
                  ""
              ).strip()
          )

          VIDEO_URL = (
              os.environ.get(
                  "BUFFER_VIDEO_URL",
                  ""
              ).strip()
          )

          CAPTION = os.environ.get(
              "CAPTION",
              ""
          )

          try:
              VIDEO_DURATION_SECONDS = float(
                  os.environ["VIDEO_DURATION_SECONDS"]
              )
          except (KeyError, ValueError):
              raise SystemExit(
                  "ERROR: VIDEO_DURATION_SECONDS is missing or invalid."
              )

          FACEBOOK_REELS_HARD_MAX_SECONDS = 90.0
          FACEBOOK_REELS_SAFE_MAX_SECONDS = 88.0

          # YouTube Shorts hard limit is 60s; 58s is used as a safety
          # margin, same pattern as Facebook above.
          YOUTUBE_SHORTS_HARD_MAX_SECONDS = 60.0
          YOUTUBE_SHORTS_SAFE_MAX_SECONDS = 58.0

          FACEBOOK_COMPATIBLE = (
              os.environ.get("FACEBOOK_COMPATIBLE", "false")
              .strip()
              .lower()
              == "true"
          )

          YOUTUBE_COMPATIBLE = (
              os.environ.get("YOUTUBE_COMPATIBLE", "false")
              .strip()
              .lower()
              == "true"
          )

          # Never send a borderline or over-limit video to Facebook.
          if VIDEO_DURATION_SECONDS > FACEBOOK_REELS_SAFE_MAX_SECONDS:
              FACEBOOK_COMPATIBLE = False

          # Never send a borderline or over-limit video to YouTube Shorts.
          if VIDEO_DURATION_SECONDS > YOUTUBE_SHORTS_SAFE_MAX_SECONDS:
              YOUTUBE_COMPATIBLE = False

          print(f"Video duration: {VIDEO_DURATION_SECONDS:.2f}s")
          print(
              "Facebook compatible: "
              + ("YES" if FACEBOOK_COMPATIBLE else "NO")
          )
          print(
              "YouTube Shorts compatible: "
              + ("YES" if YOUTUBE_COMPATIBLE else "NO")
          )

          # Facebook-specific retry settings.
          FACEBOOK_MAX_ATTEMPTS = 3
          FACEBOOK_RETRY_DELAY_SECONDS = 20

          # Errors from Buffer that are worth retrying automatically.
          RETRYABLE_MESSAGE_FRAGMENTS = (
              "could not be read from its url",
              "timeout",
              "timed out",
          )


          # ========================================================
          # VALIDATION
          # (these are global problems — nothing can be sent — so
          #  they still stop the whole step immediately)
          # ========================================================

          if not API_KEY:
              raise SystemExit(
                  "ERROR: BUFFER_API_KEY is empty."
              )

          if not VIDEO_URL:
              raise SystemExit(
                  "ERROR: BUFFER_VIDEO_URL is empty."
              )

          if not VIDEO_URL.startswith(
              "https://"
          ):
              raise SystemExit(
                  "ERROR: Buffer video URL must be HTTPS."
              )


          # ========================================================
          # HEADERS
          # ========================================================

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {API_KEY}",
          }


          # ========================================================
          # 1. GET ACCOUNT + ORGANIZATION
          # ========================================================

          account_query = """
          query GetAccount {
            account {
              id
              organizations {
                id
                name
              }
            }
          }
          """

          print("")
          print("========================================")
          print("BUFFER AUTHENTICATION")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": account_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer authentication failed."
              )

          account_data = response.json()

          if account_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer account query failed:\n"
                  + json.dumps(
                      account_data["errors"],
                      indent=2,
                  )
              )

          account = (
              account_data
              .get("data", {})
              .get("account")
          )

          if not account:

              raise SystemExit(
                  "ERROR: Buffer returned no account."
              )

          organizations = (
              account.get(
                  "organizations"
              )
              or []
          )

          if not organizations:

              raise SystemExit(
                  "ERROR: No Buffer organizations "
                  "are available for this API key."
              )

          print(
              f"Found {len(organizations)} "
              "Buffer organization(s)."
          )

          for organization in organizations:

              print(
                  f"- {organization.get('name')} "
                  f"({organization.get('id')})"
              )


          # ========================================================
          # SELECT ORGANIZATION
          #
          # If Buffer ever returns multiple organizations, stop
          # instead of guessing which one should receive the posts.
          # ========================================================

          if len(organizations) != 1:

              raise SystemExit(
                  "ERROR: Buffer returned "
                  f"{len(organizations)} organizations. "
                  "Multiple organizations require explicit "
                  "selection instead of guessing."
              )

          organization = organizations[0]

          organization_id = organization[
              "id"
          ]

          print("")
          print(
              f"Using Buffer organization: "
              f"{organization.get('name')}"
          )

          print(
              f"Organization ID: "
              f"{organization_id}"
          )


          # ========================================================
          # 2. GET CHANNELS
          # ========================================================

          channel_query = f"""
          query GetChannels {{
            channels(
              input: {{
                organizationId: {json.dumps(organization_id)}
              }}
            ) {{
              id
              name
              displayName
              service
              isQueuePaused
              isDisconnected
              isLocked
            }}
          }}
          """

          print("")
          print("========================================")
          print("BUFFER CHANNEL DISCOVERY")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": channel_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer channel request failed."
              )

          channel_data = response.json()

          if channel_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer channel query failed:\n"
                  + json.dumps(
                      channel_data["errors"],
                      indent=2,
                  )
              )

          channels = (
              channel_data
              .get("data", {})
              .get("channels", [])
          )

          if not channels:

              raise SystemExit(
                  "ERROR: Buffer returned zero channels."
              )

          print(
              f"Found {len(channels)} Buffer channel(s)."
          )


          # ========================================================
          # FIND TARGET CHANNELS
          # ========================================================

          instagram = None
          facebook = None
          youtube = None

          for channel in channels:

              service = (
                  channel.get(
                      "service"
                  )
                  or ""
              ).lower()

              display_name = (
                  channel.get(
                      "displayName"
                  )
                  or channel.get(
                      "name"
                  )
                  or channel.get(
                      "id"
                  )
              )

              print(
                  f"- {display_name} "
                  f"[{service}] "
                  f"id={channel.get('id')}"
              )

              if channel.get(
                  "isDisconnected"
              ):

                  print(
                      "  WARNING: channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):

                  print(
                      "  WARNING: channel is locked."
                  )

              if service == "instagram":

                  instagram = channel

              elif service == "facebook":

                  facebook = channel

              elif service == "youtube":

                  youtube = channel


          # ========================================================
          # BUILD DRAFT MUTATION
          # ========================================================

          def build_mutation(
              channel_id,
              label,
          ):

              if label == "Instagram":

                  metadata_graphql = """
                  metadata: {
                    instagram: {
                      type: reel
                      shouldShareToFeed: true
                    }
                  }
                  """

              elif label == "Facebook":

                  metadata_graphql = """
                  metadata: {
                    facebook: {
                      type: reel
                    }
                  }
                  """

              elif label == "YouTube":

                  youtube_title = (
                      os.environ.get(
                          "SURAH"
                      )
                      or "Quran Reminder"
                  )

                  metadata_graphql = f"""
                  metadata: {{
                    youtube: {{
                      categoryId: "27"
                      title: {json.dumps(
                          youtube_title
                      )}
                      privacy: public
                      madeForKids: false
                      notifySubscribers: false
                      embeddable: true
                    }}
                  }}
                  """

              else:

                  raise SystemExit(
                      f"Unsupported Buffer service: {label}"
                  )

              return f"""
              mutation CreateDraft {{
                createPost(
                  input: {{
                    text: {json.dumps(CAPTION)}

                    channelId: {json.dumps(
                        channel_id
                    )}

                    schedulingType: automatic

                    mode: addToQueue

                    saveToDraft: false

                    assets: [
                      {{
                        video: {{
                          url: {json.dumps(
                              VIDEO_URL
                          )}
                        }}
                      }}
                    ]

                    {metadata_graphql}
                  }}
                ) {{
                  ... on PostActionSuccess {{
                    post {{
                      id
                      text
                      status
                      channelId
                    }}
                  }}

                  ... on MutationError {{
                    message
                  }}
                }}
              }}
              """


          # ========================================================
          # SINGLE ATTEMPT AT CREATING A POST
          #
          # Returns (success, post_dict_or_error_message).
          # ========================================================

          def attempt_create_draft(
              channel_id,
              label,
          ):

              mutation = build_mutation(
                  channel_id,
                  label,
              )

              result = requests.post(
                  API,
                  headers=headers,
                  json={
                      "query": mutation
                  },
                  timeout=60,
              )

              print(
                  f"Buffer HTTP status: "
                  f"{result.status_code}"
              )

              if result.status_code != 200:

                  print(
                      result.text
                  )

                  return (
                      False,
                      f"Buffer HTTP request failed "
                      f"({result.status_code}).",
                  )

              payload = result.json()

              if payload.get(
                  "errors"
              ):

                  return (
                      False,
                      "Buffer GraphQL error:\n"
                      + json.dumps(
                          payload["errors"],
                          indent=2,
                      ),
                  )

              create_result = (
                  payload
                  .get("data", {})
                  .get("createPost")
              )

              if not create_result:

                  return (
                      False,
                      "Buffer returned no createPost result.",
                  )

              if create_result.get(
                  "message"
              ):

                  return (
                      False,
                      create_result["message"],
                  )

              post = (
                  create_result.get(
                      "post"
                  )
              )

              if not post:

                  return (
                      False,
                      "Buffer did not return a post object.",
                  )

              print("")
              print(
                  f"{label} POST SCHEDULED (auto-publish)"
              )

              print(
                  f"Post ID: "
                  f"{post.get('id')}"
              )

              print(
                  f"Status: "
                  f"{post.get('status')}"
              )

              print(
                  f"Channel ID: "
                  f"{post.get('channelId')}"
              )

              return (True, post)


          # ========================================================
          # CREATE POST WITH RETRY
          #
          # Returns the Buffer post dict on success, or None if the
          # channel was not found. Raises SystemExit on a hard
          # failure (caught per-channel by safe_create below).
          # ========================================================

          def create_draft(
              channel,
              label,
              max_attempts=1,
              retry_delay_seconds=0,
          ):

              if not channel:

                  print(
                      f"{label} channel not found; "
                      "skipping."
                  )

                  return None

              if channel.get(
                  "isDisconnected"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is locked."
                  )

              channel_id = channel[
                  "id"
              ]

              last_error = None

              for attempt in range(
                  1,
                  max_attempts + 1,
              ):

                  print("")
                  print(
                      "----------------------------------------"
                  )

                  print(
                      f"Creating {label} post "
                      f"(attempt {attempt}/{max_attempts})..."
                  )

                  print(
                      f"Buffer channel ID: {channel_id}"
                  )

                  success, result = attempt_create_draft(
                      channel_id,
                      label,
                  )

                  if success:
                      return result

                  last_error = result

                  is_retryable = (
                      last_error is not None
                      and any(
                          fragment in last_error.lower()
                          for fragment in RETRYABLE_MESSAGE_FRAGMENTS
                      )
                  )

                  print("")
                  print(
                      f"{label} post attempt {attempt} failed:"
                  )
                  print(
                      last_error
                  )

                  if (
                      is_retryable
                      and attempt < max_attempts
                  ):

                      print("")
                      print(
                          "This looks like a transient error "
                          "(URL fetch / timeout). Waiting "
                          f"{retry_delay_seconds}s before "
                          "retrying..."
                      )

                      time.sleep(
                          retry_delay_seconds
                      )

                      continue

                  # Not retryable, or out of attempts: stop here.
                  break

              hint = ""

              if (
                  last_error
                  and "could not be read from its url"
                  in last_error.lower()
              ):

                  hint = (
                      "\n\nThis error persisted across "
                      f"{max_attempts} attempt(s). Since the "
                      "R2 accessibility test earlier in this "
                      "run already confirmed HEAD, GET, and "
                      "byte-range access to the exact same URL, "
                      "the remaining likely causes are: "
                      "(1) Facebook/Meta rate limiting from "
                      "repeated runs \u2014 space out runs or wait "
                      "up to 24h, "
                      "(2) Cloudflare blocking Meta's crawler "
                      "specifically (check Bot Fight Mode / WAF "
                      "on the r2.dev zone), or "
                      "(3) the video not meeting Facebook Reels "
                      "format requirements (H.264/AAC, faststart "
                      "moov atom, 3-90s duration, 9:16 aspect "
                      "ratio)."
                  )

              raise SystemExit(
                  f"ERROR: Buffer rejected {label} after "
                  f"{max_attempts} attempt(s):\n"
                  f"{last_error}"
                  f"{hint}"
              )


          # ========================================================
          # PER-CHANNEL ISOLATION
          #
          # Wraps create_draft so one channel failing does not stop
          # the others from being tried. Failures are recorded and
          # the step fails at the very end.
          # ========================================================

          failures = {}

          def safe_create(
              channel,
              label,
              **kwargs,
          ):

              try:

                  return create_draft(
                      channel,
                      label,
                      **kwargs,
                  )

              except SystemExit as exc:

                  message = str(
                      exc.code
                  )

                  print("")
                  print(
                      f"{label} FAILED (continuing with "
                      "remaining channels):"
                  )
                  print(
                      message
                  )

                  failures[label] = message

                  return None


          # ========================================================
          # INSTAGRAM
          # ========================================================

          published = {}

          published["Instagram"] = safe_create(
              instagram,
              "Instagram",
          )


          # ========================================================
          # FACEBOOK
          #
          # 90s hard limit, 88s safety threshold. A long complete
          # Quran ayah is preserved and Facebook is skipped rather
          # than cutting the ayah.
          # ========================================================

          if FACEBOOK_COMPATIBLE:
              published["Facebook"] = safe_create(
                  facebook,
                  "Facebook",
                  max_attempts=FACEBOOK_MAX_ATTEMPTS,
                  retry_delay_seconds=FACEBOOK_RETRY_DELAY_SECONDS,
              )
          else:
              print("")
              print("Facebook skipped safely.")
              print(
                  f"Video is {VIDEO_DURATION_SECONDS:.2f}s; "
                  "Facebook safety limit is "
                  f"{FACEBOOK_REELS_SAFE_MAX_SECONDS:.0f}s."
              )
              print(
                  "The complete Quran video is preserved; "
                  "it will not be cut just to fit Facebook."
              )
              published["Facebook"] = None


          # ========================================================
          # YOUTUBE
          #
          # 60s Shorts limit, 58s safety threshold. Skipped rather
          # than cutting the ayah.
          # ========================================================

          if YOUTUBE_COMPATIBLE:
              published["YouTube"] = safe_create(
                  youtube,
                  "YouTube",
              )
          else:
              print("")
              print("YouTube skipped safely.")
              print(
                  f"Video is {VIDEO_DURATION_SECONDS:.2f}s; "
                  "YouTube Shorts safety limit is "
                  f"{YOUTUBE_SHORTS_SAFE_MAX_SECONDS:.0f}s."
              )
              print(
                  "The complete Quran video is preserved; "
                  "it will not be cut just to fit YouTube Shorts."
              )
              published["YouTube"] = None


          # ========================================================
          # WRITE STATUS OUTPUTS (always, even if a channel failed)
          # ========================================================

          summary_path = os.environ.get("GITHUB_OUTPUT")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  for label, post in published.items():
                      status = "not attempted / skipped"
                      post_id = ""
                      if label in failures:
                          status = "FAILED"
                      elif post:
                          status = post.get("status", "scheduled")
                          post_id = post.get("id", "")
                      fh.write(f"{label.lower()}_status={status}\n")
                      fh.write(f"{label.lower()}_post_id={post_id}\n")


          # ========================================================
          # FINAL RESULT
          # ========================================================

          print("")

          if failures:

              print("========================================")
              print("BUFFER AUTO-PUBLISH: PARTIAL FAILURE")
              print("========================================")

              for label, message in failures.items():
                  print(f"- {label}: {message.splitlines()[0]}")

              raise SystemExit(
                  "ERROR: One or more Buffer channels failed: "
                  + ", ".join(failures.keys())
                  + ". Other eligible channels were still sent. "
                  "The video itself is safe (workflow artifact, "
                  "GitHub Release and R2). Do NOT re-run the whole "
                  "workflow blindly — channels that already "
                  "succeeded would be queued a second time."
              )

          print("========================================")
          print("BUFFER AUTO-PUBLISH PASSED")
          print("========================================")

          print("")
          print(
              "Eligible channels were sent to Buffer and scheduled for auto-publish."
          )

          print(
              "Nothing was automatically published by this script — "
              "Buffer publishes each post at the channel's next queue slot."
          )

          PY


      # ============================================================
      # 10. RUN SUMMARY
      #
      # Values are passed through env vars and printed with printf,
      # NOT pasted into the shell script, so a quote, backtick or
      # $(...) in a caption can't break or execute anything.
      # ============================================================

      - name: Run summary
        if: always()
        env:
          S_SURAH: ${{ steps.meta.outputs.surah }}
          S_AYAH: ${{ steps.meta.outputs.ayah_text }}
          S_CYCLE: ${{ steps.meta.outputs.cycle }}
          S_DURATION: ${{ steps.meta.outputs.duration_seconds }}
          S_FB_OK: ${{ steps.meta.outputs.facebook_compatible }}
          S_YT_OK: ${{ steps.meta.outputs.youtube_compatible }}
          S_R2_URL: ${{ steps.r2.outputs.video_url }}
          S_R2_DELETED: ${{ steps.r2.outputs.r2_deleted_count }}
          S_IG_STATUS: ${{ steps.buffer.outputs.instagram_status }}
          S_IG_ID: ${{ steps.buffer.outputs.instagram_post_id }}
          S_FB_STATUS: ${{ steps.buffer.outputs.facebook_status }}
          S_FB_ID: ${{ steps.buffer.outputs.facebook_post_id }}
          S_YT_STATUS: ${{ steps.buffer.outputs.youtube_status }}
          S_YT_ID: ${{ steps.buffer.outputs.youtube_post_id }}
          S_CAPTION: ${{ steps.meta.outputs.caption }}
          S_ARTIFACT: quran-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "## Quran Production Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            printf '| Surah | %s |\n' "$S_SURAH"
            printf '| Ayah(s) | %s |\n' "$S_AYAH"
            printf '| Cycle | %s |\n' "$S_CYCLE"
            printf '| Duration (s) | %s |\n' "$S_DURATION"
            printf '| Facebook-compatible (<=88s) | %s |\n' "$S_FB_OK"
            printf '| YouTube Shorts-compatible (<=58s) | %s |\n' "$S_YT_OK"
            printf '| R2 video URL | %s |\n' "$S_R2_URL"
            printf '| R2 old MP4s deleted this run | %s |\n' "$S_R2_DELETED"
            printf '| Backup artifact (14 days) | %s |\n' "$S_ARTIFACT"
            echo ""
            echo "### Buffer channel status"
            echo ""
            echo "| Channel | Status | Post ID |"
            echo "|---|---|---|"
            printf '| Instagram | %s | %s |\n' "$S_IG_STATUS" "$S_IG_ID"
            printf '| Facebook | %s | %s |\n' "$S_FB_STATUS" "$S_FB_ID"
            printf '| YouTube | %s | %s |\n' "$S_YT_STATUS" "$S_YT_ID"
            echo ""
            echo "_Caption used for this run:_"
            echo ""
            echo '```'
            printf '%s\n' "$S_CAPTION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 11. CLEAN UP OLD WORKFLOW RUNS
      #
      # Keeps only the newest KEEP_RUNS runs of THIS workflow in the
      # Actions tab; older completed runs are deleted (their logs and
      # workflow artifacts go with them). Runs of other workflows
      # (e.g. "Authentication Test") are never touched.
      #
      # Safety: never deletes the current run or any run that is not
      # "completed", and MAX_DELETES_PER_RUN caps one-off bulk deletes.
      # Non-blocking and always runs last, so it can't affect publishing.
      # ============================================================

      - name: Clean up old workflow runs
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}

        run: |
          python3 - <<'PY'
          import os
          import requests

          TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          CURRENT_RUN_ID = int(os.environ["CURRENT_RUN_ID"])

          KEEP_RUNS = 12
          MAX_DELETES_PER_RUN = 100

          API = f"https://api.github.com/repos/{REPO}"
          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
          }

          # Find this workflow's id from the current run.
          cur = requests.get(
              f"{API}/actions/runs/{CURRENT_RUN_ID}",
              headers=headers,
              timeout=30,
          )
          cur.raise_for_status()
          workflow_id = cur.json()["workflow_id"]

          runs = []
          page = 1
          while True:
              resp = requests.get(
                  f"{API}/actions/workflows/{workflow_id}/runs",
                  headers=headers,
                  params={"per_page": 100, "page": page},
                  timeout=30,
              )
              resp.raise_for_status()
              batch = resp.json().get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              page += 1

          # Newest first.
          runs.sort(key=lambda r: r["created_at"], reverse=True)

          print("========================================")
          print("WORKFLOW RUN CLEANUP")
          print("========================================")
          print(f"Runs found for this workflow: {len(runs)}")
          print(f"Keeping newest: {KEEP_RUNS}")

          to_delete = [
              r for r in runs[KEEP_RUNS:]
              if r["id"] != CURRENT_RUN_ID
              and r.get("status") == "completed"
          ]

          print(f"Eligible to delete: {len(to_delete)}")

          deleted = 0
          for run in to_delete:
              if deleted >= MAX_DELETES_PER_RUN:
                  print(
                      f"STOPPING: reached MAX_DELETES_PER_RUN "
                      f"({MAX_DELETES_PER_RUN}); the rest will be "
                      "removed on the next run."
                  )
                  break

              r = requests.delete(
                  f"{API}/actions/runs/{run['id']}",
                  headers=headers,
                  timeout=30,
              )
              if r.status_code in (204, 200):
                  deleted += 1
                  print(f"Deleted run #{run['run_number']} ({run['created_at']})")
              else:
                  print(
                      f"WARNING: could not delete run {run['id']}: "
                      f"{r.status_code} {r.text}"
                  )

          print("")
          print(f"Deleted {deleted} old workflow run(s).")
          PY
