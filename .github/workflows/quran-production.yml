name: Quran Production Pipeline

# ================================================================
# QURAN PRODUCTION PIPELINE
#
# Flow:
#
# GitHub Actions (daily 08:00 UTC, automatic)
#       ↓
# Quran Worker
#       ↓
# Render + QA
#       ↓
# GitHub Release backup
#       ↓
# Cloudflare R2
#       ↓
# R2 accessibility verification (incl. Meta crawler simulation)
#       ↓
# Buffer
#       ↓
# Instagram / Facebook / YouTube — AUTO-PUBLISHED
# (queued via Buffer, published automatically at each channel's
#  next scheduled slot; Facebook gets a retry on transient errors)
#
# Make.com is NOT used.
#
# Automatic daily trigger:
#   schedule (cron)   <-- NEW: this is what makes the whole thing
#                          run on its own every day, no manual click
#                          needed.
#
# Manual testing:
#   workflow_dispatch
#
# External triggering later:
#   repository_dispatch
#
# NOTE on schedule timing:
#   GitHub Actions cron runs in UTC and is best-effort, not exact —
#   under platform load it can fire 10-20+ minutes late. It also
#   auto-disables if this repo goes 60 days with zero commit
#   activity, so keep COMMIT_PROGRESS/GIT_PUSH_PROGRESS enabled
#   (they already are, below) so every run itself counts as activity.
# ================================================================

on:
  schedule:
    # 08:00 UTC every day. Adjust the hour here if you want the post
    # to land at 8am in a specific timezone instead of UTC.
    - cron: "0 8 * * *"

  workflow_dispatch: {}

  repository_dispatch:
    types:
      - produce-quran-section

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:

  production:

    runs-on: ubuntu-latest

    environment: Quran API

    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      #
      # NOTE on Arabic fonts:
      #   Package availability for Arabic-script fonts (fonts-amiri,
      #   fonts-sil-scheherazade, fonts-noto-naskh-arabic) can vary
      #   between apt mirrors/pockets on a given runner image, and a
      #   single unresolved package name makes `apt-get install` fail
      #   ATOMICALLY for every package listed alongside it — even ones
      #   that were perfectly installable. So the core, always-required
      #   packages are installed in one atomic call, and each Arabic
      #   font candidate is installed independently so a missing name
      #   can't take down the ones that ARE available.
      #
      #   TypographyEngine.find_font() in quran_worker.py already
      #   searches Amiri -> Scheherazade -> Noto Naskh Arabic and picks
      #   whichever is present, so this only needs to guarantee that at
      #   least one candidate lands — checked explicitly below so a
      #   fully-missing-font situation fails loudly here, in CI, instead
      #   of surfacing later as a cryptic renderer crash.
      # ============================================================

      - name: Install rendering and storage dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-extra

          for pkg in fonts-amiri fonts-sil-scheherazade fonts-noto-naskh-arabic; do
            sudo apt-get install -y "$pkg" \
              || echo "WARNING: apt package '$pkg' unavailable on this mirror, skipping."
          done

          sudo fc-cache -f

          if ! fc-list | grep -qiE "amiri|scheherazade|noto naskh arabic"; then
            echo "ERROR: No Arabic-script font installed (Amiri / Scheherazade / Noto Naskh Arabic all missing)."
            exit 1
          fi

          python3 -m pip install --quiet \
            requests \
            pillow \
            boto3


      # ============================================================
      # 2.5. DIAGNOSTIC: confirm quran_worker.py actually exists
      #
      # Added after a run failed with "can't open file
      # .../production/quran_worker.py: No such file or directory".
      # Note: GitHub masks the literal string "production" in logs
      # because QF_ENV's value is "production", so that error showed
      # up as "***" instead of "production" — that's just log
      # redaction, not a clue about the real problem. This step
      # prints the actual repo layout and searches for the file by
      # name so a missing/misplaced/renamed script is obvious instead
      # of guessed at.
      # ============================================================

      - name: Confirm quran_worker.py exists
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Top-level contents:"
          ls -la

          echo ""
          echo "Searching whole repo for quran_worker.py:"
          find . -iname "quran_worker.py" -not -path "*/.git/*"

          echo ""
          if [ ! -f "production/quran_worker.py" ]; then
            echo "ERROR: production/quran_worker.py does not exist at the expected path."
            echo "See the 'find' output above for its actual location (if any),"
            echo "then either move it to production/quran_worker.py or update"
            echo "the 'Build and render next Quran section' step to match."
            exit 1
          fi

          echo "production/quran_worker.py found as expected."


      # ============================================================
      # 3. BUILD / RENDER / QA
      # ============================================================

      - name: Build and render next Quran section
        id: build

        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"

          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}

        run: |
          python3 production/quran_worker.py


      # ============================================================
      # 4. READ RUN RESULT
      # ============================================================

      - name: Read run result
        id: meta

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import random
          from pathlib import Path
          from datetime import datetime, timezone

          result_path = Path("run-result.json")

          if not result_path.exists():
              raise SystemExit(
                  "ERROR: run-result.json was not created."
              )

          with result_path.open(
              "r",
              encoding="utf-8",
          ) as fh:
              meta = json.load(fh)

          if meta.get("success") is False:
              raise SystemExit(
                  "ERROR: Quran worker reported failure:\n"
                  + json.dumps(
                      meta,
                      indent=2,
                      ensure_ascii=False,
                  )
              )

          output = meta.get("output")

          if not output:
              raise SystemExit(
                  "ERROR: run-result.json has no 'output' path."
              )

          video_path = Path(output)

          if not video_path.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {video_path}"
              )

          video_name = video_path.name

          tag_name = (
              "section-"
              + datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d-%H%M%S"
              )
          )

          surah = (
              meta.get("surah")
              or meta.get("surah_name")
              or ""
          )

          section = meta.get("section") or {}

          first_ayah = section.get("first_ayah")
          last_ayah = section.get("last_ayah")

          cycle = meta.get("cycle") or 1

          theme = meta.get("theme") or ""

          if not surah:
              match = re.search(
                  r"Surah-(.+?)-Chapter-\d+",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  surah = (
                      match.group(1)
                      .replace("-", " ")
                  )

          ayah_text = ""

          if (
              first_ayah is not None
              and last_ayah is not None
          ):
              if first_ayah == last_ayah:
                  ayah_text = (
                      f"Ayah {first_ayah}"
                  )
              else:
                  ayah_text = (
                      f"Ayahs {first_ayah}–{last_ayah}"
                  )
          else:
              match = re.search(
                  r"-(?:Ayah|Ayahs)-(\d+)(?:-to-(\d+))?",
                  video_name,
                  re.IGNORECASE,
              )

              if match:
                  first = match.group(1)
                  last = match.group(2)

                  if last:
                      ayah_text = (
                          f"Ayahs {first}–{last}"
                      )
                  else:
                      ayah_text = (
                          f"Ayah {first}"
                      )

          reference = (
              surah.strip()
              if surah.strip()
              else "Quran"
          )

          if ayah_text:
              reference += f" — {ayah_text}"

          # ==============================================================
          # ROTATING INTRO LINE
          #
          # Deterministic per (surah, cycle, ayah range) so re-running the
          # same section never changes the caption, but different sections
          # don't all read identically.
          # ==============================================================

          rng = random.Random(f"{surah}-{cycle}-{ayah_text}")

          intros = [
              "Listen, reflect, and let the words of the Quran reach your heart.",
              "A moment to pause and reflect on the words of Allah.",
              "Let these verses sit with you today.",
              "Words worth returning to, again and again.",
              "Take a moment to reflect on this reminder.",
              "A gentle reminder from the Quran, for your heart today.",
          ]

          caption_lines = [
              f"📖 {reference}",
              "",
          ]

          if theme.strip():
              caption_lines.extend([
                  theme.strip().capitalize(),
                  "",
              ])

          caption_lines.extend([
              rng.choice(intros),
              "",
              f"Quran Cycle {cycle}",
              "",
              "#Quran #Islam #QuranReminder "
              "#IslamicReminder #QuranVerses "
              "#IslamicContent",
          ])

          caption = "\n".join(caption_lines)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_path={output}\n"
              )

              fh.write(
                  f"video_name={video_name}\n"
              )

              fh.write(
                  f"tag_name={tag_name}\n"
              )

              fh.write(
                  "surah="
                  + surah.replace(
                      "\n",
                      " "
                  ).replace(
                      "\r",
                      " "
                  )
                  + "\n"
              )

              fh.write(
                  "ayah_text="
                  + ayah_text
                  + "\n"
              )

              fh.write(
                  f"cycle={cycle}\n"
              )

              fh.write(
                  "caption<<QURAN_CAPTION\n"
              )

              fh.write(
                  caption
                  + "\n"
              )

              fh.write(
                  "QURAN_CAPTION\n"
              )

          print("")
          print("========================================")
          print("SOCIAL CAPTION")
          print("========================================")
          print(caption)

          PY


      # ============================================================
      # 5. UPLOAD PRODUCTION ARTIFACT
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4

        with:
          name: quran-production-${{ steps.meta.outputs.tag_name }}

          path: publish/

          retention-days: 14


      # ============================================================
      # 6. GITHUB RELEASE
      # ============================================================

      - name: Publish finished video to GitHub Release
        id: release

        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}

          name: ${{ steps.meta.outputs.video_name }}

          body: |
            Automated Quran production section.

            Release contains:
            - finished MP4
            - Quran metadata JSON
            - synchronized SRT subtitles

            Social-media media is hosted on Cloudflare R2.

          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
            publish/*.srt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 7. CLOUDFLARE R2
      #
      # Maximum storage:
      #   9 GB
      #
      # When adding a new video would exceed 9 GB,
      # oldest MP4 files are deleted first.
      #
      # JSON/SRT files are preserved.
      # ============================================================

      - name: Upload video to Cloudflare R2
        id: r2

        env:
          R2_ENDPOINT: https://f628f290c08401d255823b7cfe41054c.r2.cloudflarestorage.com

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_BUCKET: quran-production-media

          R2_PUBLIC_BASE_URL: https://pub-4ac1cf8ee6a44509bb69a39b67ba92b0.r2.dev

          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}

          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import boto3
          import requests

          ENDPOINT = (
              os.environ["R2_ENDPOINT"]
              .strip()
              .rstrip("/")
          )

          ACCESS_KEY = (
              os.environ["R2_ACCESS_KEY_ID"]
              .strip()
          )

          SECRET_KEY = (
              os.environ["R2_SECRET_ACCESS_KEY"]
              .strip()
          )

          BUCKET = (
              os.environ["R2_BUCKET"]
              .strip()
          )

          PUBLIC_BASE = (
              os.environ["R2_PUBLIC_BASE_URL"]
              .strip()
              .rstrip("/")
          )

          VIDEO_PATH = Path(
              os.environ["VIDEO_PATH"]
          )

          VIDEO_NAME = os.environ[
              "VIDEO_NAME"
          ]

          if not ACCESS_KEY:
              raise SystemExit(
                  "ERROR: R2_ACCESS_KEY_ID is empty."
              )

          if not SECRET_KEY:
              raise SystemExit(
                  "ERROR: R2_SECRET_ACCESS_KEY is empty."
              )

          if not VIDEO_PATH.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {VIDEO_PATH}"
              )

          print("========================================")
          print("R2 CONFIGURATION")
          print("========================================")
          print(f"R2 endpoint: {ENDPOINT}")
          print(f"R2 bucket: {BUCKET}")
          print(f"Video: {VIDEO_NAME}")

          s3 = boto3.client(
              "s3",
              endpoint_url=ENDPOINT,
              aws_access_key_id=ACCESS_KEY,
              aws_secret_access_key=SECRET_KEY,
              region_name="auto",
          )

          print("Testing R2 connection...")

          s3.head_bucket(
              Bucket=BUCKET
          )

          print("R2 bucket connection successful.")

          MAX_STORAGE = (
              9 * 1024 * 1024 * 1024
          )

          new_size = VIDEO_PATH.stat().st_size

          objects = []

          paginator = s3.get_paginator(
              "list_objects_v2"
          )

          for page in paginator.paginate(
              Bucket=BUCKET
          ):
              objects.extend(
                  page.get(
                      "Contents",
                      []
                  )
              )

          current_size = sum(
              obj["Size"]
              for obj in objects
          )

          projected_size = (
              current_size
              + new_size
          )

          print("")
          print("========================================")
          print("R2 STORAGE CHECK")
          print("========================================")

          print(
              f"Current storage: "
              f"{current_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"New video: "
              f"{new_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Projected storage: "
              f"{projected_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Maximum: "
              f"{MAX_STORAGE / 1024 / 1024:.2f} MB"
          )

          if projected_size > MAX_STORAGE:

              print(
                  "9 GB limit would be exceeded."
              )

              print(
                  "Deleting oldest MP4 files..."
              )

              mp4_objects = [
                  obj
                  for obj in objects
                  if obj["Key"]
                  .lower()
                  .endswith(".mp4")
              ]

              mp4_objects.sort(
                  key=lambda obj:
                  obj["LastModified"]
              )

              for obj in mp4_objects:

                  if projected_size <= MAX_STORAGE:
                      break

                  key = obj["Key"]
                  size = obj["Size"]

                  print(
                      f"Deleting: {key}"
                  )

                  s3.delete_object(
                      Bucket=BUCKET,
                      Key=key,
                  )

                  projected_size -= size

              if projected_size > MAX_STORAGE:
                  raise SystemExit(
                      "ERROR: Could not reduce R2 "
                      "storage below 9 GB."
                  )

          print("")
          print("Uploading video to R2...")

          s3.upload_file(
              str(VIDEO_PATH),
              BUCKET,
              VIDEO_NAME,
              ExtraArgs={
                  "ContentType": "video/mp4"
              },
          )

          video_url = (
              f"{PUBLIC_BASE}/"
              f"{quote(VIDEO_NAME, safe='/')}"
          )

          print(
              f"Public URL: {video_url}"
          )

          print(
              "Verifying public URL..."
          )

          verify = requests.head(
              video_url,
              allow_redirects=True,
              timeout=30,
          )

          if verify.status_code >= 400:
              raise SystemExit(
                  "ERROR: Public R2 URL returned "
                  f"HTTP {verify.status_code}"
              )

          print(
              "Public R2 URL verification passed."
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:
              fh.write(
                  f"video_url={video_url}\n"
              )

          PY


      # ============================================================
      # 8. R2 VIDEO ACCESSIBILITY TEST
      #
      # This specifically tests the exact public URL that Buffer
      # receives, from multiple angles, WITHOUT re-downloading the
      # full video (it's already been uploaded to R2 and GitHub
      # Release earlier in this run):
      #
      #   1. HEAD                       (basic reachability)
      #   2. Byte-range GET (1MB)       (partial-content support,
      #                                  which Meta's video ingest
      #                                  relies on; also validates
      #                                  the file is a real MP4)
      #   3. HEAD as Meta's crawler     (facebookexternalhit UA,
      #                                  to catch Cloudflare bot
      #                                  protection blocking Meta
      #                                  specifically while normal
      #                                  clients pass)
      #
      # Any failure here fails the job BEFORE Buffer is called,
      # so you get a precise diagnosis instead of Buffer's generic
      # "Video could not be read from its URL" message.
      # ============================================================

      - name: Verify R2 video for Buffer
        env:
          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

        run: |
          set -e

          if [ -z "$BUFFER_VIDEO_URL" ]; then
            echo "ERROR: BUFFER_VIDEO_URL is empty."
            exit 1
          fi

          echo "========================================"
          echo "R2 BUFFER VIDEO ACCESS TEST"
          echo "========================================"

          echo ""
          echo "Video URL:"
          echo "$BUFFER_VIDEO_URL"

          echo ""
          echo "========================================"
          echo "1. HEAD REQUEST (default client)"
          echo "========================================"

          curl \
            -I \
            -L \
            --fail \
            --max-time 30 \
            "$BUFFER_VIDEO_URL"

          echo ""
          echo "HEAD request passed."

          echo ""
          echo "========================================"
          echo "2. BYTE-RANGE REQUEST"
          echo "========================================"
          echo "(This also stands in for a full-file GET test:"
          echo "a 1MB range is enough to confirm the object is a"
          echo "real, readable MP4 without re-downloading the"
          echo "entire video a second time after it was already"
          echo "uploaded to R2 and GitHub Release.)"

          rm -f /tmp/r2-range-headers.txt
          rm -f /tmp/r2-range-test.bin

          curl \
            -L \
            --fail \
            --range 0-1048575 \
            --dump-header /tmp/r2-range-headers.txt \
            --output /tmp/r2-range-test.bin \
            --max-time 60 \
            "$BUFFER_VIDEO_URL"

          echo ""
          echo "Range response headers:"
          cat /tmp/r2-range-headers.txt

          echo ""
          echo "Downloaded range:"
          ls -lh /tmp/r2-range-test.bin

          if [ ! -s /tmp/r2-range-test.bin ]; then
            echo "ERROR: Range GET returned an empty file."
            exit 1
          fi

          echo ""
          echo "File identification (from the first 1MB, which"
          echo "contains the MP4 header/ftyp box):"
          file /tmp/r2-range-test.bin

          if ! grep -qi "^HTTP/.* 206" /tmp/r2-range-headers.txt; then
            echo ""
            echo "ERROR: Server did not return 206 Partial Content"
            echo "for a byte-range request. It likely ignored the"
            echo "Range header and returned the full file instead."
            echo "This is a common root cause of Facebook's"
            echo "'Video could not be read from its URL' error,"
            echo "since Meta's ingest pipeline expects range support."
            exit 1
          fi

          if ! grep -qi "^Content-Range:" /tmp/r2-range-headers.txt; then
            echo ""
            echo "ERROR: Response is missing a Content-Range header"
            echo "on a ranged request. Byte-range support looks"
            echo "incomplete."
            exit 1
          fi

          echo ""
          echo "Byte-range support confirmed (206 + Content-Range)."

          echo ""
          echo "========================================"
          echo "3. HEAD REQUEST AS META'S CRAWLER"
          echo "========================================"
          echo "Simulating the facebookexternalhit user agent to"
          echo "check whether Cloudflare bot protection treats"
          echo "Meta's fetcher differently from a normal client."

          set +e

          curl \
            -I \
            -L \
            --max-time 30 \
            -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "$BUFFER_VIDEO_URL" \
            > /tmp/r2-meta-ua-headers.txt 2>&1

          META_UA_EXIT=$?

          set -e

          cat /tmp/r2-meta-ua-headers.txt

          if [ $META_UA_EXIT -ne 0 ]; then
            echo ""
            echo "WARNING: The request with Meta's user agent failed"
            echo "at the network level. This does not fail the job,"
            echo "since it is not a fully reliable simulation of"
            echo "Meta's real infrastructure, but it is a strong"
            echo "signal that Cloudflare may be blocking Meta's"
            echo "crawler on this domain. Check Cloudflare's Bot"
            echo "Fight Mode / WAF settings for this zone if"
            echo "Facebook posts keep failing."
          else
            META_STATUS=$(grep "HTTP_STATUS:" /tmp/r2-meta-ua-headers.txt | cut -d: -f2)
            if [ "$META_STATUS" -ge 400 ] 2>/dev/null; then
              echo ""
              echo "WARNING: Request with Meta's user agent returned"
              echo "HTTP $META_STATUS while the normal client request"
              echo "succeeded. This strongly suggests Cloudflare is"
              echo "blocking or challenging Meta's crawler on this"
              echo "domain. Check Bot Fight Mode / WAF / hotlink"
              echo "protection settings."
            else
              echo ""
              echo "Meta user-agent HEAD request looked fine"
              echo "(HTTP $META_STATUS)."
            fi
          fi

          echo ""
          echo "========================================"
          echo "R2 ACCESSIBILITY TEST PASSED"
          echo "========================================"

          echo ""
          echo "The exact URL sent to Buffer supports:"
          echo "- HEAD"
          echo "- GET"
          echo "- byte-range GET (206 + Content-Range)"
          echo ""
          echo "Any remaining Facebook rejection is more likely to"
          echo "be Meta-side (rate limiting, format validation, or"
          echo "bot blocking) rather than an R2 delivery problem."


      # ============================================================
      # 9. CREATE AND AUTO-PUBLISH BUFFER POSTS
      #
      # Buffer flow:
      #
      # API authentication
      #       ↓
      # account organizations
      #       ↓
      # channels
      #       ↓
      # Instagram / Facebook / YouTube
      #
      # Posts are created with saveToDraft: false, so Buffer moves
      # them straight to "Scheduled" and auto-publishes each one at
      # that channel's next queue slot (whatever posting times are
      # configured for the channel in Buffer). There is no manual
      # approval step.
      #
      # Facebook specifically gets retried with backoff, since its
      # "Video could not be read from its URL" error can be a
      # transient CDN-propagation or Meta-side hiccup even when the
      # R2 accessibility test above passes cleanly.
      # ============================================================

      - name: Create and auto-publish Buffer posts

        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          SURAH: ${{ steps.meta.outputs.surah }}

          AYAH_TEXT: ${{ steps.meta.outputs.ayah_text }}

          CYCLE: ${{ steps.meta.outputs.cycle }}

          CAPTION: ${{ steps.meta.outputs.caption }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import time

          import requests


          # ========================================================
          # CONFIG
          # ========================================================

          API = "https://api.buffer.com"

          API_KEY = (
              os.environ.get(
                  "BUFFER_API_KEY",
                  ""
              ).strip()
          )

          VIDEO_URL = (
              os.environ.get(
                  "BUFFER_VIDEO_URL",
                  ""
              ).strip()
          )

          CAPTION = os.environ.get(
              "CAPTION",
              ""
          )

          # Facebook-specific retry settings. "Video could not be
          # read from its URL" can be transient (CDN propagation,
          # brief Meta-side hiccup), so it is worth a few spaced-out
          # attempts before treating it as fatal.
          FACEBOOK_MAX_ATTEMPTS = 3
          FACEBOOK_RETRY_DELAY_SECONDS = 20

          # Errors from Buffer that are worth retrying automatically.
          # Anything else (auth, locked channel, bad channel id,
          # etc.) fails immediately instead of retrying blindly.
          RETRYABLE_MESSAGE_FRAGMENTS = (
              "could not be read from its url",
              "timeout",
              "timed out",
          )


          # ========================================================
          # VALIDATION
          # ========================================================

          if not API_KEY:
              raise SystemExit(
                  "ERROR: BUFFER_API_KEY is empty."
              )

          if not VIDEO_URL:
              raise SystemExit(
                  "ERROR: BUFFER_VIDEO_URL is empty."
              )

          if not VIDEO_URL.startswith(
              "https://"
          ):
              raise SystemExit(
                  "ERROR: Buffer video URL must be HTTPS."
              )


          # ========================================================
          # HEADERS
          # ========================================================

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {API_KEY}",
          }


          # ========================================================
          # 1. GET ACCOUNT + ORGANIZATION
          #
          # Organization is taken directly from Buffer.
          #
          # No hard-coded organization ID is used.
          # ========================================================

          account_query = """
          query GetAccount {
            account {
              id
              organizations {
                id
                name
              }
            }
          }
          """

          print("")
          print("========================================")
          print("BUFFER AUTHENTICATION")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": account_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer authentication failed."
              )

          account_data = response.json()

          if account_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer account query failed:\n"
                  + json.dumps(
                      account_data["errors"],
                      indent=2,
                  )
              )

          account = (
              account_data
              .get("data", {})
              .get("account")
          )

          if not account:

              raise SystemExit(
                  "ERROR: Buffer returned no account."
              )

          organizations = (
              account.get(
                  "organizations"
              )
              or []
          )

          if not organizations:

              raise SystemExit(
                  "ERROR: No Buffer organizations "
                  "are available for this API key."
              )

          print(
              f"Found {len(organizations)} "
              "Buffer organization(s)."
          )

          for organization in organizations:

              print(
                  f"- {organization.get('name')} "
                  f"({organization.get('id')})"
              )


          # ========================================================
          # SELECT ORGANIZATION
          #
          # There is currently one organization in the account.
          #
          # If Buffer ever returns multiple organizations, stop
          # instead of guessing which one should receive the posts.
          # ========================================================

          if len(organizations) != 1:

              raise SystemExit(
                  "ERROR: Buffer returned "
                  f"{len(organizations)} organizations. "
                  "Multiple organizations require explicit "
                  "selection instead of guessing."
              )

          organization = organizations[0]

          organization_id = organization[
              "id"
          ]

          print("")
          print(
              f"Using Buffer organization: "
              f"{organization.get('name')}"
          )

          print(
              f"Organization ID: "
              f"{organization_id}"
          )


          # ========================================================
          # 2. GET CHANNELS
          #
          # This is Buffer's documented channel query.
          # ========================================================

          channel_query = f"""
          query GetChannels {{
            channels(
              input: {{
                organizationId: "{organization_id}"
              }}
            ) {{
              id
              name
              displayName
              service
              isQueuePaused
              isDisconnected
              isLocked
            }}
          }}
          """

          print("")
          print("========================================")
          print("BUFFER CHANNEL DISCOVERY")
          print("========================================")

          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": channel_query
              },
              timeout=30,
          )

          print(
              f"Buffer HTTP status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:

              print(
                  response.text
              )

              raise SystemExit(
                  "ERROR: Buffer channel request failed."
              )

          channel_data = response.json()

          if channel_data.get("errors"):

              raise SystemExit(
                  "ERROR: Buffer channel query failed:\n"
                  + json.dumps(
                      channel_data["errors"],
                      indent=2,
                  )
              )

          channels = (
              channel_data
              .get("data", {})
              .get("channels", [])
          )

          if not channels:

              raise SystemExit(
                  "ERROR: Buffer returned zero channels."
              )

          print(
              f"Found {len(channels)} Buffer channel(s)."
          )


          # ========================================================
          # FIND TARGET CHANNELS
          # ========================================================

          instagram = None
          facebook = None
          youtube = None

          for channel in channels:

              service = (
                  channel.get(
                      "service"
                  )
                  or ""
              ).lower()

              display_name = (
                  channel.get(
                      "displayName"
                  )
                  or channel.get(
                      "name"
                  )
                  or channel.get(
                      "id"
                  )
              )

              print(
                  f"- {display_name} "
                  f"[{service}] "
                  f"id={channel.get('id')}"
              )

              if channel.get(
                  "isDisconnected"
              ):

                  print(
                      "  WARNING: channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):

                  print(
                      "  WARNING: channel is locked."
                  )

              if service == "instagram":

                  instagram = channel

              elif service == "facebook":

                  facebook = channel

              elif service == "youtube":

                  youtube = channel


          # ========================================================
          # BUILD DRAFT MUTATION
          # ========================================================

          def build_mutation(
              channel_id,
              label,
          ):

              if label == "Instagram":

                  metadata_graphql = """
                  metadata: {
                    instagram: {
                      type: reel
                      shouldShareToFeed: true
                    }
                  }
                  """

              elif label == "Facebook":

                  metadata_graphql = """
                  metadata: {
                    facebook: {
                      type: reel
                    }
                  }
                  """

              elif label == "YouTube":

                  youtube_title = (
                      os.environ.get(
                          "SURAH"
                      )
                      or "Quran Reminder"
                  )

                  metadata_graphql = f"""
                  metadata: {{
                    youtube: {{
                      categoryId: "27"
                      title: {json.dumps(
                          youtube_title
                      )}
                      privacy: private
                      madeForKids: false
                      notifySubscribers: false
                      embeddable: true
                    }}
                  }}
                  """

              else:

                  raise SystemExit(
                      f"Unsupported Buffer service: {label}"
                  )

              return f"""
              mutation CreateDraft {{
                createPost(
                  input: {{
                    text: {json.dumps(CAPTION)}

                    channelId: {json.dumps(
                        channel_id
                    )}

                    schedulingType: automatic

                    mode: addToQueue

                    saveToDraft: false

                    assets: [
                      {{
                        video: {{
                          url: {json.dumps(
                              VIDEO_URL
                          )}
                        }}
                      }}
                    ]

                    {metadata_graphql}
                  }}
                ) {{
                  ... on PostActionSuccess {{
                    post {{
                      id
                      text
                      status
                      channelId
                    }}
                  }}

                  ... on MutationError {{
                    message
                  }}
                }}
              }}
              """


          # ========================================================
          # SINGLE ATTEMPT AT CREATING A DRAFT
          #
          # Returns (success, error_message_or_none).
          # ========================================================

          def attempt_create_draft(
              channel_id,
              label,
          ):

              mutation = build_mutation(
                  channel_id,
                  label,
              )

              result = requests.post(
                  API,
                  headers=headers,
                  json={
                      "query": mutation
                  },
                  timeout=60,
              )

              print(
                  f"Buffer HTTP status: "
                  f"{result.status_code}"
              )

              if result.status_code != 200:

                  print(
                      result.text
                  )

                  return (
                      False,
                      f"Buffer HTTP request failed "
                      f"({result.status_code}).",
                  )

              payload = result.json()

              if payload.get(
                  "errors"
              ):

                  return (
                      False,
                      "Buffer GraphQL error:\n"
                      + json.dumps(
                          payload["errors"],
                          indent=2,
                      ),
                  )

              create_result = (
                  payload
                  .get("data", {})
                  .get("createPost")
              )

              if not create_result:

                  return (
                      False,
                      "Buffer returned no createPost result.",
                  )

              if create_result.get(
                  "message"
              ):

                  return (
                      False,
                      create_result["message"],
                  )

              post = (
                  create_result.get(
                      "post"
                  )
              )

              if not post:

                  return (
                      False,
                      "Buffer did not return a post object.",
                  )

              print("")
              print(
                  f"{label} POST SCHEDULED (auto-publish)"
              )

              print(
                  f"Post ID: "
                  f"{post.get('id')}"
              )

              print(
                  f"Status: "
                  f"{post.get('status')}"
              )

              print(
                  f"Channel ID: "
                  f"{post.get('channelId')}"
              )

              return (True, None)


          # ========================================================
          # CREATE DRAFT WITH RETRY (Facebook only, by default)
          # ========================================================

          def create_draft(
              channel,
              label,
              max_attempts=1,
              retry_delay_seconds=0,
          ):

              if not channel:

                  print(
                      f"{label} channel not found; "
                      "skipping."
                  )

                  return

              if channel.get(
                  "isDisconnected"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is disconnected."
                  )

              if channel.get(
                  "isLocked"
              ):

                  raise SystemExit(
                      f"ERROR: {label} channel is locked."
                  )

              channel_id = channel[
                  "id"
              ]

              last_error = None

              for attempt in range(
                  1,
                  max_attempts + 1,
              ):

                  print("")
                  print(
                      "----------------------------------------"
                  )

                  print(
                      f"Creating {label} post "
                      f"(attempt {attempt}/{max_attempts})..."
                  )

                  print(
                      f"Buffer channel ID: {channel_id}"
                  )

                  success, error_message = attempt_create_draft(
                      channel_id,
                      label,
                  )

                  if success:
                      return

                  last_error = error_message

                  is_retryable = (
                      error_message is not None
                      and any(
                          fragment in error_message.lower()
                          for fragment in RETRYABLE_MESSAGE_FRAGMENTS
                      )
                  )

                  print("")
                  print(
                      f"{label} post attempt {attempt} failed:"
                  )
                  print(
                      error_message
                  )

                  if (
                      is_retryable
                      and attempt < max_attempts
                  ):

                      print("")
                      print(
                          "This looks like a transient error "
                          "(URL fetch / timeout). Waiting "
                          f"{retry_delay_seconds}s before "
                          "retrying..."
                      )

                      time.sleep(
                          retry_delay_seconds
                      )

                      continue

                  # Not retryable, or out of attempts: stop here.
                  break

              hint = ""

              if (
                  last_error
                  and "could not be read from its url"
                  in last_error.lower()
              ):

                  hint = (
                      "\n\nThis error persisted across "
                      f"{max_attempts} attempt(s). Since the "
                      "R2 accessibility test earlier in this "
                      "run already confirmed HEAD, GET, and "
                      "byte-range access to the exact same URL, "
                      "the remaining likely causes are: "
                      "(1) Facebook/Meta rate limiting from "
                      "repeated runs \u2014 space out runs or wait "
                      "up to 24h, "
                      "(2) Cloudflare blocking Meta's crawler "
                      "specifically (check Bot Fight Mode / WAF "
                      "on the r2.dev zone), or "
                      "(3) the video not meeting Facebook Reels "
                      "format requirements (H.264/AAC, faststart "
                      "moov atom, 3-90s duration, 9:16 aspect "
                      "ratio)."
                  )

              raise SystemExit(
                  f"ERROR: Buffer rejected {label} after "
                  f"{max_attempts} attempt(s):\n"
                  f"{last_error}"
                  f"{hint}"
              )


          # ========================================================
          # INSTAGRAM
          # ========================================================

          create_draft(
              instagram,
              "Instagram",
          )


          # ========================================================
          # FACEBOOK (with retry, since this is the channel that
          # has shown transient "could not be read" failures)
          # ========================================================

          create_draft(
              facebook,
              "Facebook",
              max_attempts=FACEBOOK_MAX_ATTEMPTS,
              retry_delay_seconds=FACEBOOK_RETRY_DELAY_SECONDS,
          )


          # ========================================================
          # YOUTUBE
          # ========================================================

          create_draft(
              youtube,
              "YouTube",
          )


          # ========================================================
          # COMPLETE
          # ========================================================

          print("")
          print("========================================")
          print("BUFFER AUTO-PUBLISH PASSED")
          print("========================================")

          print("")
          print(
              "The video was sent to Buffer and scheduled for auto-publish."
          )

          print(
              "Nothing was automatically published."
          )

          PY
