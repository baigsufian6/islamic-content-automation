name: Quran Production Pipeline

# No built-in schedule on purpose — you're driving timing from make.com
# (or a Render background worker), not from GitHub.
# - workflow_dispatch: manual runs from the Actions tab, for testing.
# - repository_dispatch: lets make.com (or anything else) trigger a run via
#   a plain HTTPS API call whenever IT decides it's time. See SETUP.md for
#   the exact request make.com needs to send.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [produce-quran-section]

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: Quran API
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig
          python3 -m pip install --quiet requests pillow

      # The worker script is the ONLY place the pipeline logic lives.
      # It builds/loads the Quran index, plans the next passage, fetches
      # audio, picks a Pexels visual, renders, QA-validates, publishes to
      # ./publish, and (because COMMIT_PROGRESS / GIT_PUSH_PROGRESS are set)
      # commits + pushes data/progress.json itself. No duplicate logic here.
      - name: Build and render next Quran section
        id: build
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"
          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          python3 production/quran_worker_wow.py | tee run-result.json

      - name: Read run result
        id: meta
        run: |
          FILE=$(python3 -c "import json;print(json.load(open('run-result.json'))['output'])")
          NAME=$(basename "$FILE")
          echo "video_path=$FILE" >> "$GITHUB_OUTPUT"
          echo "video_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=section-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Upload production artifact (backup / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-${{ steps.meta.outputs.tag_name }}
          path: publish/
          retention-days: 14

      # A GitHub Release gives the finished MP4 a stable, public download
      # URL (public repo) that make.com (or any webhook consumer) can fetch
      # without any GitHub auth. This is what actually makes the "publish
      # automatically" step possible.
      - name: Publish finished video to a GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.video_name }}
          body: |
            Automated Quran production section.
            See the attached JSON for verse keys, reciter, translation, and theme.
          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hands the finished video off to make.com (or Zapier / n8n / any
      # webhook-based automation tool). Create a "Custom Webhook" trigger
      # module in your make.com scenario, copy its URL into the
      # MAKE_WEBHOOK_URL repository secret, and this step notifies it every
      # run with the public video URL + metadata so it can auto-post to
      # Instagram/TikTok/YouTube Shorts/etc.
      - name: Notify make.com
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "MAKE_WEBHOOK_URL secret is not set; skipping make.com notification."
            exit 0
          fi
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag_name }}/${{ steps.meta.outputs.video_name }}"
          export ASSET_URL
          PAYLOAD=$(python3 - <<'PY'
          import json
          import os

          with open("run-result.json") as fh:
              meta = json.load(fh)
          meta["video_url"] = os.environ["ASSET_URL"]
          print(json.dumps(meta))
          PY
          )
          curl -sf -X POST "$MAKE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
