name: Quran Production Pipeline

# ================================================================
# Quran Production Pipeline
#
# Flow:
#
# GitHub Actions
#      ↓
# Quran rendering / QA
#      ↓
# GitHub Release backup
#      ↓
# Cloudflare R2
#      ↓
# Buffer
#      ↓
# Instagram / Facebook / YouTube drafts
#
# No Make.com dependency.
#
# workflow_dispatch:
#   Manual testing from GitHub Actions.
#
# repository_dispatch:
#   Can be used later by an external trigger if desired.
# ================================================================

on:
  workflow_dispatch: {}

  repository_dispatch:
    types:
      - produce-quran-section

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: Quran API
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install rendering and storage dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          python3 -m pip install --quiet \
            requests \
            pillow \
            boto3


      # ============================================================
      # 3. BUILD / RENDER NEXT QURAN SECTION
      # ============================================================

      - name: Build and render next Quran section
        id: build
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"
          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}

        run: |
          python3 production/quran_worker_wow.py


      # ============================================================
      # 4. READ WORKER RESULT
      # ============================================================

      - name: Read run result
        id: meta
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("run-result.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: run-result.json was not created by the worker."
              )

          with path.open("r", encoding="utf-8") as fh:
              meta = json.load(fh)

          output = meta.get("output")

          if not output:
              raise SystemExit(
                  "ERROR: run-result.json does not contain an output path."
              )

          output_path = Path(output)

          if not output_path.exists():
              raise SystemExit(
                  f"ERROR: output file does not exist: {output}"
              )

          video_name = output_path.name

          tag_name = (
              "section-"
              + datetime.now(timezone.utc).strftime(
                  "%Y%m%d-%H%M%S"
              )
          )

          # --------------------------------------------------------
          # Read metadata when available.
          # --------------------------------------------------------

          surah = (
              meta.get("surah")
              or meta.get("surah_name")
              or ""
          )

          section = meta.get("section") or {}

          first_ayah = section.get("first_ayah")
          last_ayah = section.get("last_ayah")

          cycle = (
              meta.get("cycle")
              or 1
          )

          theme = (
              meta.get("theme")
              or ""
          )

          # --------------------------------------------------------
          # Fallback: derive useful information from the filename.
          #
          # Example:
          # Surah-Al-Baqarah-Chapter-2-Ayah-26-Cycle-1.mp4
          # --------------------------------------------------------

          if not surah:
              filename_stem = output_path.stem

              match = re.search(
                  r"Surah-(.+?)-Chapter-\d+",
                  filename_stem,
                  re.IGNORECASE,
              )

              if match:
                  surah = (
                      match.group(1)
                      .replace("-", " ")
                  )

          if first_ayah is not None and last_ayah is not None:

              if first_ayah == last_ayah:
                  ayah_text = (
                      f"Ayah {first_ayah}"
                  )
              else:
                  ayah_text = (
                      f"Ayahs {first_ayah}–{last_ayah}"
                  )

          else:

              match = re.search(
                  r"-(?:Ayah|Ayahs)-(\d+)(?:-to-(\d+))?",
                  video_name,
                  re.IGNORECASE,
              )

              if match:

                  first = match.group(1)
                  last = match.group(2)

                  if last:
                      ayah_text = (
                          f"Ayahs {first}–{last}"
                      )
                  else:
                      ayah_text = (
                          f"Ayah {first}"
                      )

              else:
                  ayah_text = ""


          # --------------------------------------------------------
          # Build a clean social caption.
          # --------------------------------------------------------

          if surah:
              reference = surah
          else:
              reference = "Quran"

          if ayah_text:
              reference += (
                  f" — {ayah_text}"
              )


          caption_parts = [
              f"📖 {reference}",
              "",
          ]


          if theme.strip():
              caption_parts.extend([
                  theme.strip(),
                  "",
              ])


          caption_parts.extend([
              "Listen, reflect, and let the words "
              "of the Quran reach your heart.",
              "",
              f"Quran Cycle {cycle}",
              "",
              "#Quran #Islam #QuranReminder "
              "#IslamicReminder #QuranVerses "
              "#IslamicContent",
          ])


          caption = "\n".join(
              caption_parts
          )


          # --------------------------------------------------------
          # GitHub outputs
          # --------------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_path={output}\n"
              )

              fh.write(
                  f"video_name={video_name}\n"
              )

              fh.write(
                  f"tag_name={tag_name}\n"
              )

              fh.write(
                  "surah="
                  + str(surah)
                  .replace("\n", " ")
                  .replace("\r", " ")
                  + "\n"
              )

              fh.write(
                  "ayah_text="
                  + str(ayah_text)
                  .replace("\n", " ")
                  .replace("\r", " ")
                  + "\n"
              )

              fh.write(
                  "cycle="
                  + str(cycle)
                  + "\n"
              )

              fh.write(
                  "theme="
                  + str(theme)
                  .replace("\n", " ")
                  .replace("\r", " ")
                  + "\n"
              )

              # Multiline-safe GitHub output.
              fh.write(
                  "caption<<QURAN_CAPTION\n"
              )

              fh.write(
                  caption
                  + "\n"
              )

              fh.write(
                  "QURAN_CAPTION\n"
              )

          print("")
          print("========================================")
          print("SOCIAL CAPTION")
          print("========================================")
          print(caption)


      # ============================================================
      # 5. BACKUP PRODUCTION ARTIFACT
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-${{ steps.meta.outputs.tag_name }}
          path: publish/
          retention-days: 14


      # ============================================================
      # 6. GITHUB RELEASE BACKUP
      #
      # GitHub is an archive/backup.
      # R2 is the public media host used by Buffer.
      # ============================================================

      - name: Publish finished video to GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.video_name }}

          body: |
            Automated Quran production section.

            Release contains:
            - finished MP4
            - Quran metadata JSON
            - synchronized SRT subtitles

            The public social-media media URL is hosted on Cloudflare R2.

          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
            publish/*.srt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 7. UPLOAD VIDEO TO CLOUDFLARE R2
      #
      # R2 endpoint is intentionally hard-coded because the previous
      # CLOUDFLARE_ACCOUNT_ID GitHub secret was arriving empty.
      #
      # Storage policy:
      #
      #   Maximum target: 9 GB
      #
      # When a new video would push storage over 9 GB:
      #
      #   oldest MP4 → deleted first
      #   next oldest MP4 → deleted if necessary
      #   etc.
      #
      # JSON and SRT files are NOT automatically deleted.
      # ============================================================

      - name: Upload video to Cloudflare R2
        id: r2
        env:
          R2_ENDPOINT: https://f628f290c08401d255823b7cfe41054c.r2.cloudflarestorage.com

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_BUCKET: quran-production-media

          R2_PUBLIC_BASE_URL: https://pub-4ac1cf8ee6a44509bb69a39b67ba92b0.r2.dev

          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}
          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import boto3
          import requests


          # ========================================================
          # CONFIGURATION
          # ========================================================

          ENDPOINT = (
              os.environ["R2_ENDPOINT"]
              .strip()
              .rstrip("/")
          )

          ACCESS_KEY = (
              os.environ["R2_ACCESS_KEY_ID"]
              .strip()
          )

          SECRET_KEY = (
              os.environ["R2_SECRET_ACCESS_KEY"]
              .strip()
          )

          BUCKET = os.environ[
              "R2_BUCKET"
          ]

          PUBLIC_BASE = (
              os.environ["R2_PUBLIC_BASE_URL"]
              .strip()
              .rstrip("/")
          )

          VIDEO_PATH = Path(
              os.environ["VIDEO_PATH"]
          )

          VIDEO_NAME = os.environ[
              "VIDEO_NAME"
          ]


          # ========================================================
          # VALIDATION
          # ========================================================

          if not ACCESS_KEY:
              raise SystemExit(
                  "ERROR: R2_ACCESS_KEY_ID is empty."
              )

          if not SECRET_KEY:
              raise SystemExit(
                  "ERROR: R2_SECRET_ACCESS_KEY is empty."
              )

          if not VIDEO_PATH.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {VIDEO_PATH}"
              )


          print("========================================")
          print("R2 CONFIGURATION")
          print("========================================")

          print(
              f"R2 endpoint: {ENDPOINT}"
          )

          print(
              f"R2 bucket: {BUCKET}"
          )

          print(
              f"Video: {VIDEO_NAME}"
          )


          # ========================================================
          # CREATE R2 CLIENT
          # ========================================================

          s3 = boto3.client(
              "s3",
              endpoint_url=ENDPOINT,
              aws_access_key_id=ACCESS_KEY,
              aws_secret_access_key=SECRET_KEY,
              region_name="auto",
          )


          # ========================================================
          # TEST CONNECTION
          # ========================================================

          print("")
          print(
              "Testing R2 connection..."
          )

          try:

              s3.head_bucket(
                  Bucket=BUCKET
              )

          except Exception as exc:

              raise SystemExit(
                  "ERROR: Could not access R2 bucket.\n"
                  f"{exc}"
              )


          print(
              "R2 bucket connection successful."
          )


          # ========================================================
          # 9 GB LIMIT
          # ========================================================

          MAX_STORAGE = (
              9 * 1024 * 1024 * 1024
          )

          new_size = (
              VIDEO_PATH.stat().st_size
          )


          print("")
          print("========================================")
          print("R2 STORAGE CHECK")
          print("========================================")

          print(
              f"New video size: "
              f"{new_size / 1024 / 1024:.2f} MB"
          )


          if new_size > MAX_STORAGE:

              raise SystemExit(
                  "ERROR: New video itself exceeds "
                  "the 9 GB storage limit."
              )


          # ========================================================
          # LIST EXISTING OBJECTS
          # ========================================================

          objects = []

          paginator = s3.get_paginator(
              "list_objects_v2"
          )


          for page in paginator.paginate(
              Bucket=BUCKET
          ):

              objects.extend(
                  page.get(
                      "Contents",
                      []
                  )
              )


          current_size = sum(
              obj["Size"]
              for obj in objects
          )


          projected_size = (
              current_size
              + new_size
          )


          print(
              f"Current storage: "
              f"{current_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Projected storage: "
              f"{projected_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Storage ceiling: "
              f"{MAX_STORAGE / 1024 / 1024:.2f} MB"
          )


          # ========================================================
          # OLDEST-FIRST MP4 CLEANUP
          # ========================================================

          if projected_size > MAX_STORAGE:

              print("")
              print(
                  "9 GB ceiling would be exceeded."
              )

              print(
                  "Starting oldest-MP4 cleanup..."
              )


              candidates = [
                  obj
                  for obj in objects
                  if obj["Key"]
                  .lower()
                  .endswith(".mp4")
              ]


              candidates.sort(
                  key=lambda obj: obj[
                      "LastModified"
                  ]
              )


              for obj in candidates:

                  if projected_size <= MAX_STORAGE:
                      break


                  key = obj["Key"]

                  size = obj["Size"]


                  print(
                      f"Deleting oldest MP4: {key}"
                  )

                  print(
                      f"Freeing: "
                      f"{size / 1024 / 1024:.2f} MB"
                  )


                  s3.delete_object(
                      Bucket=BUCKET,
                      Key=key,
                  )


                  projected_size -= size


              if projected_size > MAX_STORAGE:

                  raise SystemExit(
                      "ERROR: Could not free enough "
                      "space to stay below 9 GB."
                  )


              print(
                  "Oldest-MP4 cleanup completed."
              )


          else:

              print(
                  "No R2 cleanup required."
              )


          # ========================================================
          # UPLOAD
          # ========================================================

          print("")
          print("========================================")
          print("R2 VIDEO UPLOAD")
          print("========================================")

          print(
              "Uploading Quran MP4 to R2..."
          )


          s3.upload_file(
              str(VIDEO_PATH),
              BUCKET,
              VIDEO_NAME,
              ExtraArgs={
                  "ContentType": "video/mp4"
              },
          )


          # ========================================================
          # PUBLIC URL
          # ========================================================

          video_url = (
              f"{PUBLIC_BASE}/"
              f"{quote(VIDEO_NAME, safe='/')}"
          )


          print("")
          print(
              "R2 upload completed."
          )

          print(
              f"Public URL: {video_url}"
          )


          # ========================================================
          # VERIFY PUBLIC URL
          # ========================================================

          print("")
          print(
              "Checking public R2 URL..."
          )


          verify = requests.head(
              video_url,
              allow_redirects=True,
              timeout=30,
          )


          if verify.status_code >= 400:

              raise SystemExit(
                  "ERROR: R2 public URL verification failed: "
                  f"HTTP {verify.status_code}"
              )


          print(
              "R2 public URL verification passed."
          )

          print(
              f"HTTP status: "
              f"{verify.status_code}"
          )


          # ========================================================
          # PASS URL TO BUFFER
          # ========================================================

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_url={video_url}\n"
              )

          PY


      # ============================================================
      # 8. CREATE BUFFER DRAFTS
      #
      # Buffer receives the public R2 video URL.
      #
      # IMPORTANT:
      # saveToDraft = true
      #
      # Therefore this workflow does NOT publish immediately.
      #
      # It creates drafts for:
      #
      #   Instagram
      #   Facebook
      #   YouTube
      #
      # You can manually review/schedule them in Buffer.
      # ============================================================

      - name: Create Buffer drafts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          BUFFER_ORGANIZATION_ID: "6a4a94cd8807be89129990e6"

          SURAH: ${{ steps.meta.outputs.surah }}
          AYAH_TEXT: ${{ steps.meta.outputs.ayah_text }}
          CYCLE: ${{ steps.meta.outputs.cycle }}
          THEME: ${{ steps.meta.outputs.theme }}
          CAPTION: ${{ steps.meta.outputs.caption }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import requests


          # ========================================================
          # BUFFER CONFIGURATION
          # ========================================================

          API = (
              "https://api.buffer.com"
          )

          API_KEY = (
              os.environ["BUFFER_API_KEY"]
              .strip()
          )

          VIDEO_URL = (
              os.environ["BUFFER_VIDEO_URL"]
              .strip()
          )

          ORGANIZATION_ID = (
              os.environ["BUFFER_ORGANIZATION_ID"]
              .strip()
          )

          CAPTION = os.environ[
              "CAPTION"
          ]


          if not API_KEY:
              raise SystemExit(
                  "ERROR: BUFFER_API_KEY is empty."
              )

          if not VIDEO_URL:
              raise SystemExit(
                  "ERROR: BUFFER_VIDEO_URL is empty."
              )


          # ========================================================
          # BUFFER AUTH
          # ========================================================

          headers = {
              "Content-Type": "application/json",
              "Authorization": (
                  f"Bearer {API_KEY}"
              ),
          }


          # ========================================================
          # GET CHANNELS
          #
          # Buffer's current API expects the organization ID
          # directly as an OrganizationId scalar.
          #
          # No GraphQL variable is used here.
          # ========================================================

          channel_query = f"""
          query GetChannels {{
            channels(
              input: {{
                organizationId: "{ORGANIZATION_ID}"
              }}
            ) {{
              id
              name
              displayName
              service
              isQueuePaused
            }}
          }}
          """


          print("")
          print(
              "========================================"
          )

          print(
              "BUFFER CHANNEL DISCOVERY"
          )

          print(
              "========================================"
          )


          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": channel_query,
              },
              timeout=30,
          )


          response.raise_for_status()

          data = response.json()


          if data.get("errors"):

              raise SystemExit(
                  "Buffer channel query failed:\n"
                  + json.dumps(
                      data["errors"],
                      indent=2,
                  )
              )


          channels = (
              data
              .get("data", {})
              .get("channels", [])
          )


          if not channels:

              raise SystemExit(
                  "Buffer returned zero channels."
              )


          print(
              f"Found {len(channels)} Buffer channel(s)."
          )


          # ========================================================
          # FIND TARGET CHANNELS
          # ========================================================

          targets = {}


          for channel in channels:

              service = (
                  channel.get("service")
                  or ""
              ).lower()


              display_name = (
                  channel.get("displayName")
                  or channel.get("name")
                  or channel.get("id")
              )


              print(
                  f"- {display_name} "
                  f"[{service}]"
              )


              if service == "instagram":
                  targets["instagram"] = channel

              elif service == "facebook":
                  targets["facebook"] = channel

              elif service == "youtube":
                  targets["youtube"] = channel


          # ========================================================
          # CREATE BUFFER DRAFT
          #
          # This follows Buffer's documented createPost draft
          # pattern:
          #
          #   channelId
          #   text
          #   schedulingType
          #   mode
          #   saveToDraft
          #   video asset
          # ========================================================

          def create_draft(
              channel,
              label,
          ):

              channel_id = channel[
                  "id"
              ]


              mutation = f"""
              mutation CreateDraft {{
                createPost(
                  input: {{
                    text: {json.dumps(CAPTION)}
                    channelId: {json.dumps(channel_id)}
                    schedulingType: automatic
                    mode: addToQueue
                    saveToDraft: true

                    assets: [
                      {{
                        video: {{
                          url: {json.dumps(VIDEO_URL)}
                        }}
                      }}
                    ]
                  }}
                ) {{
                  ... on PostActionSuccess {{
                    post {{
                      id
                      text
                      status
                      channelId
                    }}
                  }}

                  ... on MutationError {{
                    message
                  }}
                }}
              }}
              """


              result = requests.post(
                  API,
                  headers=headers,
                  json={
                      "query": mutation,
                  },
                  timeout=30,
              )


              result.raise_for_status()


              payload = result.json()


              if payload.get("errors"):

                  raise SystemExit(
                      f"Buffer GraphQL error "
                      f"for {label}:\n"
                      + json.dumps(
                          payload["errors"],
                          indent=2,
                      )
                  )


              create_result = (
                  payload
                  .get("data", {})
                  .get("createPost")
              )


              if not create_result:

                  raise SystemExit(
                      f"Buffer returned no "
                      f"createPost result for {label}."
                  )


              if create_result.get(
                  "message"
              ):

                  raise SystemExit(
                      f"Buffer rejected {label}: "
                      f"{create_result['message']}"
                  )


              post = (
                  create_result
                  .get("post")
              )


              if not post:

                  raise SystemExit(
                      f"Buffer did not create "
                      f"{label} draft."
                  )


              print("")
              print(
                  f"{label} draft created successfully."
              )

              print(
                  f"Post ID: {post.get('id')}"
              )

              print(
                  f"Status: {post.get('status')}"
              )


          # ========================================================
          # INSTAGRAM
          # ========================================================

          if "instagram" in targets:

              create_draft(
                  targets["instagram"],
                  "Instagram",
              )

          else:

              print(
                  "Instagram channel not found; skipping."
              )


          # ========================================================
          # FACEBOOK
          # ========================================================

          if "facebook" in targets:

              create_draft(
                  targets["facebook"],
                  "Facebook",
              )

          else:

              print(
                  "Facebook channel not found; skipping."
              )


          # ========================================================
          # YOUTUBE
          # ========================================================

          if "youtube" in targets:

              create_draft(
                  targets["youtube"],
                  "YouTube",
              )

          else:

              print(
                  "YouTube channel not found; skipping."
              )


          # ========================================================
          # FINAL OUTPUT
          # ========================================================

          print("")
          print(
              "========================================"
          )

          print(
              "BUFFER DRAFT CREATION PASSED"
          )

          print(
              "========================================"
          )

          print("")
          print(
              "Caption used:"
          )

          print(
              CAPTION
          )

          PY
