name: Quran Production Pipeline

# Fully automatic production.
# - Scheduled run: one new Quran section every day at 06:00 UTC.
# - Manual run: optional emergency/recovery run with NO inputs.
#   The worker itself chooses the next section, ayahs, visual, and timing.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:
  production:
    name: Produce next Quran section automatically
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version

      - name: Install FFmpeg and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra

          fc-cache -f

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Arabic fonts:"
          fc-list | grep -Ei 'Noto Naskh Arabic|Noto Sans Arabic|Noto Kufi Arabic' | head -n 10 || true

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests pillow

      - name: Validate production worker
        shell: bash
        run: |
          set -euo pipefail

          test -f production/quran_worker_wow.py
          python -m py_compile production/quran_worker_wow.py

          echo "Production worker syntax check passed."
          echo "No manual Surah, ayah, section count, visual, or reciter inputs are used."

      - name: Validate required secrets
        shell: bash
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$QF_CLIENT_ID" || {
            echo "ERROR: QF_CLIENT_ID secret is missing."
            exit 1
          }

          test -n "$QF_CLIENT_SECRET" || {
            echo "ERROR: QF_CLIENT_SECRET secret is missing."
            exit 1
          }

          test -n "$PEXELS_API_KEY" || {
            echo "ERROR: PEXELS_API_KEY secret is missing."
            exit 1
          }

          echo "Required production secrets are present."

      - name: Prepare production directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data publish output/production

          if [ ! -f data/progress.json ]; then
            printf '%s\n' '{}' > data/progress.json
          fi

          echo "Production directories ready."

      - name: Run production brain
        shell: bash
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Critical: the GitHub runner is disposable. Persist and PUSH progress
          # so tomorrow's run continues from today's completed ayahs.
          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"
          GIT_REMOTE: origin
          GIT_BRANCH: main
          GIT_PUSH_RETRIES: "3"

          # Production rules. No section-count input exists.
          QURAN_TARGET_MIN: "35"
          QURAN_TARGET_MAX: "65"
          ALLOW_VISUAL_REUSE: "0"

          # Verified production reciter/source.
          QURAN_RECITER: "Saad Al-Ghamdi"
          QURAN_AUDIO_BASE: "https://everyayah.com/data/Ghamadi_40kbps"

          # Saheeh International resource used by the verified Quran index.
          QURAN_TRANSLATION_RESOURCE_ID: "20"
          QURAN_TRANSLATION_NAME: "Saheeh International"

          # Render format.
          QURAN_WIDTH: "1080"
          QURAN_HEIGHT: "1920"
          QURAN_FPS: "30"
          QURAN_LOG_LEVEL: "INFO"

          # Normal production run: use cached Quran index when valid.
          QURAN_FORCE_REINDEX: "0"
          QURAN_DRY_RUN: "0"

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING AUTOMATIC QURAN PRODUCTION"
          echo "=========================================="
          echo "No Surah/ayah/section-count input is being requested."
          echo "The worker will select the next unconsumed Quran passage."

          python production/quran_worker_wow.py

      - name: Verify final production output
        shell: bash
        run: |
          set -euo pipefail

          test -d publish

          shopt -s nullglob
          videos=(publish/*.mp4)
          metadata=(publish/*.json)

          if [ "${#videos[@]}" -lt 1 ]; then
            echo "ERROR: No final MP4 was produced."
            exit 1
          fi

          if [ "${#metadata[@]}" -lt 1 ]; then
            echo "ERROR: No production metadata was produced."
            exit 1
          fi

          echo "Final videos: ${#videos[@]}"
          echo "Metadata files: ${#metadata[@]}"

          for video in "${videos[@]}"; do
            echo
            echo "=== $video ==="
            ffprobe -v error \
              -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size,format_name \
              -of default=noprint_wrappers=1 \
              "$video"
          done

          echo
          echo "Production output verification passed."

      - name: Verify progress is committed and pushed
        shell: bash
        run: |
          set -euo pipefail

          test -f data/progress.json
          git status --short
          echo "Latest repository commit:"
          git log -1 --oneline
          echo "Persistent Quran progress exists and the worker was configured to push it."

      - name: Upload final video and metadata
        uses: actions/upload-artifact@v7
        with:
          name: quran-production-${{ github.run_number }}
          path: |
            publish/*.mp4
            publish/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload production state for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quran-production-state-${{ github.run_number }}
          path: |
            data/progress.json
            data/quran_index.json
            data/publish_queue.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Final status
        shell: bash
        run: |
          echo "=========================================="
          echo "QURAN PRODUCTION COMPLETED"
          echo "=========================================="
          echo "Run: ${{ github.run_number }}"
          echo "Next scheduled run will continue from the pushed progress state."
          echo "No manual verse, Surah, or section selection was used."
