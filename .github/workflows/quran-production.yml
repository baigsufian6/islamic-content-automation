name: Quran Production Pipeline

# No built-in schedule.
#
# workflow_dispatch:
#   Manual testing from GitHub Actions.
#
# repository_dispatch:
#   Make.com can trigger production through GitHub's API.

on:
  workflow_dispatch: {}

  repository_dispatch:
    types:
      - produce-quran-section

permissions:
  contents: write

concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: Quran API
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install rendering and storage dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          python3 -m pip install --quiet \
            requests \
            pillow \
            boto3


      # ============================================================
      # 3. BUILD / RENDER QURAN SECTION
      # ============================================================

      - name: Build and render next Quran section
        id: build
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          COMMIT_PROGRESS: "1"
          GIT_PUSH_PROGRESS: "1"
          GIT_REMOTE: origin
          GIT_BRANCH: ${{ github.ref_name }}

        run: |
          python3 production/quran_worker_wow.py


      # ============================================================
      # 4. READ WORKER RESULT
      # ============================================================

      - name: Read run result
        id: meta
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("run-result.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: run-result.json was not created by the worker."
              )

          with path.open("r", encoding="utf-8") as fh:
              meta = json.load(fh)

          output = meta.get("output")

          if not output:
              raise SystemExit(
                  "ERROR: run-result.json does not contain an output path."
              )

          output_path = Path(output)

          if not output_path.exists():
              raise SystemExit(
                  f"ERROR: output file does not exist: {output}"
              )

          video_name = output_path.name

          tag_name = (
              "section-"
              + datetime.now(timezone.utc).strftime(
                  "%Y%m%d-%H%M%S"
              )
          )

          # --------------------------------------------------------
          # Quran metadata for social captions.
          # --------------------------------------------------------

          surah = meta.get("surah") or "Quran"

          section = meta.get("section") or {}

          first_ayah = section.get("first_ayah")
          last_ayah = section.get("last_ayah")

          cycle = meta.get("cycle") or 1

          theme = meta.get("theme") or ""

          if first_ayah is not None and last_ayah is not None:
              if first_ayah == last_ayah:
                  ayah_text = f"Ayah {first_ayah}"
              else:
                  ayah_text = f"Ayahs {first_ayah}–{last_ayah}"
          else:
              ayah_text = ""

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(f"video_path={output}\n")
              fh.write(f"video_name={video_name}\n")
              fh.write(f"tag_name={tag_name}\n")

              fh.write(
                  "surah="
                  + str(surah).replace("\n", " ")
                  + "\n"
              )

              fh.write(
                  "ayah_text="
                  + ayah_text
                  + "\n"
              )

              fh.write(
                  "cycle="
                  + str(cycle)
                  + "\n"
              )

              fh.write(
                  "theme="
                  + str(theme)
                  .replace("\n", " ")
                  .replace("\r", " ")
                  + "\n"
              )
          PY


      # ============================================================
      # 5. BACKUP ARTIFACT
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-${{ steps.meta.outputs.tag_name }}
          path: publish/
          retention-days: 14


      # ============================================================
      # 6. GITHUB RELEASE BACKUP
      # ============================================================

      - name: Publish finished video to GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.video_name }}

          body: |
            Automated Quran production section.

            Release contains:
            - finished MP4
            - Quran metadata JSON
            - synchronized SRT subtitles

          files: |
            ${{ steps.meta.outputs.video_path }}
            publish/*.json
            publish/*.srt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 7. CLOUDFLARE R2
      #
      # IMPORTANT:
      # We use the confirmed R2 endpoint directly.
      #
      # We do NOT use CLOUDFLARE_ACCOUNT_ID here because the
      # previous GitHub secret was arriving empty.
      #
      # R2 bucket:
      #   quran-production-media
      #
      # Storage ceiling:
      #   9 GB
      #
      # Cleanup:
      #   oldest MP4 first
      # ============================================================

      - name: Upload video to Cloudflare R2
        id: r2
        env:
          R2_ENDPOINT: https://f628f290c08401d255823b7cfe41054c.r2.cloudflarestorage.com

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_BUCKET: quran-production-media

          R2_PUBLIC_BASE_URL: https://pub-4ac1cf8ee6a44509bb69a39b67ba92b0.r2.dev

          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}
          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          import boto3
          import requests


          # ========================================================
          # CONFIGURATION
          # ========================================================

          ENDPOINT = os.environ[
              "R2_ENDPOINT"
          ].strip().rstrip("/")

          ACCESS_KEY = os.environ[
              "R2_ACCESS_KEY_ID"
          ].strip()

          SECRET_KEY = os.environ[
              "R2_SECRET_ACCESS_KEY"
          ].strip()

          BUCKET = os.environ[
              "R2_BUCKET"
          ]

          PUBLIC_BASE = os.environ[
              "R2_PUBLIC_BASE_URL"
          ].rstrip("/")

          VIDEO_PATH = Path(
              os.environ["VIDEO_PATH"]
          )

          VIDEO_NAME = os.environ[
              "VIDEO_NAME"
          ]


          # ========================================================
          # VALIDATION
          # ========================================================

          if not ACCESS_KEY:
              raise SystemExit(
                  "ERROR: R2_ACCESS_KEY_ID is empty."
              )

          if not SECRET_KEY:
              raise SystemExit(
                  "ERROR: R2_SECRET_ACCESS_KEY is empty."
              )

          if not VIDEO_PATH.exists():
              raise SystemExit(
                  f"ERROR: video does not exist: {VIDEO_PATH}"
              )


          print("========================================")
          print("R2 CONFIGURATION")
          print("========================================")

          print(
              f"R2 endpoint: {ENDPOINT}"
          )

          print(
              f"R2 bucket: {BUCKET}"
          )

          print(
              f"Video: {VIDEO_NAME}"
          )


          # ========================================================
          # CREATE R2 / S3 CLIENT
          # ========================================================

          s3 = boto3.client(
              "s3",
              endpoint_url=ENDPOINT,
              aws_access_key_id=ACCESS_KEY,
              aws_secret_access_key=SECRET_KEY,
              region_name="auto",
          )


          # ========================================================
          # TEST BUCKET CONNECTION
          # ========================================================

          print("")
          print(
              "Testing R2 connection..."
          )

          try:
              s3.head_bucket(
                  Bucket=BUCKET
              )

          except Exception as exc:
              raise SystemExit(
                  "ERROR: Could not access R2 bucket.\n"
                  f"{exc}"
              )

          print(
              "R2 bucket connection successful."
          )


          # ========================================================
          # 9 GB STORAGE LIMIT
          # ========================================================

          MAX_STORAGE = (
              9 * 1024 * 1024 * 1024
          )

          new_size = (
              VIDEO_PATH.stat().st_size
          )


          print("")
          print("========================================")
          print("R2 STORAGE CHECK")
          print("========================================")

          print(
              f"New video size: "
              f"{new_size / 1024 / 1024:.2f} MB"
          )


          if new_size > MAX_STORAGE:
              raise SystemExit(
                  "ERROR: New video itself exceeds 9 GB."
              )


          # ========================================================
          # LIST EXISTING R2 OBJECTS
          # ========================================================

          objects = []

          paginator = s3.get_paginator(
              "list_objects_v2"
          )

          for page in paginator.paginate(
              Bucket=BUCKET
          ):
              objects.extend(
                  page.get("Contents", [])
              )


          current_size = sum(
              obj["Size"]
              for obj in objects
          )

          projected_size = (
              current_size + new_size
          )


          print(
              f"Current storage: "
              f"{current_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Projected storage: "
              f"{projected_size / 1024 / 1024:.2f} MB"
          )

          print(
              f"Storage ceiling: "
              f"{MAX_STORAGE / 1024 / 1024:.2f} MB"
          )


          # ========================================================
          # OLDEST-FIRST CLEANUP
          #
          # Only MP4 files are automatically deleted.
          # JSON/SRT files are left alone.
          # ========================================================

          if projected_size > MAX_STORAGE:

              print("")
              print(
                  "9 GB ceiling would be exceeded."
              )

              print(
                  "Starting oldest-MP4 cleanup..."
              )


              candidates = [
                  obj
                  for obj in objects
                  if obj["Key"]
                  .lower()
                  .endswith(".mp4")
              ]


              candidates.sort(
                  key=lambda obj: obj[
                      "LastModified"
                  ]
              )


              for obj in candidates:

                  if projected_size <= MAX_STORAGE:
                      break


                  key = obj["Key"]
                  size = obj["Size"]


                  print(
                      f"Deleting oldest MP4: "
                      f"{key}"
                  )

                  print(
                      f"Freeing: "
                      f"{size / 1024 / 1024:.2f} MB"
                  )


                  s3.delete_object(
                      Bucket=BUCKET,
                      Key=key,
                  )


                  projected_size -= size


              if projected_size > MAX_STORAGE:
                  raise SystemExit(
                      "ERROR: Could not free enough "
                      "space to stay below 9 GB."
                  )


              print(
                  "Oldest-MP4 cleanup completed."
              )

          else:

              print(
                  "No R2 cleanup required."
              )


          # ========================================================
          # UPLOAD NEW VIDEO
          # ========================================================

          print("")
          print("========================================")
          print("R2 VIDEO UPLOAD")
          print("========================================")

          print(
              "Uploading Quran MP4 to R2..."
          )


          s3.upload_file(
              str(VIDEO_PATH),
              BUCKET,
              VIDEO_NAME,
              ExtraArgs={
                  "ContentType": "video/mp4"
              },
          )


          # ========================================================
          # CREATE PUBLIC URL
          # ========================================================

          video_url = (
              f"{PUBLIC_BASE}/"
              f"{quote(VIDEO_NAME, safe='/')}"
          )


          print("")
          print(
              "R2 upload completed."
          )

          print(
              f"Public URL: {video_url}"
          )


          # ========================================================
          # VERIFY PUBLIC URL
          # ========================================================

          print("")
          print(
              "Checking public R2 URL..."
          )


          verify = requests.head(
              video_url,
              allow_redirects=True,
              timeout=30,
          )


          if verify.status_code >= 400:
              raise SystemExit(
                  "ERROR: R2 public URL verification failed: "
                  f"HTTP {verify.status_code}"
              )


          print(
              "R2 public URL verification passed."
          )

          print(
              f"HTTP status: "
              f"{verify.status_code}"
          )


          # ========================================================
          # OUTPUT URL FOR NEXT STEPS
          # ========================================================

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as fh:

              fh.write(
                  f"video_url={video_url}\n"
              )

          PY


      # ============================================================
      # 8. CREATE BUFFER DRAFTS
      #
      # NOTHING IS PUBLISHED AUTOMATICALLY.
      #
      # Instagram:
      #   Reel
      #
      # Facebook:
      #   Reel
      #
      # YouTube:
      #   Short
      #
      # Caption:
      #   Generated from the actual Quran section.
      # ============================================================

      - name: Create Buffer drafts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          BUFFER_VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          SURAH: ${{ steps.meta.outputs.surah }}
          AYAH_TEXT: ${{ steps.meta.outputs.ayah_text }}
          CYCLE: ${{ steps.meta.outputs.cycle }}
          THEME: ${{ steps.meta.outputs.theme }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import requests


          API = "https://api.buffer.com"

          API_KEY = os.environ[
              "BUFFER_API_KEY"
          ]

          VIDEO_URL = os.environ[
              "BUFFER_VIDEO_URL"
          ]

          SURAH = os.environ[
              "SURAH"
          ]

          AYAH_TEXT = os.environ[
              "AYAH_TEXT"
          ]

          CYCLE = os.environ[
              "CYCLE"
          ]

          THEME = os.environ[
              "THEME"
          ].strip()


          # ========================================================
          # BUILD DYNAMIC SOCIAL CAPTION
          # ========================================================

          reference = SURAH

          if AYAH_TEXT:
              reference += (
                  f" — {AYAH_TEXT}"
              )


          caption_parts = [
              f"📖 {reference}",
              "",
          ]


          if THEME:
              caption_parts.extend([
                  THEME,
                  "",
              ])


          caption_parts.extend([
              "Listen, reflect, and let the words "
              "of the Quran reach your heart.",
              "",
              f"Quran Cycle {CYCLE}",
              "",
              "#Quran #Islam #QuranReminder "
              "#IslamicReminder #QuranVerses "
              "#IslamicContent",
          ])


          CAPTION = "\n".join(
              caption_parts
          )


          # ========================================================
          # BUFFER AUTH
          # ========================================================

          headers = {
              "Content-Type": "application/json",
              "Authorization": (
                  f"Bearer {API_KEY}"
              ),
          }


          # ========================================================
          # BUFFER ORGANIZATION
          # ========================================================

          ORGANIZATION_ID = (
              "6a4a94cd8807be89129990e6"
          )


          # ========================================================
          # DISCOVER CONNECTED CHANNELS
          # ========================================================

          channel_query = """
          query GetChannels(
            $organizationId: String!
          ) {
            channels(
              input: {
                organizationId: $organizationId
              }
            ) {
              id
              displayName
              service
              isDisconnected
            }
          }
          """


          response = requests.post(
              API,
              headers=headers,
              json={
                  "query": channel_query,
                  "variables": {
                      "organizationId":
                          ORGANIZATION_ID
                  },
              },
              timeout=30,
          )


          response.raise_for_status()

          data = response.json()


          if data.get("errors"):
              raise SystemExit(
                  "Buffer channel query failed:\n"
                  + json.dumps(
                      data["errors"],
                      indent=2,
                  )
              )


          channels = (
              data
              .get("data", {})
              .get("channels", [])
          )


          targets = {}


          for channel in channels:

              if channel.get(
                  "isDisconnected"
              ):
                  continue


              service = (
                  channel.get("service")
                  or ""
              ).lower()


              if service == "instagram":
                  targets["instagram"] = channel

              elif service == "facebook":
                  targets["facebook"] = channel

              elif service == "youtube":
                  targets["youtube"] = channel


          required = [
              "instagram",
              "facebook",
              "youtube",
          ]


          missing = [
              name
              for name in required
              if name not in targets
          ]


          if missing:
              raise SystemExit(
                  "Missing connected Buffer channels: "
                  + ", ".join(missing)
              )


          # ========================================================
          # CREATE BUFFER DRAFT
          # ========================================================

          def create_draft(
              channel_id,
              metadata,
              label,
          ):

              mutation = """
              mutation CreateDraft(
                $channelId: ChannelId!
                $text: String!
                $videoUrl: String!
                $metadata: PostInputMetaData
              ) {
                createPost(
                  input: {
                    channelId: $channelId
                    text: $text

                    schedulingType: automatic
                    mode: addToQueue
                    saveToDraft: true

                    assets: [
                      {
                        video: {
                          url: $videoUrl
                        }
                      }
                    ]

                    metadata: $metadata
                  }
                ) {
                  ... on PostActionSuccess {
                    post {
                      id
                      status
                      channelId
                      text
                    }
                  }

                  ... on MutationError {
                    message
                  }
                }
              }
              """


              variables = {
                  "channelId": channel_id,
                  "text": CAPTION,
                  "videoUrl": VIDEO_URL,
                  "metadata": metadata,
              }


              response = requests.post(
                  API,
                  headers=headers,
                  json={
                      "query": mutation,
                      "variables": variables,
                  },
                  timeout=30,
              )


              response.raise_for_status()

              result_data = response.json()


              if result_data.get(
                  "errors"
              ):
                  raise SystemExit(
                      f"Buffer GraphQL error for "
                      f"{label}:\n"
                      + json.dumps(
                          result_data["errors"],
                          indent=2,
                      )
                  )


              result = (
                  result_data
                  .get("data", {})
                  .get("createPost")
              )


              if not result:
                  raise SystemExit(
                      f"Buffer returned no result "
                      f"for {label}."
                  )


              if result.get(
                  "message"
              ):
                  raise SystemExit(
                      f"Buffer rejected {label}: "
                      f"{result['message']}"
                  )


              post = result.get(
                  "post"
              )


              if not post:
                  raise SystemExit(
                      f"Buffer did not create "
                      f"{label} draft."
                  )


              print("")
              print(
                  f"{label} draft created successfully."
              )

              print(
                  f"Post ID: {post['id']}"
              )

              print(
                  f"Status: {post['status']}"
              )


          # ========================================================
          # INSTAGRAM REEL
          # ========================================================

          create_draft(
              targets["instagram"]["id"],
              {
                  "instagram": {
                      "type": "reel",
                      "shouldShareToFeed": True,
                      "isAiGenerated": False,
                  }
              },
              "Instagram",
          )


          # ========================================================
          # FACEBOOK REEL
          # ========================================================

          create_draft(
              targets["facebook"]["id"],
              {
                  "facebook": {
                      "type": "reel",
                  }
              },
              "Facebook",
          )


          # ========================================================
          # YOUTUBE SHORT
          # ========================================================

          youtube_title = (
              f"{SURAH} — {AYAH_TEXT}"
              if AYAH_TEXT
              else SURAH
          )


          create_draft(
              targets["youtube"]["id"],
              {
                  "youtube": {
                      "type": "short",
                      "title": youtube_title,
                      "categoryId": "27",
                      "privacy": "public",
                      "madeForKids": False,
                      "notifySubscribers": True,
                  }
              },
              "YouTube",
          )


          # ========================================================
          # SHOW CAPTION IN ACTION LOG
          # ========================================================

          print("")
          print(
              "========================================"
          )

          print(
              "GENERATED SOCIAL CAPTION"
          )

          print(
              "========================================"
          )

          print(CAPTION)

          print("")
          print(
              "========================================"
          )

          print(
              "BUFFER DRAFT CREATION PASSED"
          )

          print(
              "========================================"
          )

          PY


      # ============================================================
      # 9. NOTIFY MAKE.COM
      #
      # Make receives the R2 URL.
      # GitHub Release remains the backup/archive.
      # ============================================================

      - name: Notify Make.com
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}

          VIDEO_URL: ${{ steps.r2.outputs.video_url }}

          VIDEO_NAME: ${{ steps.meta.outputs.video_name }}

          TAG_NAME: ${{ steps.meta.outputs.tag_name }}

        run: |

          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "MAKE_WEBHOOK_URL is not configured."
            echo "Skipping Make.com notification."
            exit 0
          fi


          python3 - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path


          result_path = Path(
              "run-result.json"
          )


          with result_path.open(
              "r",
              encoding="utf-8",
          ) as fh:
              meta = json.load(fh)


          # R2 is now the media URL for downstream automation.
          meta["video_url"] = os.environ[
              "VIDEO_URL"
          ]


          # GitHub remains the backup.
          meta["video_name"] = os.environ[
              "VIDEO_NAME"
          ]


          meta["release_tag"] = os.environ[
              "TAG_NAME"
          ]


          response = requests.post(
              os.environ[
                  "MAKE_WEBHOOK_URL"
              ],
              json=meta,
              timeout=90,
          )


          response.raise_for_status()


          print(
              "Make.com notification delivered successfully."
          )

          PY
