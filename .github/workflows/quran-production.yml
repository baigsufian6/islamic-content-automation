name: Quran Production Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          python3 -m pip install --quiet requests

      - name: Build next real Quran section
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          import requests

          ROOT = Path.cwd()
          DATA = ROOT / "data"
          OUT = ROOT / "output" / "production"
          DATA.mkdir(exist_ok=True)
          OUT.mkdir(parents=True, exist_ok=True)

          CLIENT_ID = os.environ.get("QF_CLIENT_ID")
          CLIENT_SECRET = os.environ.get("QF_CLIENT_SECRET")
          QF_ENV = os.environ.get("QF_ENV", "").lower()
          PEXELS_KEY = os.environ.get("PEXELS_API_KEY")

          if not CLIENT_ID or not CLIENT_SECRET:
              raise SystemExit("ERROR: Quran Foundation credentials are missing.")
          if not PEXELS_KEY:
              raise SystemExit("ERROR: PEXELS_API_KEY is missing.")

          if QF_ENV == "production":
              OAUTH = "https://oauth2.quran.foundation"
              API = "https://apis.quran.foundation"
          elif QF_ENV == "prelive":
              OAUTH = "https://prelive-oauth2.quran.foundation"
              API = "https://apis-prelive.quran.foundation"
          else:
              raise SystemExit("ERROR: QF_ENV must be production or prelive.")

          def die(message):
              raise SystemExit(message)

          def qf_get(path, params=None, timeout=60):
              r = requests.get(
                  API + path,
                  headers=HEADERS,
                  params=params or {},
                  timeout=timeout,
              )
              if not r.ok:
                  die(f"Quran API HTTP {r.status_code}: {r.text[:800]}")
              return r.json()

          token = requests.post(
              f"{OAUTH}/oauth2/token",
              data={"grant_type": "client_credentials", "scope": "content"},
              auth=(CLIENT_ID, CLIENT_SECRET),
              timeout=30,
          )
          if not token.ok:
              die(f"Quran authentication failed: HTTP {token.status_code}")

          access_token = token.json().get("access_token")
          if not access_token:
              die("Quran authentication returned no access token.")

          HEADERS = {
              "x-auth-token": access_token,
              "x-client-id": CLIENT_ID,
          }

          print("Quran Foundation authentication: SUCCESS")

          def clean_translation(value):
              value = html.unescape(value or "")
              value = re.sub(r"<sup[^>]*>.*?</sup>", "", value, flags=re.I | re.S)
              value = re.sub(r"<foot_note[^>]*>.*?</foot_note>", "", value, flags=re.I | re.S)
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"\s*/\s*", "\n", value)
              value = re.sub(r"[ \t]+", " ", value)
              value = re.sub(r" *\n *", "\n", value)
              return value.strip()

          def wrap_words(text, width=48):
              result = []
              for paragraph in text.split("\n"):
                  words = paragraph.split()
                  line = ""
                  for word in words:
                      candidate = word if not line else line + " " + word
                      if len(candidate) <= width:
                          line = candidate
                      else:
                          if line:
                              result.append(line)
                          line = word
                  if line:
                      result.append(line)
              return "\n".join(result)

          def chapters():
              data = qf_get("/content/api/v4/chapters", {"language": "en"})
              return sorted(data["chapters"], key=lambda x: int(x["id"]))

          def verses_for_chapter(chapter_id):
              all_verses = []
              page = 1
              while True:
                  data = qf_get(
                      f"/content/api/v4/verses/by_chapter/{chapter_id}",
                      {
                          "translations": "20",
                          "fields": (
                              "text_uthmani,verse_key,verse_number,"
                              "juz_number,hizb_number,ruku_number,page_number"
                          ),
                          "translation_fields": "resource_id,text",
                          "page": page,
                          "per_page": 50,
                      },
                  )
                  all_verses.extend(data.get("verses", []))
                  pagination = data.get("pagination", {})
                  next_page = pagination.get("next_page")
                  if not next_page:
                      break
                  page = int(next_page)
              return all_verses

          def load_progress():
              p = DATA / "progress.json"
              if not p.exists():
                  return {"cycle": 1, "used_verses": [], "sections": []}
              try:
                  value = json.loads(p.read_text(encoding="utf-8"))
                  value.setdefault("cycle", 1)
                  value.setdefault("used_verses", [])
                  value.setdefault("sections", [])
                  return value
              except Exception:
                  die("ERROR: data/progress.json is corrupt. Fix it before production.")

          def save_progress(value):
              (DATA / "progress.json").write_text(
                  json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          # We use Quran Foundation's ruku_number as the primary semantic boundary.
          # A ruku is kept together when possible; if it is too long, it is split
          # only at verse boundaries to keep a professional video length.
          def choose_section(verses, used):
              by_ruku = {}
              for verse in verses:
                  key = verse.get("ruku_number")
                  if key is None:
                      key = f"chapter-{verse['verse_key'].split(':')[0]}"
                  by_ruku.setdefault(key, []).append(verse)

              for ruku, group in by_ruku.items():
                  unused = [v for v in group if v["verse_key"] not in used]
                  if not unused:
                      continue

                  first = next(
                      i for i, v in enumerate(group)
                      if v["verse_key"] not in used
                  )
                  remaining = group[first:]

                  chosen = []
                  estimated_seconds = 0.0

                  for verse in remaining:
                      translation = next(
                          (
                              clean_translation(t.get("text"))
                              for t in verse.get("translations", [])
                              if str(t.get("resource_id")) == "20"
                          ),
                          "",
                      )

                      # Conservative duration estimate used only for grouping.
                      # Actual final duration comes from the real Saad audio.
                      word_count = len(
                          re.findall(r"\b[\w’'-]+\b", translation)
                      )
                      estimate = max(2.5, word_count * 0.34)

                      if chosen and estimated_seconds + estimate > 42:
                          break

                      chosen.append(verse)
                      estimated_seconds += estimate

                      if estimated_seconds >= 18:
                          break

                  if chosen:
                      return chosen

              return None

          # Pexels search: one video per meaningful section, never one per ayah.
          def visual_query(translation):
              t = translation.lower()
              rules = [
                  (("mercy", "merciful", "compassion", "forgive", "forgiveness"),
                   "peaceful dawn nature"),
                  (("guidance", "guided", "guide", "straight path"),
                   "quiet path through nature"),
                  (("creation", "created", "heavens", "earth", "stars", "moon", "sun"),
                   "beautiful sky landscape"),
                  (("rain", "water", "river", "garden", "gardens", "fruit"),
                   "rain lush nature"),
                  (("mountain", "mountains", "sea", "ocean"),
                   "mountains ocean landscape"),
                  (("patience", "patient", "steadfast"),
                   "calm flowing nature"),
                  (("prayer", "worship", "remember", "remembrance"),
                   "quiet peaceful landscape"),
                  (("gratitude", "grateful", "thankful", "thanks"),
                   "golden sunrise nature"),
                  (("paradise", "garden"),
                   "lush peaceful garden"),
                  (("warning", "punishment", "wrongdoers", "fear"),
                   "dramatic clouds landscape"),
              ]
              for words, query in rules:
                  if any(w in t for w in words):
                      return query
              return "peaceful cinematic nature landscape"

          def pexels_search(query):
              r = requests.get(
                  "https://api.pexels.com/v1/videos/search",
                  headers={"Authorization": PEXELS_KEY},
                  params={
                      "query": query,
                      "orientation": "portrait",
                      "size": "medium",
                      "per_page": 15,
                  },
                  timeout=45,
              )
              if not r.ok:
                  die(f"Pexels HTTP {r.status_code}: {r.text[:500]}")

              videos = r.json().get("videos", [])
              if not videos:
                  die(f"No portrait Pexels video found for: {query}")

              candidates = []
              for video in videos:
                  files = [
                      f for f in video.get("video_files", [])
                      if f.get("width") and f.get("height")
                  ]
                  portrait = [
                      f for f in files
                      if int(f["height"]) >= int(f["width"])
                  ]
                  files = portrait or files
                  if not files:
                      continue

                  best = max(
                      files,
                      key=lambda f: (
                          int(f.get("height", 0)) >= 1280,
                          int(f.get("width", 0)),
                          int(f.get("height", 0)),
                      ),
                  )

                  candidates.append((video, best))

              if not candidates:
                  die("Pexels returned no usable video files.")

              video, file = candidates[0]
              return {
                  "id": video.get("id"),
                  "page": video.get("url"),
                  "duration": video.get("duration"),
                  "width": file.get("width"),
                  "height": file.get("height"),
                  "video_url": file.get("link"),
                  "query": query,
              }

          def download(url, destination):
              with requests.get(url, stream=True, timeout=120) as r:
                  if not r.ok:
                      die(f"Download failed HTTP {r.status_code}: {url}")
                  with open(destination, "wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)

          def cmd(args):
              print("$", " ".join(map(str, args)))
              result = subprocess.run(args)
              if result.returncode:
                  die(f"Command failed with exit code {result.returncode}")

          def duration_seconds(path):
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return float(result.stdout.strip())

          def ass_time(seconds):
              total = int(round(seconds * 100))
              h = total // 360000
              total %= 360000
              m = total // 6000
              total %= 6000
              s = total // 100
              cs = total % 100
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          def ass_escape(value):
              return (
                  value.replace("\\", r"\\")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
              )

          progress = load_progress()
          used = set(progress["used_verses"])

          selected = None

          # Sequential full-Quran coverage. No manual surah or ayah input.
          for chapter in chapters():
              verses = verses_for_chapter(int(chapter["id"]))
              section = choose_section(verses, used)
              if section:
                  selected = (chapter, section)
                  break

          if not selected:
              progress["cycle"] = int(progress["cycle"]) + 1
              progress["used_verses"] = []
              progress["sections"] = []
              save_progress(progress)
              die(
                  "QURAN CYCLE COMPLETE. Progress reset for the next cycle. "
                  "Run the workflow again to begin cycle "
                  + str(progress["cycle"])
              )

          chapter, section = selected
          verse_keys = [v["verse_key"] for v in section]

          # Resolve Saheeh International translation once.
          translations = []
          for verse in section:
              text = next(
                  (
                      clean_translation(t.get("text"))
                      for t in verse.get("translations", [])
                      if str(t.get("resource_id")) == "20"
                  ),
                  "",
              )
              if not text:
                  die(f"Missing Saheeh International translation for {verse['verse_key']}")
              translations.append(text)

          translation_joined = " ".join(translations)
          query = visual_query(translation_joined)
          pexels = pexels_search(query)

          print("")
          print("============================================")
          print("REAL PRODUCTION SECTION")
          print("============================================")
          print("Cycle:", progress["cycle"])
          print("Surah:", chapter["id"], chapter["name_simple"])
          print("Verses:", ", ".join(verse_keys))
          print("Ruku:", section[0].get("ruku_number"))
          print("Visual:", query)
          print("Audio: Saad Al-Ghamdi / Murattal / Hafs")
          print("============================================")

          section_id = (
              f"cycle-{progress['cycle']}-"
              f"{verse_keys[0].replace(':','-')}-"
              f"{verse_keys[-1].replace(':','-')}"
          )
          section_dir = OUT / section_id
          section_dir.mkdir(parents=True, exist_ok=True)

          # IMPORTANT AUDIO DESIGN:
          # Quran Foundation chapter-reciter ID 13 is the correct Saad Al-Ghamdi
          # chapter reciter, but its live chapter endpoint can return no verse
          # timestamps. We therefore do NOT guess timestamps.
          #
          # Instead, use the verified Saad Al-Ghamdi ayah-by-ayah source from
          # EveryAyah and concatenate only the selected ayahs. This guarantees
          # the exact ayah boundaries and avoids the previous timestamp failure.
          #
          # The source path is the established Ghamadi_40kbps collection.
          # We keep the source URL in metadata for attribution/provenance.

          audio_files = []
          for verse in section:
              surah, ayah = verse["verse_key"].split(":")
              url = (
                  "https://everyayah.com/data/"
                  f"Ghamadi_40kbps/{int(surah):03d}{int(ayah):03d}.mp3"
              )
              local = section_dir / f"{surah}-{ayah}.mp3"
              print("Downloading Saad:", verse["verse_key"])
              download(url, local)
              audio_files.append((verse["verse_key"], local, url))

          concat_list = section_dir / "audio_concat.txt"
          concat_list.write_text(
              "".join(
                  f"file '{str(path.resolve()).replace(chr(39), chr(39)+chr(92)+chr(39)+chr(39))}'\n"
                  for _, path, _ in audio_files
              ),
              encoding="utf-8",
          )

          audio = section_dir / "saad-al-ghamdi-section.mp3"
          cmd([
              "ffmpeg", "-y",
              "-f", "concat", "-safe", "0",
              "-i", str(concat_list),
              "-c", "copy",
              str(audio),
          ])

          actual_duration = duration_seconds(audio)
          if actual_duration < 3:
              die("Audio is unexpectedly short.")

          background_source = section_dir / "pexels-source.mp4"
          download(pexels["video_url"], background_source)

          background = section_dir / "background.mp4"
          cmd([
              "ffmpeg", "-y",
              "-stream_loop", "-1",
              "-i", str(background_source),
              "-t", f"{actual_duration:.3f}",
              "-vf",
              (
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "fps=30,"
                  "format=yuv420p"
              ),
              "-an",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-movflags", "+faststart",
              str(background),
          ])

          # Determine exact subtitle timing from the actual ayah audio files.
          # This is measured from the same files used in the final audio, so
          # there is no API timestamp mismatch.
          timings = []
          cursor = 0.0
          for verse_key, path, _ in audio_files:
              d = duration_seconds(path)
              timings.append((verse_key, cursor, cursor + d))
              cursor += d

          ass = section_dir / "subtitles.ass"
          lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 2",
              "ScaledBorderAndShadow: yes",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Ref,Noto Sans,34,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,1,0,0,0,100,100,0,0,1,2,1,8,70,70,80,1",
              "Style: Arabic,Noto Naskh Arabic,72,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,0,0,0,0,100,100,0,0,1,3,1,5,90,90,215,1",
              "Style: English,Noto Sans,40,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,0,0,0,0,100,100,0,0,1,2,1,2,100,100,310,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for index, ((verse_key, start, end), verse, translation) in enumerate(
              zip(timings, section, translations)
          ):
              arabic = verse.get("text_uthmani", "").strip()
              english = wrap_words(translation, 45)

              lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Ref,,0,0,80,,"
                  f"VERSE {ass_escape(verse_key)}"
              )
              lines.append(
                  f"Dialogue: 1,{ass_time(start)},{ass_time(end)},Arabic,,0,0,215,,"
                  f"{ass_escape(arabic)}"
              )
              lines.append(
                  f"Dialogue: 2,{ass_time(start)},{ass_time(end)},English,,0,0,310,,"
                  f"{ass_escape(english)}"
              )

          ass.write_text("\n".join(lines) + "\n", encoding="utf-8")

          final_video = section_dir / "quran-section.mp4"
          cmd([
              "ffmpeg", "-y",
              "-i", str(background),
              "-i", str(audio),
              "-vf",
              f"subtitles={ass}:fontsdir=/usr/share/fonts/truetype/noto",
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-pix_fmt", "yuv420p",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ])

          # Hard quality gates.
          if not final_video.exists() or final_video.stat().st_size < 10000:
              die("QUALITY CHECK FAILED: final video missing or too small.")

          result = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries",
                  "stream=codec_name,width,height",
                  "-of", "json",
                  str(final_video),
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          streams = json.loads(result.stdout).get("streams", [])
          video_stream = next((s for s in streams if s.get("codec_name")), None)

          if not video_stream:
              die("QUALITY CHECK FAILED: no video stream.")
          if int(video_stream.get("width", 0)) != 1080:
              die("QUALITY CHECK FAILED: width is not 1080.")
          if int(video_stream.get("height", 0)) != 1920:
              die("QUALITY CHECK FAILED: height is not 1920.")

          metadata = {
              "cycle": progress["cycle"],
              "chapter": int(chapter["id"]),
              "chapter_name": chapter["name_simple"],
              "verse_keys": verse_keys,
              "ruku_number": section[0].get("ruku_number"),
              "audio_reciter": "Saad Al-Ghamdi",
              "audio_style": "Murattal",
              "audio_riwayah": "Hafs",
              "audio_source": "EveryAyah / Ghamadi_40kbps",
              "audio_source_urls": [u for _, _, u in audio_files],
              "translation_resource_id": 20,
              "visual_provider": "Pexels",
              "visual_query": query,
              "pexels": pexels,
              "duration_seconds": round(actual_duration, 3),
          }

          (section_dir / "metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (section_dir / "translation.txt").write_text(
              wrap_words(translation_joined) + "\n",
              encoding="utf-8",
          )

          # Only mark verses complete AFTER the final video passes quality checks.
          progress["used_verses"].extend(verse_keys)
          progress["used_verses"] = list(dict.fromkeys(progress["used_verses"]))
          progress["sections"].append(metadata)
          save_progress(progress)

          print("")
          print("============================================")
          print("PRODUCTION SECTION: PASSED")
          print("Video:", final_video)
          print("Verses:", ", ".join(verse_keys))
          print("Duration:", round(actual_duration, 2), "seconds")
          print("============================================")
          PY

      - name: Verify final MP4
        run: |
          VIDEO="$(find output/production -name 'quran-section.mp4' -type f | head -n 1)"
          test -n "$VIDEO"

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-section
          path: output/production/
          retention-days: 7

      - name: Commit production progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git diff --cached --quiet || git commit -m "Track Quran production progress"
          git push
