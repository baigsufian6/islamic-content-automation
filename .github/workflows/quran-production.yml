name: Quran Production Pipeline

on:
  # Emergency/manual trigger. This has NO inputs:
  # Surah, ayah, section count, reciter, and visual are all selected automatically.
  workflow_dispatch:

  # Fully automatic production: one new Quran video section per day.
  # GitHub cron uses UTC.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

# Never allow two production runs to consume the same Quran progress
# at the same time.
concurrency:
  group: quran-production
  cancel-in-progress: false

jobs:
  production:
    name: Produce next Quran section automatically
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ffmpeg             fonts-noto-core             fonts-noto-extra

          fc-cache -f

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Arabic fonts:"
          fc-list | grep -Ei 'Noto Naskh Arabic|Noto Sans Arabic|Noto Kufi Arabic' | head -n 10 || true

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check             requests             pillow

      - name: Validate production worker
        shell: bash
        run: |
          set -euo pipefail

          test -f production/quran_worker_wow.py
          python -m py_compile production/quran_worker_wow.py

          echo "Production worker syntax check passed."
          echo "No manual Surah/ayah/section parameters are being supplied."

      - name: Validate required secrets
        shell: bash
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$QF_CLIENT_ID" || {
            echo "ERROR: QF_CLIENT_ID secret is missing."
            exit 1
          }

          test -n "$QF_CLIENT_SECRET" || {
            echo "ERROR: QF_CLIENT_SECRET secret is missing."
            exit 1
          }

          test -n "$PEXELS_API_KEY" || {
            echo "ERROR: PEXELS_API_KEY secret is missing."
            exit 1
          }

          echo "Required production secrets are present."

      - name: Prepare production directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p             data             publish             .cache/quran             .cache/audio             .cache/visuals

          if [ ! -f data/progress.json ]; then
            printf '%s\n' '{}' > data/progress.json
          fi

          echo "Production directories ready."

      - name: Run production brain
        shell: bash
        env:
          # Quran Foundation
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production

          # Visual provider
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Production behaviour
          COMMIT_PROGRESS: "1"
          ALLOW_VISUAL_REUSE: "0"

          # Passage duration is selected automatically inside the worker.
          QURAN_TARGET_MIN: "35"
          QURAN_TARGET_MAX: "65"

          # Cycle behaviour
          QURAN_AUTO_CYCLE: "1"
          QURAN_AUTO_SELECT: "1"

          # Audio
          QURAN_RECITER: "Saad Al-Ghamdi"

          # Translation / presentation
          QURAN_TRANSLATION_RESOURCE_ID: "20"

          # Rendering
          QURAN_WIDTH: "1080"
          QURAN_HEIGHT: "1920"
          QURAN_FPS: "30"

          # Keep logs useful without making Actions unreadable.
          QURAN_LOG_LEVEL: "INFO"

        run: |
          set -euo pipefail

          echo "Starting automatic Quran production..."
          echo "The worker will determine the next unconsumed passage."
          echo "No Surah, ayah, section count, visual, or reciter is supplied manually."

          python production/quran_worker_wow.py

      - name: Verify final production output
        shell: bash
        run: |
          set -euo pipefail

          test -d publish

          shopt -s nullglob
          videos=(publish/*.mp4)
          metadata=(publish/*.json)

          if [ "${#videos[@]}" -lt 1 ]; then
            echo "ERROR: No final MP4 was produced."
            exit 1
          fi

          if [ "${#metadata[@]}" -lt 1 ]; then
            echo "ERROR: No production metadata was produced."
            exit 1
          fi

          echo "Final videos: ${#videos[@]}"
          echo "Metadata files: ${#metadata[@]}"

          for video in "${videos[@]}"; do
            echo
            echo "=== $video ==="
            ffprobe -v error               -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate               -show_entries format=duration               -of default=noprint_wrappers=1               "$video"
          done

          echo
          echo "Production output verification passed."

      - name: Upload final video and metadata
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-${{ github.run_number }}
          path: |
            publish/*.mp4
            publish/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload production state for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-production-state-${{ github.run_number }}
          path: |
            data/progress.json
            data/quran_index.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Final status
        shell: bash
        run: |
          echo "=========================================="
          echo "QURAN PRODUCTION COMPLETED"
          echo "=========================================="
          echo "Run: ${{ github.run_number }}"
          echo "The next run will continue from saved Quran progress."
          echo "No manual verse/section selection was used."
