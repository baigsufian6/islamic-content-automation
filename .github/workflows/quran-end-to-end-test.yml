name: Quran End-to-End Render Test

on:
  workflow_dispatch:

jobs:
  quran-end-to-end:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet requests

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          fc-match "Noto Naskh Arabic"

      - name: Fetch real Quran pipeline input
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import json
          import requests

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()

          if not client_id or not client_secret:
              print("ERROR: Quran Foundation credentials are missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          token_response = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not token_response.ok:
              print(
                  f"Authentication failed: HTTP "
                  f"{token_response.status_code}"
              )
              sys.exit(1)

          token_data = token_response.json()
          access_token = token_data.get("access_token")

          if not access_token:
              print("ERROR: No access token returned.")
              sys.exit(1)

          print("Authentication: SUCCESS")

          response = requests.get(
              f"{api_base}/content/api/v4/verses/by_key/1:1",
              params={
                  "translations": "20",
                  "fields": "text_uthmani",
              },
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": client_id,
              },
              timeout=30,
          )

          print(f"Quran API request: HTTP {response.status_code}")

          if not response.ok:
              print("ERROR: Quran API request failed.")
              print(response.text[:500])
              sys.exit(1)

          data = response.json()
          verse = data.get("verse")

          if not isinstance(verse, dict):
              print("ERROR: No verse object returned.")
              sys.exit(1)

          verse_key = verse.get("verse_key")
          arabic_text = verse.get("text_uthmani")
          translations = verse.get("translations", [])

          if verse_key != "1:1":
              print(f"ERROR: Expected verse 1:1, got {verse_key}")
              sys.exit(1)

          if not isinstance(arabic_text, str) or not arabic_text.strip():
              print("ERROR: Arabic Quran text was not returned.")
              sys.exit(1)

          selected_translation = None

          for translation in translations:
              if str(translation.get("resource_id")) == "20":
                  selected_translation = translation
                  break

          if selected_translation is None:
              print("ERROR: Translation resource 20 was not returned.")
              sys.exit(1)

          english_text = selected_translation.get("text")

          if not isinstance(english_text, str) or not english_text.strip():
              print("ERROR: Translation 20 contains no usable text.")
              sys.exit(1)

          pipeline_input = {
              "verse_key": verse_key,
              "arabic_text": arabic_text,
              "translation": {
                  "resource_id": 20,
                  "text": english_text,
              },
          }

          os.makedirs("output", exist_ok=True)

          with open(
              "output/quran-pipeline-input.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  pipeline_input,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("QURAN PIPELINE INPUT: CREATED")
          print(f"Verse: {verse_key}")
          print("Arabic text: received")
          print("Saheeh International resource: 20")
          print("Translation text: received")
          print("Credentials: NOT written to pipeline file")
          PY

      - name: Convert pipeline input to subtitles
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          input_path = Path("output/quran-pipeline-input.json")
          data = json.loads(input_path.read_text(encoding="utf-8"))

          verse_key = data["verse_key"]
          arabic = data["arabic_text"].strip()
          resource_id = data["translation"]["resource_id"]
          translation = data["translation"]["text"].strip()

          if resource_id != 20:
              raise SystemExit(
                  f"ERROR: Expected translation resource 20, got {resource_id}"
              )

          if not arabic:
              raise SystemExit("ERROR: Arabic text is empty")

          if not translation:
              raise SystemExit("ERROR: Translation text is empty")

          # Remove Quran.Foundation footnote HTML.
          translation = re.sub(
              r"<sup\b[^>]*>.*?</sup>",
              "",
              translation,
              flags=re.IGNORECASE | re.DOTALL,
          )

          # Remove any remaining HTML markup.
          translation = re.sub(r"<[^>]+>", "", translation).strip()

          if not translation:
              raise SystemExit(
                  "ERROR: Translation is empty after HTML cleanup"
              )

          ass = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Reference,Noto Sans,46,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,3,1,8,80,80,140,1
          Style: Arabic,Noto Naskh Arabic,82,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,80,80,0,1
          Style: English,Noto Sans,48,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,100,100,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:08.00,Reference,,0,0,140,,VERSE {verse_key}
          Dialogue: 0,0:00:00.00,0:00:08.00,Arabic,,0,0,0,,{arabic}
          Dialogue: 0,0:00:00.00,0:00:08.00,English,,0,0,0,,{translation}
          """

          Path("output/quran-render.ass").write_text(
              ass,
              encoding="utf-8"
          )

          print("Subtitle generation: SUCCESS")
          print(f"Verse: {verse_key}")
          print(f"Translation resource: {resource_id}")
          print("Arabic subtitle: created")
          print("English subtitle: created")
          PY

      - name: Create render background
        run: |
          ffmpeg \
            -y \
            -f lavfi \
            -i "testsrc2=size=1080x1920:rate=30" \
            -t 8 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/background.mp4

      - name: Render Quran video
        run: |
          ffmpeg \
            -y \
            -i output/background.mp4 \
            -vf "subtitles=output/quran-render.ass:fontsdir=/usr/share/fonts/truetype/noto" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/quran-end-to-end-test.mp4

      - name: Verify final video
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/quran-end-to-end-test.mp4

      - name: Upload end-to-end test
        uses: actions/upload-artifact@v4
        with:
          name: quran-end-to-end-test
          path: |
            output/quran-pipeline-input.json
            output/quran-render.ass
            output/quran-end-to-end-test.mp4
          retention-days: 1
