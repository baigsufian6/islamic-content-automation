name: Quran Translation Multi Test

on:
  workflow_dispatch:

jobs:
  translation-multi-test:
    runs-on: ubuntu-latest

    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --quiet requests

      - name: Verify Saheeh International across multiple verses
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()

          if not client_id or not client_secret:
              print("ERROR: Quran Foundation credentials are missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          # --------------------------------------------------
          # 1. Authenticate
          # --------------------------------------------------
          token_response = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not token_response.ok:
              print(f"Authentication failed: HTTP {token_response.status_code}")
              sys.exit(1)

          token_data = token_response.json()
          access_token = token_data.get("access_token")

          if not access_token:
              print("ERROR: No access token returned.")
              sys.exit(1)

          print("Authentication: SUCCESS")

          # --------------------------------------------------
          # 2. Request Surah Al-Fatihah with translation 20
          # --------------------------------------------------
          response = requests.get(
              f"{api_base}/content/api/v4/verses/by_chapter/1",
              params={
                  "translations": "20",
              },
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": client_id,
              },
              timeout=30,
          )

          print(f"Translation API request: HTTP {response.status_code}")

          if not response.ok:
              print("ERROR: Translation request failed.")
              print(response.text[:500])
              sys.exit(1)

          data = response.json()
          verses = data.get("verses")

          if not isinstance(verses, list) or not verses:
              print("ERROR: No verses returned.")
              sys.exit(1)

          # --------------------------------------------------
          # 3. Verify several verses contain resource 20
          # --------------------------------------------------
          expected_keys = ["1:1", "1:2", "1:3", "1:4", "1:5"]

          by_key = {
              str(v.get("verse_key")): v
              for v in verses
          }

          for verse_key in expected_keys:
              verse = by_key.get(verse_key)

              if not verse:
                  print(f"ERROR: Verse {verse_key} was not returned.")
                  sys.exit(1)

              translations = verse.get("translations")

              if not isinstance(translations, list):
                  print(f"ERROR: No translations array for {verse_key}.")
                  sys.exit(1)

              selected = None

              for translation in translations:
                  if str(translation.get("resource_id")) == "20":
                      selected = translation
                      break

              if selected is None:
                  print(
                      f"ERROR: Translation resource 20 missing for {verse_key}."
                  )
                  sys.exit(1)

              text = selected.get("text")

              if not isinstance(text, str) or not text.strip():
                  print(
                      f"ERROR: Translation text missing for {verse_key}."
                  )
                  sys.exit(1)

              print(
                  f"PASS {verse_key} | "
                  f"resource=20 | "
                  f"text received=yes"
              )

          print("")
          print("SAHEEH INTERNATIONAL MULTI-VERSE TEST: PASSED")
          print(f"Verified verses: {', '.join(expected_keys)}")
          print("Translation resource: 20")
          PY
