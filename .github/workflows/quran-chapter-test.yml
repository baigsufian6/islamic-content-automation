name: Quran Chapter Retrieval Test

on:
  workflow_dispatch:

jobs:
  chapter-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Retrieve Surah Al-Fatihah
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          AUTH_URL = "https://oauth2.quran.foundation"
          API_URL = "https://apis.quran.foundation"

          # -------------------------------------------------
          # 1. Authenticate
          # -------------------------------------------------

          token_response = requests.post(
              f"{AUTH_URL}/oauth2/token",
              auth=HTTPBasicAuth(
                  os.environ["QF_CLIENT_ID"],
                  os.environ["QF_CLIENT_SECRET"],
              ),
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              timeout=30,
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          print("Authentication: SUCCESS")

          # -------------------------------------------------
          # 2. Retrieve ONE chapter
          # -------------------------------------------------

          response = requests.get(
              f"{API_URL}/content/api/v4/chapters/1",
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": os.environ["QF_CLIENT_ID"],
              },
              timeout=30,
          )

          response.raise_for_status()

          data = response.json()

          print("Chapter request: SUCCESS")
          print("Chapter ID:", data.get("chapter", {}).get("id"))
          print(
              "Chapter name:",
              data.get("chapter", {}).get("name_simple")
          )

          print()
          print("QURAN CHAPTER RETRIEVAL TEST: PASSED")
          PY
