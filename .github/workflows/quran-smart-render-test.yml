name: Quran Smart Render Test

on:
  workflow_dispatch:

jobs:
  smart-render-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig
          python3 -m pip install --quiet requests

          echo "Arabic font:"
          fc-match "Noto Naskh Arabic"

          echo "English font:"
          fc-match "Noto Sans"

      - name: Fetch Quran verse and choose visual theme
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import json
          import re
          import html
          import requests

          VERSE_KEY = "1:1"
          TRANSLATION_ID = "20"

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()
          pexels_key = os.environ.get("PEXELS_API_KEY")

          if not client_id or not client_secret:
              print("ERROR: Quran credentials are missing.")
              sys.exit(1)

          if not pexels_key:
              print("ERROR: PEXELS_API_KEY is missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          # --------------------------------------------------
          # 1. Quran authentication
          # --------------------------------------------------

          token_response = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not token_response.ok:
              print(
                  f"ERROR: Quran authentication failed: "
                  f"HTTP {token_response.status_code}"
              )
              sys.exit(1)

          access_token = token_response.json().get("access_token")

          if not access_token:
              print("ERROR: No Quran access token returned.")
              sys.exit(1)

          print("Quran authentication: SUCCESS")

          # --------------------------------------------------
          # 2. Fetch real verse
          # --------------------------------------------------

          response = requests.get(
              f"{api_base}/content/api/v4/verses/by_key/{VERSE_KEY}",
              params={
                  "translations": TRANSLATION_ID,
                  "fields": "text_uthmani",
              },
              headers={
                  "x-auth-token": access_token,
                  "x-client-id": client_id,
              },
              timeout=30,
          )

          print(f"Quran API request: HTTP {response.status_code}")

          if not response.ok:
              print("ERROR: Quran API request failed.")
              sys.exit(1)

          verse = response.json().get("verse")

          if not isinstance(verse, dict):
              print("ERROR: Verse object missing.")
              sys.exit(1)

          arabic_text = verse.get("text_uthmani")

          if not isinstance(arabic_text, str) or not arabic_text.strip():
              print("ERROR: Arabic text missing.")
              sys.exit(1)

          translations = verse.get("translations", [])

          translation = None

          for item in translations:
              if str(item.get("resource_id")) == TRANSLATION_ID:
                  translation = item
                  break

          if translation is None:
              print("ERROR: Translation resource 20 missing.")
              sys.exit(1)

          english_text = translation.get("text")

          if not isinstance(english_text, str):
              print("ERROR: Translation text missing.")
              sys.exit(1)

          # Remove Quran API HTML footnote markup.
          english_text = re.sub(
              r"<[^>]+>",
              "",
              english_text
          )

          english_text = html.unescape(english_text).strip()

          if not english_text:
              print("ERROR: Translation text is empty.")
              sys.exit(1)

          print(f"Verse: {VERSE_KEY}")
          print("Arabic text: received")
          print("Saheeh International: received")
          print(f"Translation length: {len(english_text)} characters")

          # --------------------------------------------------
          # 3. Determine a safe visual theme.
          #
          # This is intentionally conservative.
          # Sacred figures and religious scenes are NEVER
          # searched for.
          # --------------------------------------------------

          text = english_text.lower()

          if any(
              word in text
              for word in [
                  "merciful",
                  "mercy",
                  "compassion",
                  "forgiv",
                  "kind",
                  "gracious",
              ]
          ):
              theme = "mercy_and_compassion"
              search_query = "peaceful nature dawn soft light landscape"

          elif any(
              word in text
              for word in [
                  "garden",
                  "gardens",
                  "river",
                  "rivers",
                  "fruit",
                  "green",
              ]
          ):
              theme = "nature_and_gardens"
              search_query = "lush green garden nature water peaceful"

          elif any(
              word in text
              for word in [
                  "night",
                  "moon",
                  "stars",
                  "darkness",
              ]
          ):
              theme = "night_and_reflection"
              search_query = "peaceful night sky stars landscape"

          elif any(
              word in text
              for word in [
                  "rain",
                  "rainfall",
                  "cloud",
                  "clouds",
                  "water",
              ]
          ):
              theme = "rain_and_water"
              search_query = "rain water nature peaceful cinematic"

          elif any(
              word in text
              for word in [
                  "mountain",
                  "mountains",
                  "earth",
                  "sky",
                  "creation",
              ]
          ):
              theme = "creation_and_nature"
              search_query = "mountains sky nature cinematic peaceful"

          else:
              theme = "peaceful_nature"
              search_query = "peaceful natural landscape dawn cinematic"

          print(f"Visual theme: {theme}")
          print(f"Visual search: {search_query}")

          # --------------------------------------------------
          # 4. Search Pexels
          # --------------------------------------------------

          pexels = requests.get(
              "https://api.pexels.com/v1/videos/search",
              headers={
                  "Authorization": pexels_key
              },
              params={
                  "query": search_query,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 10,
              },
              timeout=30,
          )

          print(f"Pexels API request: HTTP {pexels.status_code}")

          if not pexels.ok:
              print("ERROR: Pexels request failed.")
              sys.exit(1)

          videos = pexels.json().get("videos", [])

          if not videos:
              print("ERROR: No Pexels videos returned.")
              sys.exit(1)

          selected_video = None
          selected_file = None

          for video in videos:
              files = video.get("video_files", [])

              mp4_files = [
                  f for f in files
                  if f.get("file_type") == "video/mp4"
                  and f.get("width")
                  and f.get("height")
              ]

              portrait = [
                  f for f in mp4_files
                  if f["height"] >= f["width"]
              ]

              if portrait:
                  selected_video = video
                  selected_file = max(
                      portrait,
                      key=lambda f: f["width"] * f["height"]
                  )
                  break

          if selected_video is None:
              print("ERROR: No portrait Pexels video found.")
              sys.exit(1)

          download_url = selected_file.get("link")

          if not download_url:
              print("ERROR: Pexels video has no download URL.")
              sys.exit(1)

          os.makedirs("output", exist_ok=True)

          download = requests.get(
              download_url,
              stream=True,
              timeout=60,
          )

          if not download.ok:
              print("ERROR: Could not download background.")
              sys.exit(1)

          with open("output/background.mp4", "wb") as f:
              for chunk in download.iter_content(
                  chunk_size=1024 * 1024
              ):
                  if chunk:
                      f.write(chunk)

          if os.path.getsize("output/background.mp4") < 10000:
              print("ERROR: Background video is unexpectedly small.")
              sys.exit(1)

          print(f"Pexels video ID: {selected_video.get('id')}")
          print("Pexels background: DOWNLOADED")

          # --------------------------------------------------
          # 5. Save safe pipeline data
          # --------------------------------------------------

          pipeline = {
              "verse_key": VERSE_KEY,
              "translation_resource_id": 20,
              "arabic_text": arabic_text,
              "translation_text": english_text,
              "visual_theme": theme,
              "visual_search": search_query,
              "pexels_video_id": selected_video.get("id"),
              "pexels_url": selected_video.get("url"),
          }

          with open(
              "output/pipeline.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  pipeline,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Pipeline data: CREATED")
          PY

      - name: Build smart subtitles
        run: |
          python3 - <<'PY'
          import json
          import textwrap

          with open(
              "output/pipeline.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          arabic = data["arabic_text"].strip()
          english = data["translation_text"].strip()

          # --------------------------------------------------
          # English typography
          #
          # We deliberately keep the text block narrow enough
          # for portrait video.
          # --------------------------------------------------

          english_length = len(english)

          if english_length <= 90:
              english_size = 48
              width = 48

          elif english_length <= 140:
              english_size = 44
              width = 44

          elif english_length <= 190:
              english_size = 40
              width = 40

          elif english_length <= 250:
              english_size = 36
              width = 36

          else:
              english_size = 32
              width = 32

          # Wrap at words rather than cutting words.
          english_lines = textwrap.wrap(
              english,
              width=width,
              break_long_words=False,
              break_on_hyphens=False,
          )

          # Hard safety limit.
          if len(english_lines) > 5:
              print(
                  "ERROR: Translation requires more than "
                  "5 lines even at the safe font size."
              )
              raise SystemExit(1)

          english_display = r"\N".join(english_lines)

          # --------------------------------------------------
          # Arabic
          #
          # Arabic is kept larger and centered.
          # Noto Naskh Arabic gives a much more Quran-like
          # presentation than the generic fallback font.
          # --------------------------------------------------

          arabic_size = 86

          if len(arabic) > 70:
              arabic_size = 78

          if len(arabic) > 100:
              arabic_size = 72

          # --------------------------------------------------
          # ASS subtitle file
          # --------------------------------------------------

          with open(
              "output/quran.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
              """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding

          Style: Reference,Noto Sans,40,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,1,0,0,0,100,100,0,0,1,3,2,8,70,70,125,1

          Style: Arabic,Noto Naskh Arabic,86,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,0,0,0,0,100,100,0,0,1,3,2,5,70,70,0,1

          Style: English,Noto Sans,""" + str(english_size) + """,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,0,0,0,0,100,100,0,0,1,3,2,5,100,100,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          """
              )

              f.write(
                  f"Dialogue: 0,0:00:00.00,0:00:08.00,Reference,,0,0,125,,VERSE {data['verse_key']}\n"
              )

              f.write(
                  f"Dialogue: 0,0:00:00.00,0:00:08.00,Arabic,,0,0,0,,{arabic}\n"
              )

              f.write(
                  f"Dialogue: 0,0:00:00.00,0:00:08.00,English,,0,0,0,,{english_display}\n"
              )

          print(f"English characters: {english_length}")
          print(f"English font size: {english_size}")
          print(f"English lines: {len(english_lines)}")
          print(f"Arabic font size: {arabic_size}")
          print("Smart subtitles: CREATED")
          PY

      - name: Render smart Quran video
        run: |
          ffmpeg \
            -y \
            -stream_loop -1 \
            -i output/background.mp4 \
            -t 8 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=output/quran.ass:fontsdir=/usr/share/fonts/truetype/noto" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/quran-smart-render.mp4

      - name: Verify final render
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/quran-smart-render.mp4

          test -s output/quran-smart-render.mp4

          echo "STEP 33: SMART RENDER PASSED"

      - name: Upload smart render
        uses: actions/upload-artifact@v4
        with:
          name: quran-smart-render
          path: |
            output/quran-smart-render.mp4
            output/pipeline.json
            output/quran.ass
          retention-days: 1
