name: Quran Audio Test

on:
  workflow_dispatch:
    inputs:
      verse_key:
        description: "Quran verse to test, e.g. 1:1"
        required: true
        default: "1:1"

jobs:
  audio-section:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet requests


      # ============================================================
      # 3. AUTHENTICATE
      # ============================================================

      - name: Authenticate with Quran Foundation
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ secrets.QF_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ.get("QF_CLIENT_ID")
          client_secret = os.environ.get("QF_CLIENT_SECRET")
          qf_env = os.environ.get("QF_ENV", "").lower()

          if not client_id:
              print("ERROR: QF_CLIENT_ID is missing.")
              sys.exit(1)

          if not client_secret:
              print("ERROR: QF_CLIENT_SECRET is missing.")
              sys.exit(1)

          if qf_env == "production":
              oauth_base = "https://oauth2.quran.foundation"
              api_base = "https://apis.quran.foundation"
          elif qf_env == "prelive":
              oauth_base = "https://prelive-oauth2.quran.foundation"
              api_base = "https://apis-prelive.quran.foundation"
          else:
              print("ERROR: QF_ENV must be production or prelive.")
              sys.exit(1)

          response = requests.post(
              f"{oauth_base}/oauth2/token",
              data={
                  "grant_type": "client_credentials",
                  "scope": "content",
              },
              auth=(client_id, client_secret),
              timeout=30,
          )

          if not response.ok:
              print(
                  f"ERROR: Authentication failed: "
                  f"HTTP {response.status_code}"
              )
              sys.exit(1)

          data = response.json()

          token = data.get("access_token")

          if not token:
              print("ERROR: Authentication succeeded but no token returned.")
              sys.exit(1)

          os.makedirs("output", exist_ok=True)

          with open(
              "output/auth.env",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(f"QF_API_BASE={api_base}\n")
              f.write(f"QF_ACCESS_TOKEN={token}\n")

          print("Authentication: SUCCESS")
          print(f"Environment: {qf_env}")
          PY


      # ============================================================
      # 4. DISCOVER SAAD AL-GHAMDI
      #
      # IMPORTANT:
      # We intentionally do NOT hard-code his reciter ID.
      #
      # Quran Foundation distinguishes chapter-reciter IDs from
      # ayah-by-ayah recitation IDs.
      #
      # We use the chapter-reciter catalog because it provides
      # chapter audio and verse timestamps.
      # ============================================================

      - name: Discover Saad Al-Ghamdi
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
        run: |
          set -euo pipefail

          source output/auth.env

          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          api_base = os.environ["QF_API_BASE"]
          token = os.environ["QF_ACCESS_TOKEN"]
          client_id = os.environ["QF_CLIENT_ID"]

          headers = {
              "x-auth-token": token,
              "x-client-id": client_id,
          }

          response = requests.get(
              f"{api_base}/content/api/v4/resources/chapter_reciters",
              params={
                  "language": "en",
              },
              headers=headers,
              timeout=30,
          )

          print(
              f"Chapter-reciter catalog request: "
              f"HTTP {response.status_code}"
          )

          if not response.ok:
              print("ERROR: Could not retrieve chapter-reciter catalog.")
              print(response.text[:1000])
              sys.exit(1)

          data = response.json()

          reciters = data.get("reciters", [])

          if not reciters:
              print("ERROR: Chapter-reciter catalog is empty.")
              sys.exit(1)

          print(
              f"Chapter reciters returned: {len(reciters)}"
          )

          matches = []

          for reciter in reciters:

              name = str(
                  reciter.get("name") or ""
              )

              translated = reciter.get(
                  "translated_name"
              )

              translated_name = ""

              if isinstance(translated, dict):
                  translated_name = str(
                      translated.get("name") or ""
                  )

              searchable = (
                  f"{name} {translated_name}"
              ).lower()

              if (
                  "saad" in searchable
                  and "ghamdi" in searchable
              ):
                  matches.append(reciter)

          print("")
          print("Saad Al-Ghamdi matches:")

          if not matches:
              print(
                  "ERROR: Saad Al-Ghamdi was not found "
                  "in the live chapter-reciter catalog."
              )

              print("")
              print("Possible Saad/Ghamdi records:")

              for reciter in reciters:
                  text = json.dumps(
                      reciter,
                      ensure_ascii=False,
                  ).lower()

                  if (
                      "saad" in text
                      or "ghamdi" in text
                      or "الغامدي" in text
                      or "سعد" in text
                  ):
                      print(
                          json.dumps(
                              reciter,
                              ensure_ascii=False,
                          )
                      )

              sys.exit(1)

          if len(matches) > 1:
              print(
                  "Multiple Saad Al-Ghamdi records found."
              )

              for item in matches:
                  print(
                      f"id={item.get('id')} | "
                      f"name={item.get('name')} | "
                      f"style={item.get('style')} | "
                      f"qirat={item.get('qirat')}"
                  )

              print("")
              print(
                  "ERROR: More than one matching "
                  "reciter exists. Refusing to guess."
              )

              sys.exit(1)

          selected = matches[0]

          reciter_id = selected.get("id")

          if not reciter_id:
              print("ERROR: Matching reciter has no ID.")
              sys.exit(1)

          print(
              f"Selected reciter: {selected.get('name')}"
          )
          print(
              f"Reciter ID: {reciter_id}"
          )
          print(
              f"Style: {selected.get('style')}"
          )
          print(
              f"Qiraat: {selected.get('qirat')}"
          )

          with open(
              "output/reciter.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          with open(
              "output/reciter.env",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(
                  f"QF_RECITER_ID={reciter_id}\n"
              )

          print("")
          print("Saad Al-Ghamdi discovery: PASSED")
          PY


      # ============================================================
      # 5. PARSE VERSE KEY
      # ============================================================

      - name: Determine chapter and verse
        run: |
          set -euo pipefail

          VERSE_KEY="${{ inputs.verse_key }}"

          if [[ ! "$VERSE_KEY" =~ ^[0-9]+:[0-9]+$ ]]; then
            echo "ERROR: Invalid verse key: $VERSE_KEY"
            echo "Expected format such as 1:1"
            exit 1
          fi

          CHAPTER="${VERSE_KEY%%:*}"
          VERSE="${VERSE_KEY##*:}"

          if (( CHAPTER < 1 || CHAPTER > 114 )); then
            echo "ERROR: Chapter must be between 1 and 114."
            exit 1
          fi

          if (( VERSE < 1 )); then
            echo "ERROR: Verse number must be >= 1."
            exit 1
          fi

          echo "VERSE_KEY=$VERSE_KEY" >> "$GITHUB_ENV"
          echo "CHAPTER=$CHAPTER" >> "$GITHUB_ENV"
          echo "VERSE=$VERSE" >> "$GITHUB_ENV"

          echo "Requested verse: $VERSE_KEY"
          echo "Chapter: $CHAPTER"
          echo "Verse: $VERSE"


      # ============================================================
      # 6. FETCH CHAPTER AUDIO + VERSE TIMESTAMPS
      #
      # This is the important change.
      #
      # We do NOT try to guess an ayah-by-ayah recitation ID.
      #
      # We fetch the chapter audio and timestamp information, then
      # extract the exact requested ayah.
      # ============================================================

      - name: Fetch Saad Al-Ghamdi chapter audio metadata
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
        run: |
          set -euo pipefail

          source output/auth.env
          source output/reciter.env

          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          api_base = os.environ["QF_API_BASE"]
          token = os.environ["QF_ACCESS_TOKEN"]
          client_id = os.environ["QF_CLIENT_ID"]

          reciter_id = os.environ["QF_RECITER_ID"]
          chapter = os.environ["CHAPTER"]

          headers = {
              "x-auth-token": token,
              "x-client-id": client_id,
          }

          url = (
              f"{api_base}/content/api/v4/"
              f"chapter_recitations/"
              f"{reciter_id}/"
              f"{chapter}"
          )

          response = requests.get(
              url,
              params={
                  "segments": "true",
              },
              headers=headers,
              timeout=30,
          )

          print(
              f"Chapter audio metadata request: "
              f"HTTP {response.status_code}"
          )

          if not response.ok:
              print(
                  "ERROR: Chapter audio metadata request failed."
              )
              print(response.text[:1000])
              sys.exit(1)

          data = response.json()

          audio_file = data.get("audio_file")

          if not isinstance(audio_file, dict):
              print(
                  "ERROR: No audio_file object returned."
              )
              sys.exit(1)

          audio_url = audio_file.get(
              "audio_url"
          )

          timestamps = audio_file.get(
              "timestamps"
          )

          if not audio_url:
              print(
                  "ERROR: No chapter audio URL returned."
              )
              sys.exit(1)

          if not isinstance(timestamps, list):
              print(
                  "ERROR: No verse timestamps returned."
              )
              sys.exit(1)

          requested_key = os.environ["VERSE_KEY"]

          target = None

          for item in timestamps:

              if str(
                  item.get("verse_key")
              ) == requested_key:
                  target = item
                  break

          if target is None:
              print(
                  f"ERROR: Verse {requested_key} "
                  "was not found in audio timestamps."
              )
              sys.exit(1)

          start_ms = target.get(
              "timestamp_from"
          )

          end_ms = target.get(
              "timestamp_to"
          )

          if start_ms is None or end_ms is None:
              print(
                  "ERROR: Verse timing is incomplete."
              )
              print(
                  json.dumps(
                      target,
                      ensure_ascii=False,
                  )
              )
              sys.exit(1)

          start_ms = int(start_ms)
          end_ms = int(end_ms)

          if end_ms <= start_ms:
              print(
                  "ERROR: Invalid verse timing."
              )
              sys.exit(1)

          metadata = {
              "verse_key": requested_key,
              "reciter_id": int(reciter_id),
              "chapter": int(chapter),
              "chapter_audio_url": audio_url,
              "start_ms": start_ms,
              "end_ms": end_ms,
              "duration_ms": end_ms - start_ms,
          }

          with open(
              "output/audio-metadata.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("Audio metadata: PASSED")
          print(f"Verse: {requested_key}")
          print(f"Start: {start_ms} ms")
          print(f"End: {end_ms} ms")
          print(
              f"Duration: {end_ms - start_ms} ms"
          )
          print("Audio URL: received")
          PY


      # ============================================================
      # 7. DOWNLOAD CHAPTER AUDIO
      # ============================================================

      - name: Download Saad Al-Ghamdi chapter audio
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          with open(
              "output/audio-metadata.json",
              encoding="utf-8",
          ) as f:
              metadata = json.load(f)

          url = metadata["chapter_audio_url"]

          print("Downloading chapter audio...")

          response = requests.get(
              url,
              stream=True,
              timeout=120,
          )

          if not response.ok:
              print(
                  f"ERROR: Audio download failed: "
                  f"HTTP {response.status_code}"
              )
              sys.exit(1)

          content_type = (
              response.headers.get(
                  "content-type",
                  ""
              )
              .lower()
          )

          print(
              f"Audio response: HTTP {response.status_code}"
          )
          print(
              f"Content type: {content_type}"
          )

          if (
              "audio" not in content_type
              and "mpeg" not in content_type
              and "octet-stream" not in content_type
          ):
              print(
                  "ERROR: Downloaded resource does not "
                  "look like audio."
              )
              sys.exit(1)

          with open(
              "output/chapter-audio.mp3",
              "wb",
          ) as f:
              for chunk in response.iter_content(
                  chunk_size=1024 * 1024
              ):
                  if chunk:
                      f.write(chunk)

          size = os.path.getsize(
              "output/chapter-audio.mp3"
          )

          if size < 10000:
              print(
                  "ERROR: Downloaded audio is "
                  "unexpectedly small."
              )
              sys.exit(1)

          print(
              f"Chapter audio downloaded: {size} bytes"
          )
          PY


      # ============================================================
      # 8. EXTRACT EXACT AYAH AUDIO
      # ============================================================

      - name: Extract exact Saad Al-Ghamdi ayah
        run: |
          set -euo pipefail

          START_MS=$(python3 - <<'PY'
          import json
          with open("output/audio-metadata.json") as f:
              print(json.load(f)["start_ms"])
          PY
          )

          END_MS=$(python3 - <<'PY'
          import json
          with open("output/audio-metadata.json") as f:
              print(json.load(f)["end_ms"])
          PY
          )

          START_SEC=$(python3 - <<PY
          print(float("$START_MS") / 1000)
          PY
          )

          END_SEC=$(python3 - <<PY
          print(float("$END_MS") / 1000)
          PY
          )

          DURATION_SEC=$(python3 - <<PY
          print(float("$END_MS" - "$START_MS") / 1000)
          PY
          )

          echo "Extracting:"
          echo "  start = ${START_SEC}s"
          echo "  duration = ${DURATION_SEC}s"

          ffmpeg \
            -y \
            -ss "$START_SEC" \
            -i output/chapter-audio.mp3 \
            -t "$DURATION_SEC" \
            -vn \
            -acodec libmp3lame \
            -q:a 2 \
            output/ayah-audio.mp3


      # ============================================================
      # 9. VERIFY ACTUAL AUDIO
      # ============================================================

      - name: Verify ayah audio
        run: |
          set -euo pipefail

          if [ ! -s output/ayah-audio.mp3 ]; then
            echo "ERROR: Ayah audio file is empty."
            exit 1
          fi

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/ayah-audio.mp3)

          echo "Extracted audio duration: ${DURATION}s"

          python3 - <<PY
          duration = float("$DURATION")

          if duration <= 0.1:
              raise SystemExit(
                  "ERROR: Extracted audio duration is invalid."
              )

          print("Actual ayah audio: VERIFIED")
          PY


      # ============================================================
      # 10. FETCH QURAN TEXT + SAEHEEH INTERNATIONAL
      # ============================================================

      - name: Fetch Quran text and translation 20
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
        run: |
          set -euo pipefail

          source output/auth.env

          python3 - <<'PY'
          import json
          import os
          import sys
          import requests

          api_base = os.environ["QF_API_BASE"]
          token = os.environ["QF_ACCESS_TOKEN"]
          client_id = os.environ["QF_CLIENT_ID"]

          verse_key = os.environ["VERSE_KEY"]

          headers = {
              "x-auth-token": token,
              "x-client-id": client_id,
          }

          response = requests.get(
              f"{api_base}/content/api/v4/"
              f"verses/by_key/{verse_key}",
              params={
                  "translations": "20",
                  "fields": "text_uthmani",
              },
              headers=headers,
              timeout=30,
          )

          print(
              f"Quran text request: "
              f"HTTP {response.status_code}"
          )

          if not response.ok:
              print(
                  "ERROR: Quran text request failed."
              )
              sys.exit(1)

          data = response.json()

          verse = data.get("verse")

          if not isinstance(verse, dict):
              print("ERROR: No verse returned.")
              sys.exit(1)

          arabic = verse.get(
              "text_uthmani"
          )

          if not isinstance(arabic, str) or not arabic.strip():
              print(
                  "ERROR: Arabic text missing."
              )
              sys.exit(1)

          translations = verse.get(
              "translations",
              []
          )

          selected = None

          for translation in translations:

              if str(
                  translation.get("resource_id")
              ) == "20":

                  selected = translation
                  break

          if selected is None:
              print(
                  "ERROR: Saheeh International "
                  "resource 20 was not returned."
              )
              sys.exit(1)

          english = selected.get("text")

          if not isinstance(
              english,
              str,
          ) or not english.strip():

              print(
                  "ERROR: Translation 20 "
                  "contains no usable text."
              )
              sys.exit(1)

          safe_output = {
              "verse_key": verse_key,
              "translation_resource_id": 20,
              "arabic_text": arabic,
              "translation_text": english,
          }

          with open(
              "output/verse.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  safe_output,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("Quran text: received")
          print(
              "Saheeh International resource 20: received"
          )
          print(
              "Translation text: usable"
          )
          PY


      # ============================================================
      # 11. CREATE SAFE AUDIO MANIFEST
      # ============================================================

      - name: Create safe audio manifest
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(
              "output/reciter.json",
              encoding="utf-8",
          ) as f:
              reciter = json.load(f)

          with open(
              "output/audio-metadata.json",
              encoding="utf-8",
          ) as f:
              audio = json.load(f)

          with open(
              "output/verse.json",
              encoding="utf-8",
          ) as f:
              verse = json.load(f)

          manifest = {
              "verse_key": verse["verse_key"],
              "translation_resource_id": 20,
              "reciter": {
                  "id": reciter.get("id"),
                  "name": reciter.get("name"),
                  "style": reciter.get("style"),
                  "qirat": reciter.get("qirat"),
              },
              "audio": {
                  "start_ms": audio["start_ms"],
                  "end_ms": audio["end_ms"],
                  "duration_ms": audio["duration_ms"],
                  "file": "ayah-audio.mp3",
              },
              "content": {
                  "arabic_text": verse["arabic_text"],
                  "translation_text": verse["translation_text"],
              },
          }

          with open(
              "output/quran-audio-manifest.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  manifest,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("==========================================")
          print("QURAN AUDIO TEST: PASSED")
          print("==========================================")
          print(
              f"Verse: {verse['verse_key']}"
          )
          print(
              f"Reciter: {reciter.get('name')}"
          )
          print(
              f"Translation resource: 20"
          )
          print(
              f"Audio duration: "
              f"{audio['duration_ms']} ms"
          )
          print(
              "Arabic: received"
          )
          print(
              "Translation: received"
          )
          print(
              "Ayah audio: verified"
          )
          print(
              "Credentials: NOT written to output"
          )
          print("==========================================")
          PY


      # ============================================================
      # 12. UPLOAD TEST ARTIFACTS
      # ============================================================

      - name: Upload audio test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-audio-test
          path: |
            output/quran-audio-manifest.json
            output/verse.json
            output/audio-metadata.json
            output/reciter.json
            output/ayah-audio.mp3
          retention-days: 1
