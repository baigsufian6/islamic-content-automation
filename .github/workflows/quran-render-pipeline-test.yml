name: Quran Render Pipeline Test

on:
  workflow_dispatch:

jobs:
  render-quran-test:
    runs-on: ubuntu-latest
    environment: Quran API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FFmpeg and Arabic font support
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          fc-match "Noto Naskh Arabic"

      - name: Create pipeline input
        run: |
          mkdir -p output

          cat > output/quran-pipeline-input.json <<'JSON'
          {
            "verse_key": "1:1",
            "arabic_text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ",
            "translation": {
              "resource_id": 20,
              "text": "In the name of Allāh,<sup foot_note=227140>1</sup> the Entirely Merciful, the Especially Merciful.<sup foot_note=227141>2</sup>"
            }
          }
          JSON

      - name: Convert Quran input to subtitle file
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("output/quran-pipeline-input.json").read_text(
                  encoding="utf-8"
              )
          )

          verse_key = data["verse_key"]
          arabic = data["arabic_text"].strip()

          resource_id = data["translation"]["resource_id"]
          translation = data["translation"]["text"].strip()

          if resource_id != 20:
              raise SystemExit(
                  f"Unexpected translation resource: {resource_id}"
              )

          if not arabic:
              raise SystemExit("Arabic text is empty")

          if not translation:
              raise SystemExit("Translation text is empty")

          # Remove footnote HTML completely.
          translation = re.sub(
              r"<sup\b[^>]*>.*?</sup>",
              "",
              translation,
              flags=re.IGNORECASE | re.DOTALL,
          )

          # Remove any remaining HTML tags.
          translation = re.sub(r"<[^>]+>", "", translation).strip()

          if not translation:
              raise SystemExit("Translation became empty after cleanup")

          ass = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Reference,Noto Sans,46,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,3,1,8,80,80,140,1
          Style: Arabic,Noto Naskh Arabic,82,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,80,80,0,1
          Style: English,Noto Sans,48,&H00FFFFFF,&H00FFFFFF,&H00101010,&H80000000,0,0,0,0,100,100,0,0,1,3,1,5,100,100,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:08.00,Reference,,0,0,140,,VERSE {verse_key}
          Dialogue: 0,0:00:00.00,0:00:08.00,Arabic,,0,0,0,,{arabic}
          Dialogue: 0,0:00:00.00,0:00:08.00,English,,0,0,0,,{translation}
          """

          Path("output/quran-test.ass").write_text(
              ass,
              encoding="utf-8"
          )

          print(f"Verse: {verse_key}")
          print(f"Translation resource: {resource_id}")
          print("Arabic text: received")
          print("Translation text: received")
          print("Subtitle file: created")
          PY

      - name: Create test background
        run: |
          ffmpeg \
            -y \
            -f lavfi \
            -i "testsrc2=size=1080x1920:rate=30" \
            -t 8 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/background.mp4

      - name: Render Quran verse
        run: |
          ffmpeg \
            -y \
            -i output/background.mp4 \
            -vf "subtitles=output/quran-test.ass:fontsdir=/usr/share/fonts/truetype/noto" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/quran-render-test.mp4

      - name: Verify rendered video
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/quran-render-test.mp4

      - name: Upload render test artifact
        uses: actions/upload-artifact@v6
        with:
          name: quran-render-pipeline-test
          path: |
            output/quran-render-test.mp4
            output/quran-pipeline-input.json
            output/quran-test.ass
          retention-days: 1
